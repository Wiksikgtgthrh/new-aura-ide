<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-__NONCE__'; img-src data:; font-src data:;">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LangGraph Оркестратор</title>
<style>
:root {
	--gap: 8px;
	--gap-lg: 12px;
	--gap-xl: 16px;
	--radius: 6px;
	--radius-sm: 4px;
	--border: var(--vscode-panel-border, rgba(128, 128, 128, .35));
	--surface: var(--vscode-editorWidget-background, rgba(128, 128, 128, .06));
	--surface-2: var(--vscode-sideBar-background, var(--surface));
	--muted: var(--vscode-descriptionForeground);
	--c-ok: var(--vscode-charts-green, #89d185);
	--c-run: var(--vscode-charts-blue, #3794ff);
	--c-warn: var(--vscode-charts-yellow, #cca700);
	--c-err: var(--vscode-charts-red, #f14c4c);
	--c-llm: var(--vscode-charts-purple, #b180d7);
	--mono: var(--vscode-editor-font-family, ui-monospace, monospace);
}
* { box-sizing: border-box; }
body {
	font-family: var(--vscode-font-family);
	font-size: var(--vscode-font-size, 13px);
	line-height: 1.4;
	color: var(--vscode-foreground);
	background: var(--vscode-editor-background);
	margin: 0;
	padding: 0 var(--gap-xl) 28px;
}
[hidden] { display: none !important; }
svg { display: block; }
/* Шапка: название + состояние сайдкара слева, бюджет и управление запуском справа. */
header {
	display: flex;
	align-items: center;
	gap: var(--gap-lg);
	padding: 14px 0 10px;
	background: var(--vscode-editor-background);
	flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark {
	width: 28px; height: 28px; border-radius: 7px; flex: 0 0 auto;
	display: inline-flex; align-items: center; justify-content: center;
	background: var(--vscode-button-background); color: var(--vscode-button-foreground);
}
.brand-mark svg { width: 16px; height: 16px; }
.brand-text { display: flex; flex-direction: column; min-width: 0; }
h1 { font-size: 14px; margin: 0; font-weight: 600; white-space: nowrap; }
.spacer { flex: 1 1 auto; }
/* Состояние сайдкара: точка + подпись, без кричащей заливки. */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); white-space: nowrap; }
.chip::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
.chip.ready::before { background: var(--c-ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-ok) 22%, transparent); }
.chip.starting::before { background: var(--c-warn); animation: pulse 1.2s ease-in-out infinite; }
.chip.error { color: var(--c-err); }
.chip.error::before { background: var(--c-err); }
@keyframes pulse { 50% { opacity: .35; } }
@keyframes spin { to { transform: rotate(360deg); } }
/* Бюджетный чип с полоской расхода. */
.budget-chip { display: flex; flex-direction: column; gap: 4px; min-width: 190px; }
.budget-chip .btext { font-size: 11px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.budget-chip .bbar { height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--vscode-foreground) 12%, transparent); overflow: hidden; }
.budget-chip .bbar > span { display: block; height: 100%; border-radius: 2px; background: var(--c-ok); transition: width .3s ease; }
.budget-chip.warn .bbar > span { background: var(--c-warn); }
.budget-chip.err .bbar > span { background: var(--c-err); }
.controls { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.icon-btn {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	width: 30px;
	height: 28px;
	border: none;
	border-radius: 0;
	background: transparent;
	color: var(--vscode-foreground);
	cursor: pointer;
	padding: 0;
}
.controls .icon-btn + .icon-btn { border-left: 1px solid var(--border); }
.icon-btn:hover:not(:disabled) { background: var(--vscode-toolbar-hoverBackground, rgba(128, 128, 128, .15)); }
.icon-btn:disabled { opacity: .35; cursor: default; }
.icon-btn svg { width: 14px; height: 14px; fill: currentColor; }
#btnStop:not(:disabled) { color: var(--c-err); }
/* Баннер о сайдкаре: причина ошибки видна сразу, а не только в подсказке бейджа. */
.banner {
	display: flex; align-items: flex-start; gap: 10px;
	padding: 10px 12px; margin: 4px 0 var(--gap);
	border: 1px solid var(--border); border-left: 3px solid var(--c-warn);
	border-radius: var(--radius); background: var(--surface);
}
.banner.error { border-left-color: var(--c-err); }
.banner .banner-body { flex: 1 1 auto; min-width: 0; }
.banner .banner-title { font-weight: 600; }
.banner .banner-text { font-size: 12px; color: var(--muted); margin-top: 2px; word-break: break-word; }
.banner .banner-text code { font-family: var(--mono); font-size: 11px; }
/* Навигация по вкладкам. */
nav { display: flex; gap: 4px; margin: 0 0 var(--gap-xl); border-bottom: 1px solid var(--border); }
nav button {
	background: transparent;
	border: none;
	border-bottom: 2px solid transparent;
	border-radius: 0;
	color: var(--muted);
	padding: 7px 10px;
	margin-bottom: -1px;
	cursor: pointer;
	font-size: 13px;
}
nav button:hover { color: var(--vscode-foreground); }
nav button.active { color: var(--vscode-foreground); border-bottom-color: var(--vscode-panelTitle-activeBorder, var(--vscode-focusBorder)); }
section { display: none; }
section.active { display: block; animation: fade .15s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(2px); } }
h2 { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 22px 0 var(--gap); font-weight: 600; }
h2 .count { font-size: 11px; font-weight: 500; color: var(--muted); padding: 0 6px; border-radius: 8px; background: color-mix(in srgb, var(--vscode-foreground) 10%, transparent); }
h3 { font-size: 12px; margin: var(--gap-lg) 0 4px; font-weight: 600; color: var(--muted); }
.row { display: flex; gap: var(--gap); margin: var(--gap) 0; align-items: center; flex-wrap: wrap; }
.muted { color: var(--muted); font-size: 12px; }
textarea {
	width: 100%;
	min-height: 68px;
	background: var(--vscode-input-background);
	color: var(--vscode-input-foreground);
	border: 1px solid var(--vscode-input-border, var(--border));
	border-radius: var(--radius-sm);
	padding: var(--gap);
	font-family: inherit;
	font-size: inherit;
	resize: vertical;
}
input[type="text"], input[type="number"], select {
	background: var(--vscode-input-background);
	color: var(--vscode-input-foreground);
	border: 1px solid var(--vscode-input-border, var(--border));
	border-radius: var(--radius-sm);
	padding: 4px 7px;
	font-family: inherit;
	font-size: 12px;
	min-height: 26px;
}
select { background: var(--vscode-dropdown-background, var(--vscode-input-background)); color: var(--vscode-dropdown-foreground, var(--vscode-input-foreground)); border-color: var(--vscode-dropdown-border, var(--border)); }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 1px solid var(--vscode-focusBorder); outline-offset: -1px; }
button { font-family: inherit; font-size: 12px; border-radius: var(--radius-sm); cursor: pointer; }
button.primary { background: var(--vscode-button-background); color: var(--vscode-button-foreground); border: 1px solid transparent; padding: 5px 14px; font-weight: 500; }
button.primary:hover:not(:disabled) { background: var(--vscode-button-hoverBackground); }
button.ghost { background: var(--vscode-button-secondaryBackground); color: var(--vscode-button-secondaryForeground); border: 1px solid transparent; padding: 5px 11px; }
button.ghost:hover:not(:disabled) { background: var(--vscode-button-secondaryHoverBackground, var(--vscode-button-secondaryBackground)); }
button.tiny { background: transparent; color: var(--vscode-textLink-foreground); border: none; padding: 2px 4px; font-size: 11px; }
button.tiny:hover:not(:disabled) { text-decoration: underline; }
button:disabled { opacity: .5; cursor: default; }
.kbd { font-family: var(--mono); font-size: 10px; padding: 1px 5px; border-radius: 3px; border: 1px solid var(--border); color: var(--muted); }
/* Композер задачи: поле и панель действий в одной рамке. */
.composer {
	border: 1px solid var(--vscode-input-border, var(--border));
	border-radius: var(--radius);
	background: var(--vscode-input-background);
	transition: border-color .15s;
}
.composer:focus-within { border-color: var(--vscode-focusBorder); }
.composer textarea { border: none; background: transparent; min-height: 76px; padding: 12px 12px 6px; outline: none; display: block; }
.composer textarea:focus { outline: none; }
.composer-bar { display: flex; align-items: center; gap: var(--gap); padding: 6px 8px 8px; flex-wrap: wrap; }
.composer-bar .defaults { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.composer-bar .defaults span { font-size: 11px; color: var(--muted); padding: 1px 7px; border-radius: 9px; background: color-mix(in srgb, var(--vscode-foreground) 8%, transparent); white-space: nowrap; }
.composer-bar .start-hint { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
/* Переключатель источника задачи и сегменты тиров. */
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; background: var(--vscode-editor-background); }
.seg button { background: transparent; color: var(--muted); border: none; border-radius: 0; padding: 3px 10px; font-size: 12px; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button:hover:not(.active) { color: var(--vscode-foreground); }
.seg button.active { background: var(--vscode-button-background); color: var(--vscode-button-foreground); }
.last-task { margin-top: var(--gap); }
/* Полоса состояния запуска. */
.runbar {
	display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 14px; align-items: center;
	margin-top: var(--gap-xl); padding: 10px 12px;
	border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
}
.runbar .run-facts { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.runbar .run-facts b { color: var(--vscode-foreground); font-weight: 600; }
.runbar .run-progress { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--vscode-foreground) 10%, transparent); overflow: hidden; display: flex; }
.runbar .run-progress > span { display: block; height: 100%; transition: width .3s ease; }
.runbar .run-progress .p-done { background: var(--c-ok); }
.runbar .run-progress .p-err { background: var(--c-err); }
.runbar .run-progress .p-run { background: var(--c-run); opacity: .7; }
.runbar .run-summary { grid-column: 1 / -1; font-size: 12px; }
.status-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px 2px 7px; border-radius: 10px; background: color-mix(in srgb, currentColor 14%, transparent); white-space: nowrap; }
.status-pill .si { width: 13px; height: 13px; }
.status-pill.running { color: var(--c-run); }
.status-pill.done { color: var(--c-ok); }
.status-pill.error { color: var(--c-err); }
.status-pill.cancelled, .status-pill.idle { color: var(--muted); }
/* Иконки статусов: SVG в currentColor, крутится только «работает». */
.si { width: 14px; height: 14px; flex: 0 0 auto; display: inline-flex; }
.si svg { width: 100%; height: 100%; }
.si.running svg { animation: spin 1s linear infinite; }
.st { display: inline-flex; align-items: center; justify-content: center; }
.st.done { color: var(--c-ok); }
.st.running { color: var(--c-run); }
.st.error { color: var(--c-err); }
.st.needs_human, .st.waiting-approval { color: var(--c-warn); }
.st.skipped, .st.idle { color: var(--muted); }
/* Живые агенты запуска. */
.agents { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: var(--gap); }
.agent {
	position: relative; display: flex; flex-direction: column; gap: 6px;
	padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius);
	background: var(--surface); min-width: 0; cursor: pointer; text-align: left; color: inherit; font-size: 12px;
}
.agent:hover { border-color: color-mix(in srgb, var(--vscode-focusBorder) 60%, var(--border)); }
.agent.selected { border-color: var(--vscode-focusBorder); }
.agent.running { border-color: color-mix(in srgb, var(--c-run) 55%, var(--border)); }
.agent.waiting-approval, .agent.needs_human { border-color: color-mix(in srgb, var(--c-warn) 60%, var(--border)); }
.agent.error { border-color: color-mix(in srgb, var(--c-err) 55%, var(--border)); }
.agent.skipped, .agent.idle { opacity: .8; }
.agent-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.avatar {
	width: 24px; height: 24px; border-radius: 6px; flex: 0 0 auto;
	display: inline-flex; align-items: center; justify-content: center;
	font-size: 11px; font-weight: 700; color: var(--vscode-editor-background);
}
.avatar.supervisor { background: var(--c-llm); }
.avatar.coder { background: var(--c-run); }
.avatar.tester { background: var(--c-ok); }
.avatar.security-auditor { background: var(--c-err); }
.avatar.reviewer { background: var(--c-warn); }
.avatar.other { background: var(--muted); }
.agent-name { display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; }
.agent-name b { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent-name span { font-family: var(--mono); font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent-state { display: flex; align-items: center; justify-content: flex-start; gap: 6px; font-size: 11px; }
.agent-state .label { font-weight: 500; }
.agent-note { color: var(--muted); font-size: 11px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
.agent-note.err-text { color: var(--c-err); }
.agent-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.agent-meta .dot-sep::before { content: '·'; }
/* План как список-DAG. */
.plan { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); gap: var(--gap-lg); align-items: start; }
@media (max-width: 720px) { .plan { grid-template-columns: minmax(0, 1fr); } }
.plan-list { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.plan-row {
	display: grid;
	grid-template-columns: 16px minmax(0, 1fr) auto;
	gap: 10px;
	align-items: center;
	padding: 8px 12px;
	border: none;
	border-bottom: 1px solid var(--border);
	border-radius: 0;
	cursor: pointer;
	text-align: left;
	background: transparent;
	width: 100%;
	color: inherit;
	font-size: 13px;
}
.plan-row:last-child { border-bottom: none; }
.plan-row:hover { background: var(--vscode-list-hoverBackground, var(--surface)); }
.plan-row.selected { background: var(--vscode-list-inactiveSelectionBackground, var(--surface)); box-shadow: inset 2px 0 0 var(--vscode-focusBorder); }
.plan-row .goal { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plan-row .goal .dep { display: inline-block; width: 8px; height: 8px; margin: 0 6px 3px 0; border-left: 1px solid var(--muted); border-bottom: 1px solid var(--muted); border-bottom-left-radius: 2px; opacity: .7; }
.plan-row .meta { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }
/* Тир-бейдж: цвета из темы. */
.tier { font-size: 10px; font-weight: 600; letter-spacing: .03em; padding: 0 5px; border-radius: 3px; line-height: 16px; color: var(--muted); background: color-mix(in srgb, currentColor 14%, transparent); }
.tier.low { color: var(--c-ok); }
.tier.mid { color: var(--c-warn); }
.tier.high { color: var(--c-err); }
/* Панель детали ноды. */
.detail { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; background: var(--surface); position: sticky; top: 8px; }
.detail .detail-head { display: flex; align-items: center; gap: 8px; }
.detail .detail-head .card-title { flex: 1 1 auto; min-width: 0; }
.detail .detail-id { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.detail h3:first-of-type { margin-top: 10px; }
.detail pre { margin: 4px 0 0; }
.detail .row { margin-top: var(--gap-lg); }
.detail-empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 8px; text-align: center; }
.detail-empty svg { width: 22px; height: 22px; opacity: .5; }
pre {
	background: var(--vscode-textCodeBlock-background);
	border-radius: var(--radius-sm);
	padding: 10px 12px;
	overflow: auto;
	font-family: var(--mono);
	font-size: 12px;
	max-height: 300px;
	white-space: pre-wrap;
	word-break: break-word;
	margin: 0;
}
/* Блок «Ждёт тебя». */
.waiting { border: 1px solid color-mix(in srgb, var(--c-warn) 55%, var(--border)); border-left: 3px solid var(--c-warn); border-radius: var(--radius); padding: 12px 14px; margin: 0 0 var(--gap-lg); background: color-mix(in srgb, var(--c-warn) 7%, var(--vscode-editor-background)); }
.waiting .title { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: var(--gap); color: var(--vscode-foreground); }
.waiting .title .si { color: var(--c-warn); }
.waiting .body { font-size: 12px; white-space: pre-wrap; margin-bottom: var(--gap); }
.waiting .approval + .approval { margin-top: var(--gap-lg); padding-top: var(--gap-lg); border-top: 1px solid var(--border); }
.waiting .approval-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 12px; margin-bottom: 6px; }
.waiting .approval-head code { font-family: var(--mono); font-weight: 600; }
.waiting .approval-head .muted { font-size: 11px; }
.waiting .row { margin-bottom: 0; }
.waiting input[type="text"] { width: 100%; margin-bottom: 8px; }
.waiting.patch { border-color: color-mix(in srgb, var(--c-ok) 55%, var(--border)); border-left-color: var(--c-ok); background: color-mix(in srgb, var(--c-ok) 6%, var(--vscode-editor-background)); }
.waiting.patch .title .si { color: var(--c-ok); }
/* Таймлайн чекпоинтов. */
.timeline { position: relative; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 2px; }
.timeline.has-dots::before { content: ''; position: absolute; left: 6px; right: 6px; top: 50%; height: 1px; background: var(--border); }
.dot {
	position: relative;
	width: 12px;
	height: 12px;
	border-radius: 50%;
	border: 2px solid var(--vscode-editor-background);
	box-shadow: 0 0 0 1px var(--muted);
	background: var(--vscode-editor-background);
	cursor: pointer;
	padding: 0;
}
.dot:last-child { background: var(--vscode-focusBorder); box-shadow: 0 0 0 1px var(--vscode-focusBorder); }
.dot:hover { background: var(--vscode-focusBorder); transform: scale(1.2); }
.dot:disabled { opacity: .5; }
/* Пустое состояние с примерами. */
.empty { margin-top: var(--gap-lg); padding: 14px 16px; border: 1px dashed var(--border); border-radius: var(--radius); }
.empty .examples { display: flex; gap: var(--gap); flex-wrap: wrap; margin-top: var(--gap); }
.example {
	display: inline-flex; align-items: center; gap: 6px;
	border: 1px solid var(--border);
	border-radius: 14px;
	background: transparent;
	color: var(--vscode-foreground);
	padding: 4px 11px;
	font-size: 12px;
}
.example::before { content: '↗'; color: var(--vscode-textLink-foreground); }
.example:hover { background: var(--vscode-list-hoverBackground, var(--surface)); border-color: var(--vscode-focusBorder); }
/* Канбан доски. */
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: var(--gap-lg); align-items: start; margin-top: var(--gap-lg); }
.column { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; background: var(--surface); }
.col-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; margin-bottom: var(--gap); }
.col-head span + span { font-size: 11px; font-weight: 500; color: var(--muted); padding: 0 6px; border-radius: 8px; background: color-mix(in srgb, var(--vscode-foreground) 10%, transparent); }
.col-body { display: flex; flex-direction: column; gap: var(--gap); }
.card { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; background: var(--vscode-editor-background); }
.card .card-title { font-weight: 600; font-size: 12px; word-break: break-word; }
.card .card-meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
.card .card-meta:empty { display: none; }
.card .card-acts { margin-top: 6px; display: flex; gap: 6px; }
/* Своя задача на доске: поле тянется, колонка и кнопка — по содержимому. */
.add-task { display: flex; gap: var(--gap); align-items: center; flex-wrap: wrap; margin: var(--gap) 0; }
.add-task input { flex: 1 1 160px; min-width: 120px; }
.add-task select { flex: 0 0 auto; }
/* Сводка по тирам. */

.pill.ok, .pill.done { color: var(--c-ok); }
.pill.slow, .pill.cooldown, .pill.unknown, .pill.checking { color: var(--c-warn); }
.pill.dead, .pill.error { color: var(--c-err); }
.pill.excluded, .pill.skipped { color: var(--muted); }
.warn-text { color: var(--c-warn); }
.err-text { color: var(--c-err); }
.ok-text { color: var(--c-ok); }
/* Водопад спанов: полоса стоит там, где спан шёл во времени запуска. */
.trace-legend { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: var(--gap-xl); }
.trace-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
/* Строки — subgrid общей сетки: колонка метрик одной ширины, и оси всех полос совпадают. */
.wf { margin-top: var(--gap); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display: grid; grid-template-columns: minmax(110px, 220px) minmax(120px, 1fr) max-content; }

.wf-row { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; column-gap: 12px; align-items: center; padding: 6px 12px; font-size: 12px; border-bottom: 1px solid var(--border); }
.wf-row:last-child { border-bottom: none; }
.wf-row:hover { background: var(--vscode-list-hoverBackground, transparent); }
.wf-row .wf-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 6px; min-width: 0; }
.wf-row .wf-name .n { overflow: hidden; text-overflow: ellipsis; }
.wf-row.llm .wf-name { padding-left: 14px; color: var(--muted); }
.wf-row .wf-bar { position: relative; background: color-mix(in srgb, var(--vscode-foreground) 6%, transparent); border-radius: 3px; height: 10px; }
.wf-row .wf-bar > span { position: absolute; top: 0; bottom: 0; min-width: 3px; border-radius: 3px; background: var(--c-run); }
.wf-row.llm .wf-bar > span { background: var(--c-llm); }
.wf-row.err .wf-bar > span { background: var(--c-err); }
.wf-row .wf-meta { color: var(--muted); text-align: right; white-space: nowrap; font-size: 11px; font-variant-numeric: tabular-nums; }
.toplist { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--gap-lg); }
.toplist .card { background: var(--surface); padding: 12px 14px; }
.toplist .card h4 { margin: 0 0 8px; font-size: 12px; font-weight: 600; }
.toplist .row-item { display: flex; justify-content: space-between; gap: var(--gap); font-size: 12px; padding: 4px 0; border-top: 1px solid var(--border); }
.toplist .row-item span:first-child { font-family: var(--mono); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toplist .row-item .muted { font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }
/* Журнал. */
.log-tools { display: flex; gap: var(--gap-xl); align-items: center; flex-wrap: wrap; margin-bottom: var(--gap); }
.log-tools .filter { display: inline-flex; align-items: center; gap: 6px; }
.log-box {

	font-size: var(--vscode-editor-font-size, 12px);
	background: var(--vscode-textCodeBlock-background);

	border-radius: var(--radius);
	padding: 8px 0;
	overflow: auto;
	max-height: 62vh;
	word-break: break-word;
}
.log-box > .muted { padding: 4px 12px; }
.log-line { display: grid; grid-template-columns: 60px 76px minmax(0, 1fr); gap: 10px; padding: 2px 12px; align-items: baseline; }
.log-line.has-node { grid-template-columns: 60px 76px auto minmax(0, 1fr); }
.log-line .lvl { justify-self: start; }
.log-line:hover { background: var(--vscode-list-hoverBackground, transparent); }
.log-line .ts { color: var(--muted); opacity: .8; font-size: 11px; }
.log-line .lvl { font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 3px; line-height: 16px; text-transform: uppercase; color: var(--muted); background: color-mix(in srgb, currentColor 14%, transparent); }
.log-line .node { color: var(--vscode-textLink-foreground); }

.log-line.error .lvl { color: var(--c-err); }

.budget .bcard { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; background: var(--surface); }

.budget .bbar2 > span { display: block; height: 100%; background: var(--c-ok); }
.budget .bbar2.warn > span { background: var(--c-warn); }
.budget .bbar2.err > span { background: var(--c-err); }

.budget .bedit label { font-size: 11px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
.budget .bedit input { width: 110px; }
.budget .bedit table input { width: 100px; }
.budget .bedit .rule { display: grid; grid-template-columns: minmax(0, 1fr) 100px 100px auto; gap: 6px; align-items: center; margin-top: 4px; }
.budget .bedit .rule input { width: 100%; }
.budget .bedit .saved { color: var(--c-ok); }
.budget .bedit .failed { color: var(--c-err); }

	STATUS_ICON.cancelled = STATUS_ICON.skipped;
	const COLUMNS = [
		{ key: 'todo', status: 'todo' },
		{ key: 'doing', status: 'doing' },

		sidecar: '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 1.5 14 5v6l-6 3.5L2 11V5zm0 1.4L3.2 5.7v4.6L8 13.1l4.8-2.8V5.7z"/></svg>',
	};

	// ---- единый reducer состояния webview (серверный снапшот + локальный UI) ----
	const DEFAULT_UI = {
		server: null,
		tab: 'run',
		task: '',
		source: 'own',
		boardTaskId: '',
		selectedNode: null,
		logLevel: 'all',
		logNode: 'all',
		logPinned: true,
	};
	let ui = loadUi();

	function loadUi() {
		let saved = null;
		try { saved = vscode.getState ? vscode.getState() : null; } catch { saved = null; }
		return saved ? { ...DEFAULT_UI, ...saved, server: null } : { ...DEFAULT_UI };
	}

	function reduce(current, action) {
		switch (action.type) {
			case 'server':
				return { ...current, server: action.payload };
			case 'tab':
				return { ...current, tab: action.payload };
			case 'task':
				return { ...current, task: action.payload };
			case 'source':
				return { ...current, source: action.payload };
			case 'boardTask':
				return { ...current, boardTaskId: action.payload };
			case 'selectNode':
				return { ...current, selectedNode: action.payload };
			case 'logLevel':
				return { ...current, logLevel: action.payload };
			case 'logNode':
				return { ...current, logNode: action.payload };
			case 'togglePin':
				return { ...current, logPinned: !current.logPinned };
			default:
				return current;
		}
	}

	// Состояние прилетает пачками (спан, событие графа, строка лога), а render()
	// перерисовывает все семь секций целиком: 30 сообщений в секунду — это 30 полных
	// перерисовок. Схлопываем их в один кадр: важно только последнее состояние,
	// предыдущие всё равно перекрыты. Действия самого пользователя (вкладка, фильтр)
	// рисуются сразу — отзывчивость интерфейса важнее экономии.
	let renderQueued = false;
	function scheduleRender() {
		if (renderQueued) { return; }
		if (typeof window.requestAnimationFrame !== 'function') { render(); return; }
		renderQueued = true;
		window.requestAnimationFrame(() => { renderQueued = false; render(); });
	}

	function dispatch(action) {
		ui = reduce(ui, action);
		try { if (vscode.setState) { vscode.setState(ui); } } catch { /* стенд предпросмотра */ }
		if (action.type === 'server') { scheduleRender(); return; }
		render();
	}

	function state() { return ui.server || {}; }
	function lang() {
		const forced = state().uiLanguage;
		if (forced === 'ru' || forced === 'en') { return forced; }
		return (navigator.language || 'en').toLowerCase().startsWith('ru') ? 'ru' : 'en';
	}
	function T() { return DICTS[lang()]; }
	/** Русские формы после числа: 1 токен, 2 токена, 5 токенов. */
	function plural(count, forms) {
		const n = Math.abs(Number(count) || 0) % 100;
		const last = n % 10;
		if (n > 10 && n < 20) { return forms[2]; }
		if (last === 1) { return forms[0]; }
		if (last >= 2 && last <= 4) { return forms[1]; }
		return forms[2];
	}
	function statusTitle(status) { return T().statuses[status] || status; }
	function statusIcon(status) { return el('span', { class: 'si ' + status, html: STATUS_ICON[status] || STATUS_ICON.idle }); }
	function roleTitle(role) { return T().roles[role] || role; }
	function tierTitle(tier) { return T().tiers[tier] || (tier ? tier.toUpperCase() : ''); }

	// ---- сообщения в расширение: типизированные {type, payload} ----
	let nextId = 1;
	const pending = new Map();

	function invoke(command, args) {
		return new Promise((resolve, reject) => {
			const id = nextId++;
			pending.set(id, { resolve, reject });
			vscode.postMessage({ type: 'invoke', payload: { command, args: args || {}, id } });
			setTimeout(() => {
				if (pending.has(id)) {
					pending.delete(id);
					reject(new Error('invoke timeout'));
				}
			}, 60000);
		});
	}

	// ---- построение DOM: текст всегда через textContent, данные не идут в innerHTML ----
	function el(tag, props, ...kids) {
		const node = document.createElement(tag);
		if (props) {
			for (const key of Object.keys(props)) {
				const value = props[key];
				if (value == null || value === false) { continue; }
				if (key === 'class') { node.className = value; }
				else if (key === 'text') { node.textContent = String(value); }
				else if (key === 'html') { node.innerHTML = value; }
				else if (key === 'dataset') { Object.assign(node.dataset, value); }
				else if (key.startsWith('on') && typeof value === 'function') { node.addEventListener(key.slice(2), value); }
				else { node[key] = value; }
			}
		}
		append(node, kids);
		return node;
	}
	function append(parent, kids) {
		for (const kid of kids) {
			if (kid == null || kid === false) { continue; }
			parent.append(kid);
		}
	}
	function clear(node) { while (node.firstChild) { node.removeChild(node.firstChild); } }
	/**
	 * Заполняет <select> парами value → подпись. Сами опции создаются один раз (иначе слетит
	 * выбранное значение), а подписи переставляются на каждом рендере: первый рендер случается
	 * до снапшота, когда язык ещё неизвестен, и застывшая подпись осталась бы навсегда.
	 */
	const selectOptions = new Map();
	function fillSelect(select, entries) {
		let options = selectOptions.get(select);
		if (!options || options.length !== entries.length) {
			clear(select);
			options = entries.map(entry => el('option', { value: entry.value }));
			for (const option of options) { select.append(option); }
			selectOptions.set(select, options);
		}
		entries.forEach((entry, index) => { options[index].textContent = entry.text; });
	}
	function fmtNum(value) {
		const n = Number(value) || 0;
		return n.toLocaleString(lang() === 'ru' ? 'ru-RU' : 'en-US');
	}
	function fmtTok(value) {
		const n = Number(value) || 0;
		if (n >= 1000000) { return (n / 1000000).toFixed(1) + 'M'; }
		if (n >= 1000) { return (n / 1000).toFixed(1) + 'k'; }
		return String(Math.round(n));
	}
	function fmtMs(ms) {
		const value = Number(ms) || 0;
		if (value >= 60000) { return Math.round(value / 60000) + T().units.min; }
		if (value >= 1000) { return (value / 1000).toFixed(2) + T().units.sec; }
		return value + T().units.ms;
	}
	function duration(node) {
		const from = node.startedAt || node.finishedAt;
		if (!from) { return ''; }
		const to = node.finishedAt || Date.now();
		return fmtMs(Math.max(0, to - from));
	}
	function keyTitle(key) {
		const parts = [statusTitle(key.status)];
		if (key.health) { parts.push('health: ' + key.health); }
		if (key.excludedReason) { parts.push(T().reasons[key.excludedReason] || key.excludedReason); }
		if (key.status === 'excluded') { parts.push(T().reasons.excluded); }
		if (key.checking) { parts.push(T().reasons.checking); }
		if (key.selectable === false) { parts.push(T().reasons.notSelectable); }
		if (key.lastError) { parts.push(key.lastError); }
		return parts.join(' · ');
	}

	// ---- шапка ----
	function renderHeader() {
		const s = state();
		const t = T();
		// Язык документа едет за словарём: <html lang="ru"> в разметке — только стартовое значение.
		document.documentElement.lang = lang();
		document.getElementById('title').textContent = t.title;
		const sidecar = s.sidecar && s.sidecar.state ? s.sidecar : { state: s.sidecarAlive ? 'ready' : 'off' };
		const badge = document.getElementById('sidecarBadge');
		badge.className = 'chip ' + sidecar.state;
		badge.textContent = t['sidecar' + sidecar.state.charAt(0).toUpperCase() + sidecar.state.slice(1)] || sidecar.state;
		badge.title = sidecar.error || '';
		const startBtn = document.getElementById('btnSidecarStart');
		startBtn.textContent = t.sidecarStart;
		// Кнопка в шапке нужна, только когда баннер ниже не показан (свёрнутое «off» без запуска).
		startBtn.hidden = true;
		renderSidecarBanner(t, sidecar, s);

		const chip = document.getElementById('budgetChip');
		const budget = s.budget || {};
		const limits = budget.limits || {};
		const tokens = Number(budget.tokens) || 0;
		const cost = Number(budget.cost) || 0;
		chip.hidden = !s.budget;
		if (s.budget) {
			const tokPart = fmtTok(tokens) + ' / ' + (limits.runTokens > 0 ? fmtTok(limits.runTokens) + ' tok' : t.budgetNoLimit);
			const costPart = '$' + cost.toFixed(2) + ' / ' + (limits.runCost > 0 ? '$' + Number(limits.runCost).toFixed(2) : t.budgetNoLimit);
			document.getElementById('budgetText').textContent = tokPart + ' · ' + costPart;
			const ratio = Math.max(
				limits.runTokens > 0 ? tokens / limits.runTokens : 0,
				limits.runCost > 0 ? cost / limits.runCost : 0,
			);
			const percent = Math.min(100, Math.round(ratio * 100));
			chip.className = 'budget-chip' + (ratio >= 1 ? ' err' : ratio >= 0.75 ? ' warn' : '');
			chip.hidden = false;
			document.getElementById('budgetBar').style.width = Math.max(2, percent) + '%';
		}

		const pauseBtn = document.getElementById('btnPause');
		pauseBtn.innerHTML = ICONS.pause;
		pauseBtn.title = t.pause;
		pauseBtn.hidden = false;
		pauseBtn.disabled = !s.running || s.paused;
		pauseBtn.setAttribute('aria-label', t.pause);
		const resumeBtn = document.getElementById('btnResume');
		resumeBtn.innerHTML = ICONS.continue;
		resumeBtn.title = t.resume;
		resumeBtn.hidden = false;
		resumeBtn.disabled = !s.paused;
		resumeBtn.setAttribute('aria-label', t.resume);
		const stopBtn = document.getElementById('btnStop');
		stopBtn.innerHTML = ICONS.stop;
		stopBtn.title = t.cancel;
		stopBtn.hidden = false;
		stopBtn.disabled = !s.running;
		stopBtn.setAttribute('aria-label', t.cancel);
	}

	/** Баннер: сайдкар в ошибке (с причиной) или ещё не поднят. Пока он работает — баннера нет. */
	function renderSidecarBanner(t, sidecar, s) {
		const host = document.getElementById('sidecarBanner');
		clear(host);
		if (sidecar.state === 'ready' || sidecar.state === 'starting') { return; }
		const failed = sidecar.state === 'error';
		const box = el('div', { class: 'banner' + (failed ? ' error' : '') });
		box.append(el('span', { class: 'si ' + (failed ? 'error err-text' : 'idle'), html: failed ? STATUS_ICON.error : ICONS.sidecar }));
		const body = el('div', { class: 'banner-body' });
		body.append(el('div', { class: 'banner-title', text: failed ? t.sidecarErrorTitle : t.sidecarOffTitle }));
		body.append(el('div', { class: 'banner-text', text: failed ? (sidecar.error ? sidecar.error + ' ' : '') + t.sidecarErrorHint : t.sidecarOffHint }));
		box.append(body);
		const start = el('button', { class: failed ? 'primary' : 'ghost', type: 'button', text: failed ? t.sidecarRetry : t.sidecarStart, onclick: () => invoke('sidecar.start', {}).catch(() => undefined) });
		start.disabled = !!s.running;
		box.append(start);
		host.append(box);
	}

	function renderTabs() {
		const t = T();
		const runBtn = document.getElementById('tabRun');
		runBtn.textContent = t.tabRun;
		const boardBtn = document.getElementById('tabBoard');
		boardBtn.textContent = t.tabBoard;
		boardBtn.hidden = !(state().team && state().team.available);
		document.getElementById('tabModels').textContent = t.tabModels;
		document.getElementById('tabTrace').textContent = t.tabTrace;
		document.getElementById('tabLog').textContent = t.tabLog;
		// Скрытая вкладка (Board без Team) не может быть активной.
		if (ui.tab === 'board' && !(state().team && state().team.available)) { ui.tab = 'run'; }
		for (const key of ['run', 'board', 'models', 'trace', 'log']) {
			const btn = document.getElementById('tab' + key.charAt(0).toUpperCase() + key.slice(1));
			btn.classList.toggle ? btn.classList.toggle('active', ui.tab === key) : undefined;
			const section = document.getElementById('tab-' + key);
			section.classList.toggle ? section.classList.toggle('active', ui.tab === key) : undefined;
		}
	}

	// ---- Run ----
	function planDepth(nodes) {
		const byId = new Map(nodes.map(n => [n.id, n]));
		const depth = new Map();
		const visit = (id, seen) => {
			if (depth.has(id)) { return depth.get(id); }
			if (seen.has(id)) { return 0; }
			seen.add(id);
			const node = byId.get(id);
			const deps = (node && node.deps) || [];
			const value = deps.length ? 1 + Math.max(...deps.map(dep => visit(dep, seen))) : 0;
			depth.set(id, value);
			return value;
		};
		for (const node of nodes) { visit(node.id, new Set()); }
		return depth;
	}
	function nodeStatus(id, results, itemState, live) {
		const liveNode = (live || []).find(n => n.id === id);
		if (liveNode && liveNode.status) { return liveNode.status; }
		const result = results[id];
		if (result && result.status) {
			const map = { ok: 'done', failed: 'error', needs_human: 'needs_human', denied: 'error', skipped: 'skipped' };
			return map[result.status] || result.status;
		}
		const item = itemState[id];
		if (item === 'done') { return 'done'; }
		if (item === 'failed') { return 'error'; }
		if (item === 'needs_human') { return 'needs_human'; }
		if (item === 'skipped' || item === 'denied') { return 'skipped'; }
		if (item === 'dispatched' || item === 'queued') { return 'running'; }
		return 'idle';
	}
	function nodeModel(id, trace) {
		const span = (trace.spans || []).find(sp => sp.kind === 'llm' && sp.node === id && sp.model);
		return span ? span.model : ((state().nodes || []).find(n => n.id === id) || {}).keyName || '';
	}
	function nodeExample(task) { dispatch({ type: 'task', payload: task }); }

	function renderRun() {
		const t = T();
		const s = state();
		const checkpoint = s.lastCheckpoint || {};
		const plan = Array.isArray(checkpoint.plan) ? checkpoint.plan : [];
		const results = checkpoint.results || {};
		const itemState = checkpoint.itemState || {};
		const attempts = checkpoint.attempts || {};
		const nodes = Array.isArray(s.nodes) ? s.nodes : [];

		document.getElementById('taskInput').placeholder = t.taskPlaceholder;
		if (document.activeElement !== document.getElementById('taskInput')) {
			document.getElementById('taskInput').value = ui.task;
		}
		renderSource(t);
		document.getElementById('btnStart').textContent = t.start;
		const hint = document.getElementById('startHint');
		clear(hint);
		hint.append(el('span', { class: 'kbd', text: 'Ctrl+Enter' }), el('span', { text: t.startHint }));
		document.getElementById('lastTask').textContent = s.lastTask ? t.lastTask + s.lastTask : '';
		document.getElementById('runSummary').textContent = s.run && s.run.summary ? t.runSummary + ': ' + s.run.summary : '';
		renderDefaults(t, s);
		renderRunBar(t, s, nodes);
		renderAgents(t, nodes, s.trace || {});

		const planTitle = document.getElementById('planTitle');
		clear(planTitle);
		planTitle.append(el('span', { text: t.planTitle }));
		if (plan.length) { planTitle.append(el('span', { class: 'count', text: String(plan.length) })); }
		planTitle.hidden = plan.length === 0;
		const detail = document.getElementById('nodeDetail');
		clear(detail);
		if (plan.length === 0) {
			document.getElementById('planWrap').hidden = true;
			renderEmptyRun(t, s, nodes);
		} else {
			document.getElementById('planWrap').hidden = false;
			document.getElementById('runEmpty').hidden = true;
			renderPlan(t, plan, results, itemState, attempts, s.trace || {});
			renderNodeDetail(t, plan, results, checkpoint, s.trace || {});
		}
		renderWaiting(t, s);
		renderPatch(t, s);
		renderTimeline(t);
	}

	function renderSource(t) {
		const seg = document.getElementById('sourceSeg');
		clear(seg);
		const hasBoard = !!(state().team && state().team.available);
		seg.hidden = !hasBoard;
		for (const [key, label] of [['own', t.srcOwn], ['board', t.srcBoard]]) {
			seg.append(el('button', { class: ui.source === key ? 'active' : '', text: label, type: 'button', onclick: () => dispatch({ type: 'source', payload: key }) }));
		}
		const boardSelect = document.getElementById('boardSelect');
		const tasks = ((state().team || {}).tasks || []).filter(task => task.status === 'todo' || task.status === 'doing');
		boardSelect.hidden = ui.source !== 'board' || !hasBoard;
		if (ui.source === 'board') {
			clear(boardSelect);
			boardSelect.append(el('option', { value: '', text: t.boardPlaceholder }));
			for (const task of tasks) {
				boardSelect.append(el('option', { value: task.id, text: task.title }));
			}
			boardSelect.value = ui.boardTaskId;
		}
	}

	function renderDefaults(t, s) {
		const row = document.getElementById('defaultsRow');
		clear(row);
		const defaults = s.runDefaults || {};
		row.append(el('span', { title: t.plannerLabel, text: t.plannerLabel + ': ' + (defaults.planner || t.plannerAuto) + ' · ' + tierTitle(defaults.plannerTier || 'high') }));
		row.append(el('span', { title: t.parallelLabel, text: t.parallelLabel + ': ' + (defaults.maxParallel || 1) }));
	}

	/** Полоса запуска: статус, раунд, сколько подзадач, время и прогресс по нодам. */
	function renderRunBar(t, s, nodes) {
		const bar = document.getElementById('runBar');
		clear(bar);
		const run = s.run || {};
		const active = run.status && run.status !== 'idle';
		bar.hidden = !active && nodes.length === 0;
		if (bar.hidden) { return; }
		const status = run.status || 'idle';
		const pill = el('span', { class: 'status-pill ' + status });
		pill.append(statusIcon(status), el('span', { text: s.paused ? t.pause : statusTitle(status) }));
		bar.append(pill);
		const facts = el('div', { class: 'run-facts' });
		const fact = (label, value) => { const node = el('span', {}); node.append(el('span', { text: label + ' ' }), el('b', { text: value })); facts.append(node); };
		if (run.round) { fact(t.round, run.maxRounds ? run.round + ' ' + t.runOf + ' ' + run.maxRounds : String(run.round)); }
		const planned = Math.max(Number(run.planned) || 0, nodes.filter(n => n.role !== 'supervisor').length);
		if (planned) { fact(plural(planned, t.subtaskForms), String(planned)); }
		const finished = nodes.filter(n => n.status === 'done').length;
		if (nodes.length) { fact(t.runDone, finished + ' ' + t.runOf + ' ' + nodes.length); }
		if (run.startedAt) { fact(t.time, fmtMs(Math.max(0, (run.finishedAt || Date.now()) - run.startedAt))); }
		bar.append(facts, el('span', {}));
		if (nodes.length) {
			const progress = el('div', { class: 'run-progress' });
			const part = (cls, count) => { if (count) { progress.append(el('span', { class: cls, style: 'width:' + (count / nodes.length * 100).toFixed(2) + '%' })); } };
			part('p-done', finished);
			part('p-err', nodes.filter(n => n.status === 'error').length);
			part('p-run', nodes.filter(n => n.status === 'running' || n.status === 'waiting-approval').length);
			bar.append(progress);
		}
		if (run.summary) { bar.append(el('div', { class: 'run-summary', text: t.runSummary + ': ' + run.summary })); }
	}

	/** Карточки агентов: кто сейчас работает, на какой модели, сколько и что делает. */
	function renderAgents(t, nodes, trace) {
		const title = document.getElementById('agentsTitle');
		const host = document.getElementById('agentsHost');
		clear(title);
		clear(host);
		title.hidden = nodes.length === 0;
		host.hidden = nodes.length === 0;
		if (nodes.length === 0) { return; }
		title.append(el('span', { text: t.agentsTitle }));
		const busy = nodes.filter(n => n.status === 'running' || n.status === 'waiting-approval').length;
		title.append(el('span', { class: 'count', text: busy ? busy + ' / ' + nodes.length : String(nodes.length) }));
		for (const node of nodes) {
			const status = node.status || 'idle';
			const role = node.role || String(node.id || '').split('#')[0];
			const known = ['supervisor', 'coder', 'tester', 'security-auditor', 'reviewer'].includes(role);
			const name = roleTitle(role) || node.id;
			const card = el('button', {
				class: 'agent ' + status + (ui.selectedNode === node.id ? ' selected' : ''),
				type: 'button',
				title: node.id,
				onclick: () => dispatch({ type: 'selectNode', payload: node.id }),
			});
			const head = el('div', { class: 'agent-head' });
			head.append(el('span', { class: 'avatar ' + (known ? role : 'other'), text: String(name).charAt(0).toUpperCase() }));
			const label = el('div', { class: 'agent-name' });
			label.append(el('b', { text: name }), el('span', { text: node.id }));
			head.append(label);
			if (node.tier) { head.append(el('span', { class: 'tier ' + node.tier, text: tierTitle(node.tier) })); }
			card.append(head);
			const line = el('div', { class: 'agent-state st ' + status });
			line.append(statusIcon(status), el('span', { class: 'label', text: statusTitle(status) }));
			card.append(line);
			const note = node.error || node.note;
			if (note) { card.append(el('div', { class: 'agent-note' + (node.error ? ' err-text' : ''), text: note })); }
			const meta = el('div', { class: 'agent-meta' });
			const model = nodeModel(node.id, trace) || node.keyName;
			const bits = [model, duration(node), node.round ? t.round + ' ' + node.round : ''].filter(Boolean);
			bits.forEach((bit, index) => {
				if (index) { meta.append(el('span', { class: 'dot-sep' })); }
				meta.append(el('span', { text: bit }));
			});
			if (bits.length) { card.append(meta); }
			host.append(card);
		}
	}

	function renderEmptyRun(t, s, nodes) {
		const host = document.getElementById('runEmpty');
		clear(host);
		// Пока идёт запуск, план ещё не записан в чекпоинт — карточек агентов достаточно.
		host.hidden = nodes.length > 0;
		if (host.hidden) { return; }
		const box = el('div', { class: 'empty' });
		box.append(el('div', { class: 'muted', text: t.planEmpty }));
		const examples = el('div', { class: 'examples' });
		box.append(el('div', { class: 'muted', text: t.runExamples, style: 'margin-top:10px' }));
		for (const task of t.examples) {
			examples.append(el('button', { class: 'example', type: 'button', text: task, onclick: () => nodeExample(task) }));
		}
		box.append(examples);
		host.append(box);
	}

	function renderPlan(t, plan, results, itemState, attempts, trace) {
		const list = document.getElementById('planList');
		clear(list);
		const depth = planDepth(plan);
		for (const item of plan) {
			const status = nodeStatus(item.id, results, itemState, state().nodes);
			const result = results[item.id] || {};
			const meta = el('span', { class: 'meta' });
			const tier = item.tier || '';
			if (tier) { meta.append(el('span', { class: 'tier ' + tier, text: tierTitle(tier) })); }
			const model = nodeModel(item.id, trace);
			if (model) { meta.append(el('span', { text: model })); }
			if (result.tokens) { meta.append(el('span', { text: fmtTok(result.tokens) + ' ' + plural(result.tokens, t.tokenForms) })); }
			const liveNode = (state().nodes || []).find(n => n.id === item.id);
			const spent = liveNode ? duration(liveNode) : '';
			if (spent) { meta.append(el('span', { text: spent })); }
			if (attempts[item.id]) { meta.append(el('span', { text: t.retry + ' ' + attempts[item.id] })); }
			const indent = (depth.get(item.id) || 0) * 16;
			const goal = el('span', { class: 'goal', title: item.goal || item.id, style: indent ? 'padding-left:' + indent + 'px' : '' });
			if (indent) { goal.append(el('span', { class: 'dep' })); }
			goal.append(el('span', { text: item.goal || item.id }));
			const row = el('button', {
				class: 'plan-row' + (ui.selectedNode === item.id ? ' selected' : ''),
				type: 'button',
				onclick: () => dispatch({ type: 'selectNode', payload: item.id }),
			},
				el('span', { class: 'st ' + status }, statusIcon(status)),
				goal,
				meta,
			);
			list.append(row);
		}
	}

	function renderNodeDetail(t, plan, results, checkpoint, trace) {
		const detail = document.getElementById('nodeDetail');
		clear(detail);
		const id = ui.selectedNode;
		if (!id) {
			const empty = el('div', { class: 'detail-empty muted' });
			empty.append(el('span', { html: ICONS.pointer }), el('span', { text: t.selectNodeHint }));
			detail.append(empty);
			return;
		}
		const item = plan.find(n => n.id === id) || { id, goal: id };
		const result = results[id] || {};
		const status = nodeStatus(id, results, checkpoint.itemState || {}, state().nodes);
		const head = el('div', { class: 'detail-head' });
		head.append(el('span', { class: 'st ' + status }, statusIcon(status)));
		const name = el('div', { class: 'card-title' });
		name.append(el('div', { text: roleTitle(item.agent) || statusTitle(status) }), el('div', { class: 'detail-id', text: id }));
		head.append(name);
		if (item.tier) { head.append(el('span', { class: 'tier ' + item.tier, text: tierTitle(item.tier) })); }
		detail.append(head);
		detail.append(el('h3', { text: t.nodeGoal }));
		detail.append(el('div', { text: item.goal || '' }));
		if (item.deps && item.deps.length) { detail.append(el('div', { class: 'muted', text: t.dependsOn + ': ' + item.deps.join(', ') })); }
		detail.append(el('h3', { text: t.nodeSummary }));
		detail.append(el('div', { text: result.summary || '—' }));
		detail.append(el('h3', { text: t.nodeDiff }));
		detail.append(el('pre', { text: result.diff_stat || t.nodeNoDiff }));
		const acts = el('div', { class: 'row' });
		const openDiff = el('button', { class: 'ghost', type: 'button', text: t.nodeOpenDiff, onclick: () => invoke('node.openDiff', { nodeId: id }).catch(() => undefined) });
		openDiff.disabled = !result.branch;
		const restart = el('button', {
			class: 'primary', type: 'button', text: t.nodeRestart,
			onclick: () => {
				invoke('node.restart', { nodeId: id }).then(res => {
					if (res && res.ok === false) { window.alert(t.restartFailed + ': ' + (res.error || '')); }
				}).catch(err => window.alert(t.restartFailed + ': ' + String(err && err.message || err)));
			},
		});
		restart.disabled = !!(state().run && state().run.status === 'running');
		acts.append(restart, openDiff);
		detail.append(acts);
	}

	/** Карточка подтверждения вызова инструмента: что вызывается, кем, и две кнопки. */
	function approvalCard(t, approval) {
		const node = (state().nodes || []).find(n => n.id === approval.nodeId);
		const card = el('div', { class: 'approval' });
		const head = el('div', { class: 'approval-head' });
		head.append(el('code', { text: approval.toolName }));
		if (approval.nodeId) { head.append(el('span', { class: 'muted', text: t.approvalFrom + ' ' + (node ? roleTitle(node.role) + ' · ' : '') + approval.nodeId })); }
		card.append(head);
		card.append(el('pre', { text: approval.preview || '' }));
		const acts = el('div', { class: 'row' });
		acts.append(
			el('button', { class: 'primary', type: 'button', text: t.approve, onclick: () => invoke('approval.resolve', { id: approval.id, approved: true }).catch(() => undefined) }),
			el('button', { class: 'ghost', type: 'button', text: t.reject, onclick: () => invoke('approval.resolve', { id: approval.id, approved: false }).catch(() => undefined) }),
		);
		card.append(acts);
		return card;
	}

	function renderWaiting(t, s) {
		const host = document.getElementById('waitingHost');
		clear(host);
		const interrupt = s.interrupt;
		// Раньше здесь показывались только «осиротевшие» подтверждения, а карточка для
		// ноды нигде не рисовалась — запуск молча висел. Теперь видны все ожидающие.
		const approvals = s.approvals || [];
		if (!interrupt && approvals.length === 0) { return; }
		const box = el('div', { class: 'waiting' });
		const title = el('div', { class: 'title' });
		title.append(el('span', { class: 'si', html: STATUS_ICON['waiting-approval'] }), el('span', { text: t.waitingTitle }));
		if (approvals.length + (interrupt ? 1 : 0) > 1) { title.append(el('span', { class: 'muted', text: String(approvals.length + (interrupt ? 1 : 0)) })); }
		box.append(title);
		if (interrupt) {
			const card = el('div', { class: 'approval' });
			card.append(el('div', { class: 'body', text: interrupt.title || (interrupt.node ? interrupt.node + ' — ' + (interrupt.role || '') : '') }));
			const note = el('input', { type: 'text', placeholder: t.notePlaceholder });
			const acts = el('div', { class: 'row' });
			const resolve = approved => invoke('interrupt.resolve', { approved, note: note.value || undefined }).catch(() => undefined);
			acts.append(
				el('button', { class: 'primary', type: 'button', text: t.approve, onclick: () => resolve(true) }),
				el('button', { class: 'ghost', type: 'button', text: t.reject, onclick: () => resolve(false) }),
				el('button', { class: 'tiny', type: 'button', text: t.reply, onclick: () => resolve(true) }),
			);
			card.append(note, acts);
			box.append(card);
		}
		for (const approval of approvals) { box.append(approvalCard(t, approval)); }
		host.append(box);
	}

	function renderPatch(t, s) {
		const host = document.getElementById('patchHost');
		clear(host);
		const patch = s.patch;
		if (!patch) { return; }
		const files = Array.isArray(patch.files) ? patch.files : [];
		const box = el('div', { class: 'waiting patch' });
		const title = el('div', { class: 'title' });
		title.append(el('span', { class: 'si', html: STATUS_ICON.done }), el('span', { text: t.patchReady }));
		if (files.length) { title.append(el('span', { class: 'muted', text: files.length + ' ' + plural(files.length, t.fileForms) })); }
		box.append(title);
		box.append(files.length ? el('pre', { text: patch.stat || files.join('\n') }) : el('div', { class: 'body', text: t.patchEmpty }));
		const acts = el('div', { class: 'row' });
		const apply = el('button', {
			class: 'primary', type: 'button', text: t.patchApply,
			onclick: () => invoke('patch.apply', {}).then(res => {
				if (res && res.ok === false) { window.alert((res.conflicts ? t.patchConflict + '\n' + res.conflicts.join('\n') : res.error) || ''); }
				else if (res && res.ok) { window.alert(t.patchApplied); }
			}).catch(() => undefined),
		});
		apply.disabled = files.length === 0;
		const openDiff = el('button', { class: 'ghost', type: 'button', text: t.patchOpen, onclick: () => invoke('patch.openDiff', {}).catch(() => undefined) });
		openDiff.disabled = files.length === 0;
		acts.append(apply, openDiff, el('button', { class: 'ghost', type: 'button', text: t.patchReject, onclick: () => invoke('patch.reject', {}).catch(() => undefined) }));
		box.append(acts);
		host.append(box);
	}

	// История чекпоинтов грузится по требованию; рендер читает уже загруженное.
	let historyEntries = [];
	let historyLoaded = false;
	function renderTimeline(t) {
		document.getElementById('timelineTitle').textContent = t.timeline;
		document.getElementById('timelineHint').textContent = t.timelineHint;
		const box = document.getElementById('timeline');
		clear(box);
		box.className = 'timeline' + (historyEntries.length > 1 ? ' has-dots' : '');
		if (historyEntries.length === 0) {
			box.append(el('span', { class: 'muted', text: t.timelineEmpty }));
		}
		for (const entry of historyEntries) {
			const dot = el('button', {
				class: 'dot', type: 'button',
				title: '#' + (entry.step != null ? entry.step : '?') + (entry.next && entry.next.length ? ' → ' + entry.next.join(',') : '') + ' · ' + (entry.resultsCount || 0),
				onclick: () => pickCheckpoint(t, entry),
			});
			box.append(dot);
		}
	}
	function pickCheckpoint(t, entry) {
		const action = window.prompt(t.timeline + ' #' + (entry.step != null ? entry.step : '?') + '\n' + t.rewind + ' / ' + t.patch, 'rewind');
		if (action === null) { return; }
		if (action.trim().toLowerCase() === 'patch') {
			const raw = window.prompt(t.patchPrompt);
			if (!raw) { return; }
			let patch;
			try { patch = JSON.parse(raw); } catch { window.alert(t.patchInvalid); return; }
			invoke('graph.patchState', { checkpointId: entry.checkpointId, patch }).then(loadHistory).catch(() => undefined);
			return;
		}
		invoke('graph.rewind', { checkpointId: entry.checkpointId }).then(loadHistory).catch(() => undefined);
	}
	function loadHistory() {
		return invoke('graph.history', { limit: 20 }).then(result => {
			historyEntries = (result && result.entries) || [];
			historyLoaded = true;
			renderTimeline(T());
		}).catch(() => undefined);
	}

	// ---- Board ----
	/** Подпись колонки: одна и та же в канбане, в сводке и в списке формы новой задачи. */
	function columnLabel(t, column) {
		return { todo: t.colTodo, doing: t.colDoing, review: t.colReview, done: t.colDone }[column.key];
	}

	function renderBoardTab() {
		const t = T();
		document.getElementById('btnTeamRefresh').textContent = t.teamRefresh;
		document.getElementById('teamHint').textContent = t.teamHint;
		const team = state().team || { available: false, tasks: [] };
		// Свою задачу заводим прямо здесь: пока Team недоступен, форма скрыта.
		const form = document.getElementById('addTaskRow');
		form.hidden = !team.available;
		const titleInput = document.getElementById('newTaskTitle');
		titleInput.placeholder = t.newTaskPh;
		titleInput.title = t.newTaskPh;
		document.getElementById('btnAddTask').textContent = t.addTask;
		const statusSelect = document.getElementById('newTaskStatus');
		statusSelect.title = t.taskColumn;
		statusSelect.setAttribute('aria-label', t.taskColumn);
		fillSelect(statusSelect, COLUMNS.map(column => ({ value: column.status, text: columnLabel(t, column) })));
		const host = document.getElementById('teamBoard');
		clear(host);
		if (!team.available) {
			host.append(el('div', { class: 'muted', text: t.teamUnavailable }));
			return;
		}
		const tasks = team.tasks || [];
		if (tasks.length === 0) {
			host.append(el('div', { class: 'muted', text: t.boardEmpty }));
			return;
		}
		const board = el('div', { class: 'board' });
		for (const column of COLUMNS) {
			const items = tasks.filter(task => task.status === column.status);
			const col = el('div', { class: 'column' });
			const head = el('div', { class: 'col-head' });
			head.append(el('span', { text: columnLabel(t, column) }), el('span', { text: String(items.length) }));
			col.append(head);
			const body = el('div', { class: 'col-body' });
			for (const task of items) {
				const card = el('div', { class: 'card' });
				card.append(el('div', { class: 'card-title', text: task.title }));
				card.append(el('div', { class: 'card-meta', text: task.assigneeName ? task.assigneeName : '' }));
				const acts = el('div', { class: 'card-acts' });
				const run = el('button', { class: 'tiny', type: 'button', text: t.sendToAgents, onclick: () => invoke('team.runTask', { taskId: task.id }).catch(() => undefined) });
				run.disabled = task.status === 'done';
				acts.append(run);
				card.append(acts);
				body.append(card);
			}
			col.append(body);
			board.append(col);
		}
		host.append(board);
	}

	/**
	 * Своя задача на доске: уходит в Aura Team (POST /tasks), доска перечитывается
	 * ответом хоста. Поле чистим только при успехе — иначе текст не терялся бы.
	 */
	function addBoardTask() {
		const t = T();
		const input = document.getElementById('newTaskTitle');
		const note = document.getElementById('addTaskNote');
		const button = document.getElementById('btnAddTask');
		const title = String(input.value || '').trim();
		if (!title) {
			note.className = 'muted';
			note.textContent = t.taskTitleNeeded;
			return;
		}
		button.disabled = true;
		note.className = 'muted';
		note.textContent = '';
		invoke('team.createTask', { title, status: document.getElementById('newTaskStatus').value || 'todo' })
			.then(result => {
				const ok = !result || result.ok !== false;
				if (ok) { input.value = ''; }
				note.className = ok ? 'ok-text' : 'err-text';
				note.textContent = ok ? t.taskAdded : (result && result.reason === 'unavailable' ? t.taskAddOffline : t.taskAddFailed);
			})
			.catch(() => { note.className = 'err-text'; note.textContent = t.taskAddFailed; })
			.finally(() => { button.disabled = false; });
	}

	/** Каталог моделей: host отдаёт models; на старом снимке строим его из keys. */
	function catalogModels() {
		const s = state();
		if (Array.isArray(s.models) && s.models.length) { return s.models; }
		return (s.keys || []).map(k => ({
			id: (k.source === 'team' ? 'team:' : 'personal:') + k.id,
			keyId: k.id,
			displayName: k.name,
			model: k.model || '',
			source: k.source === 'team' ? 'team' : 'personal',
			tier: k.tier,
			status: k.status,
			selectable: k.selectable !== false,
			pingMs: k.pingMs,
			activeCalls: k.activeCalls || 0,
			health: k.health,
			excludedReason: k.excludedReason,
			checking: k.checking,
			lastError: k.lastError,
		}));
	}

	function usedToday(model, budget) {

	// ---- Trace ----
	function renderTrace() {
		const t = T();
		const trace = state().trace || { spans: [], summary: { byTime: [], byCost: [], totalSpans: 0 } };
		const spans = trace.spans || [];
		const hint = document.getElementById('traceHint');
		clear(hint);
		hint.className = spans.length ? 'trace-legend muted' : 'muted';
		if (spans.length) {
			hint.append(el('b', { text: t.traceWaterfall + ' · ' + spans.length + ' ' + plural(spans.length, t.spanForms) }));
			for (const [color, label] of [['--c-run', t.traceLegendNode], ['--c-llm', t.traceLegendLlm], ['--c-err', t.traceLegendErr]]) {
				const item = el('span', {});
				item.append(el('i', { style: 'background:var(' + color + ')' }), el('span', { text: label }));
				hint.append(item);
			}
		} else {
			hint.textContent = t.traceEmpty;
		}
		const waterfall = document.getElementById('traceWaterfall');
		clear(waterfall);
		// Полоса стоит на оси времени запуска: видно, что шло параллельно, а что ждало.
		const starts = spans.map(sp => Number(sp.startedAt) || 0).filter(Boolean);
		const origin = starts.length ? Math.min(...starts) : 0;
		const end = spans.reduce((acc, sp) => Math.max(acc, (Number(sp.startedAt) || origin) + (Number(sp.durationMs) || 0)), origin);
		const range = Math.max(1, end - origin);
		for (const span of spans) {
			const failed = span.status && span.status !== 'ok' ? ' err' : '';
			const row = el('div', { class: 'wf-row ' + (span.kind === 'llm' ? 'llm' : '') + failed });
			// Тир — машинное обозначение и показывается как бейдж (HIGH), а не сырым полем данных.
			const name = el('div', { class: 'wf-name', title: (span.node || span.name) + (span.model ? ' · ' + span.model : '') });
			name.append(el('span', { class: 'n', text: (span.kind === 'llm' ? (span.model || 'llm') : (span.node || span.name)) }));
			if (span.tier) { name.append(el('span', { class: 'tier ' + span.tier, text: tierTitle(span.tier) })); }
			row.append(name);
			const bar = el('div', { class: 'wf-bar' });
			const left = origin && span.startedAt ? (Number(span.startedAt) - origin) / range * 100 : 0;
			const width = Math.max(0.5, (Number(span.durationMs) || 0) / range * 100);
			bar.append(el('span', { style: 'left:' + left.toFixed(2) + '%;width:' + Math.min(width, 100 - left).toFixed(2) + '%' }));
			row.append(bar);
			const parts = [fmtMs(span.durationMs)];
			if (span.cost) { parts.push('$' + Number(span.cost).toFixed(4)); }
			if (span.tokensIn || span.tokensOut) { parts.push(fmtTok(span.tokensIn) + '→' + fmtTok(span.tokensOut)); }
			if (span.retries) { parts.push(span.retries + ' ' + plural(span.retries, t.retryForms)); }
			row.append(el('div', { class: 'wf-meta', text: parts.join(' · ') }));
			waterfall.append(row);
		}
		const tops = document.getElementById('traceTops');
		clear(tops);
		tops.hidden = !spans.length;
		const summary = trace.summary || {};
		for (const [title, list] of [[t.traceByTime, summary.byTime || []], [t.traceByCost, summary.byCost || []]]) {
			const card = el('div', { class: 'card' });
			card.append(el('h4', { text: title }));
			for (const item of list) {
				const row = el('div', { class: 'row-item' });
				row.append(el('span', { text: item.node }));
				row.append(el('span', { class: 'muted', text: fmtMs(item.durationMs) + ' · $' + Number(item.cost || 0).toFixed(4) + ' · ' + fmtTok(item.tokens || 0) + ' tok' }));
				card.append(row);
			}
			tops.append(card);
		}
	}

	/** Структурный лог из host; старые плоские строки превращаем на месте. */
	function logEntries(s) {
		if (Array.isArray(s.logs) && s.logs.length) {
			return s.logs.map(e => ({ ts: e.ts, level: e.level || 'info', node: e.node, message: s0(e.message) }));
		}
		return (s.log || []).map(line => ({ level: 'info', message: s0(line) }));
	}
	function fmtClock(ts) {
		if (!ts) { return '--:--:--'; }
		const d = new Date(ts);
		const pad = n => String(n).padStart(2, '0');
		return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
	}
	function s0(value) { return value == null ? '' : String(value); }

	function budgetCard(label, used, limit, fmt, t) {
		const card = el('div', { class: 'bcard' });
		card.append(el('div', { class: 'blabel', text: label }));
		card.append(el('div', { class: 'bvalue', text: limit > 0 ? fmt(used) + ' / ' + fmt(limit) : fmt(used) + ' · ' + t.budgetNoLimit }));
		if (limit > 0) {
			const percent = Math.min(100, Math.round(used / limit * 100));
			const bar = el('div', { class: 'bbar2' + (percent >= 100 ? ' err' : percent >= 75 ? ' warn' : '') });
			bar.append(el('span', { style: 'width:' + Math.max(2, percent) + '%' }));
			card.append(bar);
		}
		return card;
	}

	let budgetEditorEl = null;
	function budgetEditor() {
		if (!budgetEditorEl) { budgetEditorEl = buildBudgetEditor(T()); }
		return budgetEditorEl;
	}
	function numberField(labelText, value, step) {
		const input = el('input', { type: 'number', min: '0', step: String(step), value: String(Number(value) || 0) });
		if (!labelText) { return { label: input, input }; }
		const label = el('label', { text: labelText });
		label.append(input);
		return { label, input };
	}
	function numberValue(input) {
		const value = Number(String(input.value).replace(',', '.'));
		return Number.isFinite(value) && value > 0 ? value : 0;
	}
	function buildBudgetEditor(t) {
		const budget = state().budget || {};
		const limits = budget.limits || {};
		const prices = budget.prices || {};
		const wrap = el('div', { class: 'bedit' });
		wrap.append(el('h3', { text: t.budgetEditTitle }));
		const hint = el('span', { class: 'muted' });
		const setHint = (text, cls) => { hint.className = 'muted' + (cls ? ' ' + cls : ''); hint.textContent = text || ''; };

		wrap.append(el('h3', { text: t.budgetProfiles }));
		const profilesRow = el('div', { class: 'brow' });
		const profileSelect = el('select', {});
		const profileApply = el('button', { class: 'ghost', type: 'button', text: t.budgetProfileApply });
		const profileName = el('input', { type: 'text', placeholder: t.budgetProfileName });
		const profileSaveAs = el('button', { class: 'ghost', type: 'button', text: t.budgetProfileSaveAs });
		const profileRemove = el('button', { class: 'ghost', type: 'button', text: t.budgetRemove });
		profilesRow.append(profileSelect, profileApply, profileName, profileSaveAs, profileRemove);
		wrap.append(profilesRow);

		function refreshProfiles(profiles, active) {
			clear(profileSelect);
			for (const item of profiles || []) {
				const option = el('option', { value: item.name, text: (t.profiles && t.profiles[item.name]) || item.name, title: item.builtin ? t.budgetProfileBuiltin : item.name });
				profileSelect.append(option);
			}
			profileSelect.value = active || '';
			const current = (profiles || []).find(item => item.name === profileSelect.value);
			profileRemove.disabled = !current || current.builtin;
		}
		function applyProfileValues(profile) {
			const values = profile.limits || {};
			limitFields.runTokens.input.value = String(Number(values.runTokens) || 0);
			limitFields.runCost.input.value = String(Number(values.runCost) || 0);
			limitFields.nodeTokens.input.value = String(Number(values.nodeTokens) || 0);
			limitFields.nodeCost.input.value = String(Number(values.nodeCost) || 0);
			const priceValues = profile.prices || {};
			for (const tier of ['high', 'mid', 'low']) {
				priceFields[tier].input.value = String(Number((priceValues[tier] || {}).input) || 0);
				priceFields[tier].output.value = String(Number((priceValues[tier] || {}).output) || 0);
			}
			clear(rules);
			for (const rule of profile.modelPrices || []) { rules.append(budgetRuleRow(t, rule)); }
		}
		profileApply.addEventListener('click', () => {
			const name = profileSelect.value;
			if (!name) { return; }
			setHint('');
			invoke('budget.profile.apply', { name }).then(result => {
				if (!result || !result.ok) { setHint((result && result.error) || t.budgetSaveError, 'failed'); return; }
				if (result.profile) { applyProfileValues(result.profile); }
				refreshProfiles(result.profiles, result.active);
				setHint(t.budgetProfileApplied + ' · ' + t.budgetNextRun, 'saved');
			}).catch(() => setHint(t.budgetSaveError, 'failed'));
		});
		profileSaveAs.addEventListener('click', () => {
			const name = profileName.value.trim();
			if (!name) { setHint(t.budgetProfileName, 'failed'); return; }
			setHint('');
			invoke('budget.profile.save', { name }).then(result => {
				if (!result || !result.ok) { setHint((result && result.error) || t.budgetSaveError, 'failed'); return; }
				refreshProfiles(result.profiles, result.active);
				setHint(t.budgetProfileSaved, 'saved');
			}).catch(() => setHint(t.budgetSaveError, 'failed'));
		});
		profileRemove.addEventListener('click', () => {
			const name = profileSelect.value;
			if (!name) { return; }
			setHint('');
			invoke('budget.profile.remove', { name }).then(result => {
				if (!result || !result.ok) { setHint((result && result.error) || t.budgetSaveError, 'failed'); return; }
				refreshProfiles(result.profiles, result.active);
				setHint(t.budgetProfileRemoved, 'saved');
			}).catch(() => setHint(t.budgetSaveError, 'failed'));
		});

		wrap.append(el('h3', { text: t.budgetLimits }));
		const limitRow = el('div', { class: 'brow' });
		const limitFields = {
			runTokens: numberField(t.budgetRunTokens, limits.runTokens, 1000),
			runCost: numberField(t.budgetRunCost, limits.runCost, 0.1),
			nodeTokens: numberField(t.budgetNodeTokens, limits.nodeTokens, 1000),
			nodeCost: numberField(t.budgetNodeCost, limits.nodeCost, 0.1),
		};
		limitFields.runTokens.input.name = 'runTokens';
		limitFields.runCost.input.name = 'runCost';
		limitFields.nodeTokens.input.name = 'nodeTokens';
		limitFields.nodeCost.input.name = 'nodeCost';
		for (const field of Object.values(limitFields)) { limitRow.append(field.label); }
		wrap.append(limitRow);

		wrap.append(el('h3', { text: t.budgetPrices }));
		const priceTable = el('table', {});
		const priceHead = el('tr', {});
		for (const heading of [t.tier, t.budgetIn, t.budgetOut]) { priceHead.append(el('th', { text: heading })); }
		priceTable.append(priceHead);
		const priceFields = {};
		for (const tier of ['high', 'mid', 'low']) {
			const row = el('tr', {});
			row.append(el('td', { text: tierTitle(tier) }));
			const inField = numberField('', (prices[tier] || {}).input, 0.1);
			const outField = numberField('', (prices[tier] || {}).output, 0.1);
			const inCell = el('td', {}); inCell.append(inField.input);
			const outCell = el('td', {}); outCell.append(outField.input);
			row.append(inCell, outCell);
			priceTable.append(row);
			priceFields[tier] = { input: inField.input, output: outField.input };
		}
		wrap.append(priceTable);

		wrap.append(el('h3', { text: t.budgetModelRules }));
		const rules = el('div', {});
		wrap.append(rules);
		for (const rule of budget.modelPrices || []) { rules.append(budgetRuleRow(t, rule)); }
		wrap.append(el('button', { class: 'ghost', type: 'button', text: t.budgetAddModel, onclick: () => rules.append(budgetRuleRow(t, null)) }));

		const saveRow = el('div', { class: 'row' });
		saveRow.append(el('button', {
			class: 'primary', type: 'button', text: t.budgetSave,
			onclick: () => {
				const limitValues = {
					runTokens: numberValue(limitFields.runTokens.input),
					runCost: numberValue(limitFields.runCost.input),
					nodeTokens: numberValue(limitFields.nodeTokens.input),
					nodeCost: numberValue(limitFields.nodeCost.input),
				};
				const priceValues = {};
				for (const tier of ['high', 'mid', 'low']) {
					priceValues[tier] = { input: numberValue(priceFields[tier].input), output: numberValue(priceFields[tier].output) };
				}
				const modelPrices = [...rules.children].map(row => row.ruleValue()).filter(rule => rule.match !== '');
				setHint('');
				invoke('budget.update', { limits: limitValues, prices: priceValues, modelPrices }).then(() => {
					setHint(t.budgetSaved + ' · ' + t.budgetNextRun, 'saved');
				}).catch(() => setHint(t.budgetSaveError, 'failed'));
			},
		}), hint);
		wrap.append(saveRow);
		refreshProfiles(budget.profiles, budget.activeProfile);
		return wrap;
	}

	function budgetRuleRow(t, rule) {
		const row = el('div', { class: 'rule' });
		const match = el('input', { type: 'text', placeholder: t.budgetRuleMatch, value: (rule && rule.match) || '' });
		const inField = numberField('', (rule && rule.input) || 0, 0.1);
		const outField = numberField('', (rule && rule.output) || 0, 0.1);
		const remove = el('button', { class: 'tiny', type: 'button', text: t.budgetRemove, onclick: () => row.remove() });
		row.append(match, inField.input, outField.input, remove);
		row.ruleValue = () => ({ match: match.value.trim().toLowerCase(), input: numberValue(inField.input), output: numberValue(outField.input) });
		return row;
	}

	let cacheStatsAt = 0;
	function loadCacheStats(force) {
		const now = Date.now();
		if (!force && now - cacheStatsAt < 3000) { return; }
		cacheStatsAt = now;
		invoke('toolCache.stats', {}).then(result => {
			const stats = document.getElementById('cacheStats');
			if (stats) {
				const entries = (result && result.entries) || 0;
				stats.textContent = entries + ' ' + plural(entries, T().entryForms);
			}
		}).catch(() => undefined);
	}

	// ---- общий рендер ----
	function render() {
		if (!state()) { return; }
		renderHeader();
		renderTabs();
		renderRun();
		renderBoardTab();
		renderModels();
		renderTrace();
		renderLog();
		if (!historyLoaded) { void loadHistory(); } else if (ui.tab === 'run') { /* уже загружено */ }
	}

	// ---- события DOM ----
	for (const button of document.querySelectorAll('nav button')) {
		button.addEventListener('click', () => dispatch({ type: 'tab', payload: button.dataset.tab }));
	}
	document.getElementById('taskInput').addEventListener('input', event => { ui.task = event.target.value; });
	// Ctrl/Cmd+Enter в поле задачи — то же, что кнопка «Запустить».
	document.getElementById('taskInput').addEventListener('keydown', event => {
		if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) { event.preventDefault(); document.getElementById('btnStart').click(); }
	});
	document.getElementById('boardSelect').addEventListener('change', event => dispatch({ type: 'boardTask', payload: event.target.value }));
	document.getElementById('btnStart').addEventListener('click', () => {
		const task = ui.source === 'board' && ui.boardTaskId ? null : ui.task.trim();
		if (ui.source === 'board' && ui.boardTaskId) { invoke('team.runTask', { taskId: ui.boardTaskId }).catch(() => undefined); return; }
		if (task) { invoke('startTask', { task }).catch(() => undefined); }
	});
	document.getElementById('btnSidecarStart').addEventListener('click', () => invoke('sidecar.start', {}).catch(() => undefined));
	document.getElementById('btnPause').addEventListener('click', () => invoke('pause', {}).catch(() => undefined));
	document.getElementById('btnResume').addEventListener('click', () => invoke('resume', {}).catch(() => undefined));
	document.getElementById('btnStop').addEventListener('click', () => invoke('cancel', {}).catch(() => undefined));
	document.getElementById('btnRefreshKeys').addEventListener('click', () => invoke('keys.refresh', {}).catch(() => undefined));
	document.getElementById('btnCheckKeys').addEventListener('click', () => invoke('keys.checkAll', {}).catch(() => undefined));
	document.getElementById('keySourceFilter').addEventListener('change', event => { keySourceFilter = event.target.value; renderModels(); });
	document.getElementById('btnTeamRefresh').addEventListener('click', () => invoke('team.refresh', {}).catch(() => undefined));
	document.getElementById('btnAddTask').addEventListener('click', () => addBoardTask());
	// Enter в поле задачи создаёт её же: иначе пришлось бы тянуться к кнопке.
	document.getElementById('newTaskTitle').addEventListener('keydown', event => {
		if (event.key === 'Enter') { event.preventDefault(); addBoardTask(); }
	});
	document.getElementById('logLevelFilter').addEventListener('change', event => dispatch({ type: 'logLevel', payload: event.target.value }));
	document.getElementById('logNodeFilter').addEventListener('change', event => dispatch({ type: 'logNode', payload: event.target.value }));
	document.getElementById('btnLogPin').addEventListener('click', () => dispatch({ type: 'togglePin' }));

	// F6/F7/F8 — пауза/продолжение/остановка. Дублируют биндинги VS Code
	// на случай, когда фокус во webview и команда сюда не дошла.
	window.addEventListener('keydown', event => {
		const command = { F6: 'pause', F7: 'resume', F8: 'cancel' }[event.key];
		if (!command) { return; }
		event.preventDefault();
		const s = state();
		if (command === 'pause' && (!s.running || s.paused)) { return; }
		if (command === 'resume' && !s.paused) { return; }
		if (command === 'cancel' && !s.running) { return; }
		invoke(command, {}).catch(() => undefined);
	});

	window.addEventListener('message', event => {
		const message = event.data || {};
		if (message.type === 'response') {
			const payload = message.payload || {};
			const entry = pending.get(payload.id);
			if (entry) {
				pending.delete(payload.id);
				if (payload.ok) { entry.resolve(payload.result); }
				else { entry.reject(new Error(payload.error || 'error')); }
			}
		} else if (message.type === 'state') {
			dispatch({ type: 'server', payload: message.payload });
		} else if (message.type === 'tab') {
			// Просьба из команды палитры: открыть конкретную вкладку.
			dispatch({ type: 'tab', payload: String(message.payload || 'run') });
		}
	});

	dispatch({ type: 'server', payload: state() });
	vscode.postMessage({ type: 'ready' });
})();
</script>
</body>
</html>
