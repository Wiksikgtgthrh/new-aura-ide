function renderAgents() {
	const cli = cliById(ui.cli) || state.clis[0];
	const chips = state.clis.map((c, i) => `<button class="cli ${c.id === cli?.id ? 'active' : ''}" data-cli="${c.id}" style="--i:${i}" aria-pressed="${c.id === cli?.id}">${glyph(c)}<span class="grow"><span class="nm">${esc(cliName(c))}</span><span class="st"><span class="dot ${c.path ? 'ok' : 'off'}"></span>${esc(c.path ? T('installed') : T('missing'))}</span></span></button>`).join('');
	const parallel = ui.count > 1;
	const missing = cli && !cli.path;
	const launchDisabled = !state.workspace || (ui.mode === 'headless' && !ui.task.trim()) || ui.busy === 'launch';
	const launcher = `<div class="card" style="--i:0">
		<div class="clis">${chips}</div>
		<div class="launch">
			<textarea id="task" rows="3" placeholder="${esc(T('taskPh'))}">${esc(ui.task)}</textarea>
			<div class="row">
				<div class="seg" role="group"><button data-mode="interactive" class="${ui.mode === 'interactive' ? 'active' : ''}">${esc(T('interactive'))}</button><button data-mode="headless" class="${ui.mode === 'headless' ? 'active' : ''}">${esc(T('headless'))}</button></div>
				<label class="check"><input type="checkbox" id="optWorktree" ${ui.worktree || parallel ? 'checked' : ''} ${parallel ? 'disabled' : ''}> ${esc(T('worktree'))}</label>
				<label class="check">${esc(T('parallel'))} <select class="count" id="optCount">${[1, 2, 3, 4].map((n) => `<option value="${n}" ${n === ui.count ? 'selected' : ''}>×${n}</option>`).join('')}</select></label>
				<span class="grow"></span>
				<button class="btn primary" id="btnLaunch" ${launchDisabled ? 'disabled' : ''}>${ui.busy === 'launch' ? '<span class="spin"></span>' : esc(parallel ? T('launchN', ui.count) : T('launch'))}</button>
			</div>
			<div class="note">${esc(ui.mode === 'headless' ? T('modeHintHeadless') : T('modeHintInteractive'))}${parallel ? ' ' + esc(T('parallelHint')) : ''}</div>
			${!state.workspace ? `<div class="note warn">${esc(T('noFolder'))}</div>` : ''}
			${ui.mode === 'headless' && !ui.task.trim() ? `<div class="note warn">${esc(T('headlessNeedsTask'))}</div>` : ''}
			${missing ? `<div class="row note warn">${esc(T('notInstalled', cliName(cli)))}${cli.install ? `<button class="btn sm" data-install="${cli.id}">${esc(T('install'))}</button>` : ''}</div>` : ''}
		</div>
	</div>`;
	const sessions = state.sessions.length
		? `<div class="sessions">${state.sessions.map(renderSession).join('')}</div>`
		: `<div class="empty"><b>${esc(T('noSessions'))}</b>${esc(T('noSessionsSub'))}</div>`;
	return launcher + `<div class="section">${esc(T('sessions'))} · ${state.sessions.length}</div>` + sessions;
}

function renderSession(s, i) {
	const cli = cliById(s.cli);
	const live = s.status === 'running' || s.status === 'starting';
	const statusText = T('st_' + s.status) + (s.exitCode !== undefined && s.exitCode !== null && s.status !== 'running' ? ' · ' + T('code', s.exitCode) : '');
	const changes = ui.changes[s.id];
	const changesBlock = changes ? `<div class="s-changes">${changes.files.length ? changes.files.slice(0, 12).map((f) => `<div class="f"><b class="${esc(f.status)}">${esc(f.status)}</b><span>${esc(f.path)}</span></div>`).join('') + (changes.files.length > 12 ? `<div class="muted">… +${changes.files.length - 12}</div>` : '') : `<span class="muted">${esc(T('noChanges'))}</span>`}
		${changes.stat || changes.commits.length ? `<div class="muted" style="margin-top:4px">${esc(changes.stat)}${changes.commits.length ? ' · ' + esc(T('commits', changes.commits.length)) : ''}</div>` : ''}</div>` : '';
	return `<div class="card session" data-session="${s.id}" style="--i:${i};--c:${esc(cli?.color || '')}">
		<div class="s-head">${glyph(cli)}<div class="grow"><div class="s-title" title="${esc(s.title)}">${esc(s.title)}</div>
			<div class="s-meta"><span>${esc(cliName(cli))}</span>·<span>${esc(s.mode === 'headless' ? T('headless') : T('interactive'))}</span>${s.worktree ? `<span class="chip" title="${esc(s.worktree.path)}">${esc(s.worktree.branch)}</span>` : ''}<span class="elapsed" data-from="${s.startedAt}" data-to="${s.endedAt || ''}" data-live="${live ? 1 : 0}">${s.status === 'idle' ? '' : esc(duration(s.startedAt, s.endedAt))}</span></div></div>
			<span class="pill ${esc(s.status)}">${esc(statusText)}</span></div>
		${s.task ? `<div class="s-task" title="${esc(s.task)}">${esc(s.task)}</div>` : ''}
		${s.error ? `<div class="note warn" style="margin-top:6px">${esc(s.error)}</div>` : ''}
		${s.output ? `<div class="s-out">${esc(s.output.slice(-1800))}</div>` : ''}
		${changesBlock}
		<div class="s-actions">
			${s.hasTerminal ? `<button class="btn sm" data-act="focus">${esc(T('terminal'))}</button>` : ''}
			${live ? `<button class="btn sm danger" data-act="stop">${esc(T('stop'))}</button>` : `<button class="btn sm" data-act="restart">${esc(T('restart'))}</button>`}
			${s.worktree ? `<button class="btn sm" data-act="changes">${esc(T('changes'))}</button><button class="btn sm" data-act="diff">${esc(T('diff'))}</button><button class="btn sm primary" data-act="merge" ${live ? 'disabled' : ''}>${esc(T('merge'))}</button><button class="btn sm danger" data-act="remove">${esc(T('removeBranch'))}</button>` : ''}
			${!live ? `<button class="btn sm icon" data-act="dismiss" title="${esc(T('dismiss'))}" aria-label="${esc(T('dismiss'))}">×</button>` : ''}
		</div>
	</div>`;
}

function renderSettings() {
	const keys = ui.apiKeys;
	const cards = state.clis.map((c, i) => {
		const st = c.settings || {};
		const src = st.keySource || 'manual';
		const keyEnv = st.keyEnv || c.keyEnv;
		const env = [];
		if (src !== 'none') { env.push(`${keyEnv}=${src === 'api-plugin' ? '‹API Keys›' : (c.hasKey ? c.keyMask : '—')}`); }
		if (st.baseUrl && c.baseUrlEnv) { env.push(`${c.baseUrlEnv}=${st.baseUrl}`); }
		if (st.model && c.modelEnv) { env.push(`${c.modelEnv}=${st.model}`); }
		if (st.model && c.modelFlag) { env.push(`${c.modelFlag} ${st.model}`); }
		return `<div class="card" data-settings="${c.id}" style="--i:${i}">
			<div class="set-head">${glyph(c)}<div class="grow"><b>${esc(cliName(c))}</b><span class="note"><span class="dot ${c.path ? 'ok' : 'off'}" style="display:inline-block;margin-right:5px"></span>${esc(c.path || T('missing'))} · ${esc(keyStatus(c))}</span></div>
				${c.docsUrl ? `<button class="btn sm" data-docs="${esc(c.docsUrl)}">${esc(T('docs'))}</button>` : ''}</div>
			<div class="fields">
				<div class="field"><label>${esc(T('binary'))}</label><input data-f="binary" value="${esc(st.binary || '')}" placeholder="${esc(c.defaultBinary ? T('binaryPh', c.defaultBinary) : 'my-agent --flag')}"></div>
				<div class="field"><label>${esc(T('keySource'))}</label><select data-f="keySource">
					<option value="manual" ${src === 'manual' ? 'selected' : ''}>${esc(T('srcManual'))}</option>
					<option value="api-plugin" ${src === 'api-plugin' ? 'selected' : ''}>${esc(T('srcApi'))}</option>
					<option value="none" ${src === 'none' ? 'selected' : ''}>${esc(T('srcNone'))}</option></select></div>
				${src === 'manual' ? `<div class="field wide"><label>${esc(T('apiKey'))} · <span class="mono">${esc(keyEnv)}</span></label><input type="password" data-f="apiKey" autocomplete="off" placeholder="${esc(c.hasKey ? T('apiKeySavedPh', c.keyMask) : T('apiKeyPh'))}"></div>` : ''}
				${src === 'api-plugin' ? `<div class="field wide"><label>${esc(T('apiKeyPick'))}</label>${keys && keys.length ? `<select data-f="apiKeyId">${keys.map((k) => `<option value="${esc(k.id)}" ${k.id === st.apiKeyId ? 'selected' : ''}>${esc((k.name || k.id) + (k.model ? ' · ' + k.model : ''))}</option>`).join('')}</select>` : `<div class="note warn">${esc(keys ? T('apiKeyNone') : '…')}</div>`}</div>` : ''}
				<div class="field"><label>${esc(T('baseUrl'))}${c.baseUrlEnv ? ` · <span class="mono">${esc(c.baseUrlEnv)}</span>` : ''}</label><input data-f="baseUrl" value="${esc(st.baseUrl || '')}" placeholder="${esc(c.baseUrlEnv ? T('baseUrlPh') : T('baseUrlNo'))}" ${c.baseUrlEnv ? '' : 'disabled'}></div>
				<div class="field"><label>${esc(T('model'))}</label><input data-f="model" value="${esc(st.model || '')}" placeholder="${esc(T('modelPh') + (MODEL_EXAMPLES[c.id] || 'gpt-4.1'))}"></div>
				<div class="field"><label>${esc(T('keyEnv'))}</label><input data-f="keyEnv" class="mono" value="${esc(st.keyEnv || '')}" placeholder="${esc(c.keyEnv)}"></div>
				<div class="field"><label>${esc(T('extraArgs'))}</label><input data-f="extraArgs" class="mono" value="${esc(st.extraArgs || '')}" placeholder="${esc(T('extraArgsPh'))}"></div>
				<div class="field wide"><label>${esc(T('extraEnv'))}</label><textarea data-f="extraEnv" class="mono" rows="2" placeholder="${esc(T('extraEnvPh'))}">${esc(st.extraEnv || '')}</textarea></div>
			</div>
			${env.length ? `<div class="env"><b>${esc(T('envPreview'))}:</b> ${esc(env.join('  ·  '))}</div>` : ''}
			<div class="set-actions">
				${c.hasKey && src === 'manual' ? `<button class="btn sm danger" data-clear-key="${c.id}">${esc(T('clearKey'))}</button>` : ''}
				${c.install && !c.path ? `<button class="btn sm" data-install="${c.id}">${esc(T('install'))}</button>` : ''}
				<button class="btn sm" data-check="${c.id}">${ui.busy === 'check:' + c.id ? '<span class="spin"></span>' : esc(T('check'))}</button>
				<button class="btn sm primary" data-save="${c.id}">${esc(T('save'))}</button>
			</div>
		</div>`;
	}).join('');
	return `<div class="note" style="margin:14px 0 10px">${esc(T('location'))} ${esc(T('orchestrator'))} <button class="btn sm" id="btnOpenSettings">${esc(T('openSettings'))}</button></div><div class="settings">${cards}</div>`;
}

function render() {
	document.documentElement.lang = state.language;
	renderTabs();
	const view = document.getElementById('view');
	const focused = document.activeElement?.id === 'task' ? { start: document.activeElement.selectionStart, end: document.activeElement.selectionEnd } : null;
	view.innerHTML = `<div style="margin-top:16px">${ui.view === 'settings' ? renderSettings() : renderAgents()}</div>`;
	if (focused) { const t = document.getElementById('task'); t?.focus(); t?.setSelectionRange(focused.start, focused.end); }
	wire();
	save();
}

function wire() {
	document.querySelectorAll('[data-view]').forEach((b) => b.onclick = () => {
		ui.view = b.dataset.view;
		if (ui.view === 'settings' && ui.apiKeys === null) { void svc('auraOrca.apiPluginKeys').then((list) => { ui.apiKeys = list || []; render(); }).catch(() => { ui.apiKeys = []; }); }
		render();
	});
	document.querySelectorAll('[data-cli]').forEach((b) => b.onclick = () => { ui.cli = b.dataset.cli; render(); });
	document.querySelectorAll('[data-mode]').forEach((b) => b.onclick = () => { ui.mode = b.dataset.mode; render(); });
	const task = document.getElementById('task');
	if (task) { task.oninput = () => { const before = !ui.task.trim(); ui.task = task.value; if (before !== !ui.task.trim() && ui.mode === 'headless') { render(); } else { save(); } }; }
	const wt = document.getElementById('optWorktree');
	if (wt) { wt.onchange = () => { ui.worktree = wt.checked; save(); }; }
	const count = document.getElementById('optCount');
	if (count) { count.onchange = () => { ui.count = Number(count.value) || 1; render(); }; }
	const launchBtn = document.getElementById('btnLaunch');
	if (launchBtn) {
		launchBtn.onclick = async () => {
			ui.busy = 'launch'; render();
			try {
				const started = await svc('auraOrca.newAgent', [{ cli: ui.cli, task: ui.task, mode: ui.mode, worktree: ui.worktree, count: ui.count }]);
				toast(T('started', (started || []).map((s) => s.title).join(', ')), 'ok');
				if (ui.mode === 'headless') { ui.task = ''; }
			} catch (err) { toast(err.message, 'err'); }
			ui.busy = ''; render();
		};
	}
	document.querySelectorAll('[data-install]').forEach((b) => b.onclick = (e) => { e.stopPropagation(); void svc('auraOrca.install', [b.dataset.install]).catch((err) => toast(err.message, 'err')); });
	document.querySelectorAll('[data-docs]').forEach((b) => b.onclick = () => { void svc('auraOrca.openExternal', [b.dataset.docs]); });
	document.getElementById('btnOpenSettings')?.addEventListener('click', () => { void svc('auraOrca.openSettings'); });
	document.querySelectorAll('[data-session]').forEach((card) => {
		const id = card.dataset.session;
		card.onclick = (e) => { if (e.target.closest('button, a, input, select, textarea')) { return; } void svc('auraOrca.focus', [id]).catch(() => { }); };
		card.querySelectorAll('[data-act]').forEach((b) => b.onclick = async (e) => {
			e.stopPropagation();
			const act = b.dataset.act;
			b.disabled = true;
			try {
				if (act === 'focus') { await svc('auraOrca.focus', [id]); }
				else if (act === 'stop') { await svc('auraOrca.stop', [id]); }
				else if (act === 'restart') { await svc('auraOrca.restart', [id]); }
				else if (act === 'dismiss') { await svc('auraOrca.dismiss', [id]); delete ui.changes[id]; }
				else if (act === 'changes') { ui.changes[id] = ui.changes[id] ? undefined : await svc('auraOrca.changes', [id]); if (!ui.changes[id]) { delete ui.changes[id]; } render(); }
				else if (act === 'diff') { await svc('auraOrca.openChanges', [id]); }
				else if (act === 'merge') {
					const s = state.sessions.find((x) => x.id === id);
					const result = await svc('auraOrca.merge', [id]);
					toast(result?.conflicts ? T('mergeConflicts') : result?.merged ? T('mergeDone', s?.worktree?.branch || '') : T('mergeNothing'), result?.conflicts ? 'err' : 'ok');
				}
				else if (act === 'remove') { await svc('auraOrca.removeWorktree', [id]); delete ui.changes[id]; toast(T('removed'), 'ok'); }
			} catch (err) { toast(err.message, 'err'); }
			b.disabled = false;
		});
	});
	document.querySelectorAll('[data-settings]').forEach((card) => {
		const id = card.dataset.settings;
		const collect = () => {
			const value = {};
			card.querySelectorAll('[data-f]').forEach((f) => { value[f.dataset.f] = f.value; });
			return value;
		};
		card.querySelector('[data-f="keySource"]')?.addEventListener('change', async (e) => {
			// Переключение источника сохраняем сразу: поле ключа зависит от выбора.
			const value = collect();
			delete value.apiKey;
			if (e.target.value === 'api-plugin' && ui.apiKeys && ui.apiKeys[0] && !value.apiKeyId) { value.apiKeyId = ui.apiKeys[0].id; }
			try { await svc('auraOrca.saveCliSettings', [id, value]); } catch (err) { toast(err.message, 'err'); }
		});
		card.querySelector('[data-save]')?.addEventListener('click', async () => {
			try { await svc('auraOrca.saveCliSettings', [id, collect()]); toast(T('saved'), 'ok'); } catch (err) { toast(err.message, 'err'); }
		});
		card.querySelector('[data-clear-key]')?.addEventListener('click', async () => {
			const value = collect(); delete value.apiKey; value.clearKey = true;
			try { await svc('auraOrca.saveCliSettings', [id, value]); } catch (err) { toast(err.message, 'err'); }
		});
		card.querySelector('[data-check]')?.addEventListener('click', async () => {
			ui.busy = 'check:' + id; render();
			try {
				const result = await svc('auraOrca.checkCli', [id], 30000);
				const cli = cliById(id);
				toast(result?.ok ? T('checkOk', cliName(cli), result.version || result.path) : (result?.path ? T('checkFail', cliName(cli)) + (result.error ? ': ' + result.error : '') : T('notInstalled', cliName(cli))), result?.ok ? 'ok' : 'err');
			} catch (err) { toast(err.message, 'err'); }
			ui.busy = ''; render();
		});
	});
}

setInterval(() => {
	document.querySelectorAll('.elapsed[data-live="1"]').forEach((el) => { el.textContent = duration(Number(el.dataset.from)); });
}, 1000);
render();
vscode.postMessage({ type: 'ready' });
</script>
</body>
</html>
