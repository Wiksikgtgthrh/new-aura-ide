/* ---------- Админка: выдача закрытых возможностей ---------- */
// Каталог возможностей и список целей приходят с сервера: клиент не решает,
// что существует. Признак админа — из сессии, но проверка всё равно на сервере.
let adminData = null;
// Выбор цели выдачи: команда ищется по названию, участник — по имени или email.
// Выбранных может быть несколько: право выдаётся одним нажатием на каждого.
let adminPick = { kind: 'account', q: '', results: [], chosen: [] };
let adminSearchTimer = null;

async function ensureAdmin(force = false) {
	if (!state?.session?.admin) { adminData = { admin: false }; return adminData; }
	if (adminData?.admin && !force) { return adminData; }
	try { adminData = await svc('auraTeam.adminState', []); }
	catch (err) { adminData = { admin: false, error: err?.message }; }
	return adminData;
}

function adminRoleTitle(role) { return T('role' + cap(role)) || role; }

/** Первый срез каталога без поискового запроса: он приезжает вместе с состоянием. */
function adminSlice(kind) {
	return kind === 'team' ? (adminData?.teams ?? []) : (adminData?.users ?? []);
}

/** Возможность, выбранная в списке справа: по ней же помечаем уже выданное. */
function adminSelectedFeature() {
	return document.getElementById('adminFeature')?.value ?? (adminData?.features ?? [])[0]?.id ?? '';
}

/** Выдано ли уже это право этой цели: повторная выдача ни к чему не приведёт. */
function adminHasFeature(item, kind, feature) {
	if (!feature) { return false; }
	return kind === 'team' ? (item.grants ?? []).some(entry => entry.feature === feature) : (item.features ?? []).includes(feature);
}

function adminTargetRow(item, kind) {
	const key = kind + ':' + item.id;
	const chosen = adminPick.chosen.some(entry => entry.key === key);
	const name = kind === 'team' ? item.name : item.displayName;
	const meta = kind === 'team' ? `${item.members ?? 0}` : item.email;
	const already = adminHasFeature(item, kind, adminSelectedFeature()) ? ` · ${esc(T('adminAlready'))}` : '';
	return `<label class="check-row${chosen ? ' done' : ''}"><input type="checkbox" data-pick="${esc(key)}" ${chosen ? 'checked' : ''}> <span>${esc(name)}</span><small>${esc(meta)}${already}</small></label>`;
}

/** Выбранные цели — кнопками-чипами: нажатие убирает цель (без текстовых глифов). */
function adminChosenHtml() {
	if (!adminPick.chosen.length) { return `<span class="hint">${esc(T('adminChosenEmpty'))}</span>`; }
	return adminPick.chosen.map(entry => `<button class="chip" data-unpick="${esc(entry.key)}" title="${esc(T('adminChosenRemove'))}">${esc(entry.label)}</button>`).join('');
}

/** Обновление только списков: поле поиска не теряет фокус и набранный текст. */
function renderAdminTargets() {
	const results = document.getElementById('adminResults');
	if (results) {
		results.innerHTML = adminPick.results.length
			? adminPick.results.map(item => adminTargetRow(item, adminPick.kind)).join('')
			: `<div class="hint">${esc(T('adminNoMatches'))}</div>`;
	}
	const chosen = document.getElementById('adminChosen');
	if (chosen) { chosen.innerHTML = adminChosenHtml(); }
	wireAdminPicks();
}

/** Поиск идёт на сервер: каталог может быть больше, чем влезает в первый срез. */
async function runAdminSearch() {
	const q = adminPick.q.trim();
	if (!q) { adminPick.results = adminSlice(adminPick.kind); renderAdminTargets(); return; }
	const found = await svc('auraTeam.adminDirectory', [{ q }]).catch(() => ({ users: [], teams: [] }));
	adminPick.results = adminPick.kind === 'team' ? (found?.teams ?? []) : (found?.users ?? []);
	renderAdminTargets();
}

function toggleAdminTarget(key, on) {
	const [kind, id] = key.split(':');
	const existing = adminPick.chosen.findIndex(entry => entry.key === key);
	if (!on) {
		if (existing !== -1) { adminPick.chosen.splice(existing, 1); }
	} else if (existing === -1) {
		const item = adminPick.results.find(row => row.id === id) ?? adminSlice(kind).find(row => row.id === id);
		const label = kind === 'team' ? `${item?.name ?? id}` : `${item?.displayName ?? id}`;
		adminPick.chosen.push({ key, kind, id, label });
	}
	// Обновляем только затронутую строку и список выбранных: перерисовка всего
	// списка сбрасывала прокрутку и теряла ссылки на уже отрисованные строки.
	document.querySelectorAll('[data-pick]').forEach(input => {
		if (input.dataset.pick !== key) { return; }
		input.checked = on;
		input.closest('.check-row')?.classList.toggle('done', on);
	});
	const chosen = document.getElementById('adminChosen');
	if (chosen) { chosen.innerHTML = adminChosenHtml(); }
	wireAdminPicks();
}

function wireAdminPicks() {
	document.querySelectorAll('[data-pick]').forEach(input => input.addEventListener('change', () => toggleAdminTarget(input.dataset.pick, input.checked)));
	document.querySelectorAll('[data-unpick]').forEach(btn => btn.addEventListener('click', () => toggleAdminTarget(btn.dataset.unpick, false)));
}

function adminRedeemCard(folded = false) {
	// Подпись поля — единственный заголовок: раньше рядом стоял такой же section-title,

	const field = `<div class="field"><label>${esc(T('adminCodeTitle'))}</label><input id="adminCode" maxlength="40" autocomplete="off" placeholder="${esc(T('adminCodePh'))}"><div class="hint">${esc(T('adminCodeHint'))}</div></div>
		<div class="savebar static"><button class="btn primary" id="btnAdminRedeem">${esc(T('adminCodeBtn'))}</button></div>`;
	if (!folded) {
		return `<div class="card" style="--i:0"><div class="hint mb12">${esc(T('adminCodeWhy'))}</div>${field}</div>`;
	}
	// В профиле код свёрнут: он нужен только тому, кому его выдали, и не должен
	// читаться как часть профиля.
	return `<details class="card code-fold" style="--i:1">
		<summary>${esc(T('adminCodeFold'))}</summary>
		<div class="hint mt8">${esc(T('adminCodeWhy'))}</div>

}

function renderAdmin() {

	// Не админ (или сессия устарела): показываем только код доступа.
	if (!data.admin) { return head + adminRedeemCard(); }
	const features = data.features ?? [];
	const roles = data.roles ?? ['owner', 'maintainer', 'dev', 'viewer'];
	const featureTitle = (id) => features.find(f => f.id === id)?.title ?? id;
	// Цель ищется, а не выбирается из выпадающего списка: в команде могут быть сотни

	const grantCard = `<div class="card" style="--i:0">

				<input id="adminSearch" maxlength="80" autocomplete="off" value="${esc(adminPick.q)}" placeholder="${esc(T('adminSearchPh'))}" style="flex:1">

	const accountRows = (data.account ?? []).map(row => `<div class="row" style="justify-content:space-between">
		<span>${esc(row.email)}</span><span class="hint">${esc(featureTitle(row.feature))}</span>
		<button class="btn ghost sm" data-revoke-account="${esc(row.userId)}" data-revoke-feature="${esc(row.feature)}">${esc(T('adminRevoke'))}</button></div>`).join('');

		<span>${esc(row.teamName)}</span><span class="hint">${esc(featureTitle(row.feature))} · ${esc(adminRoleTitle(row.minRole))}+</span>
		<button class="btn ghost sm" data-revoke-team="${esc(row.teamId)}" data-revoke-feature="${esc(row.feature)}" data-revoke-role="${esc(row.minRole)}">${esc(T('adminRevoke'))}</button></div>`).join('');

function wireAdmin() {
	const redeem = document.getElementById('btnAdminRedeem');
	redeem?.addEventListener('click', async () => {
		const code = document.getElementById('adminCode')?.value?.trim();
		if (!code) { toast(T('adminCodeTitle'), 'err'); return; }
		redeem.disabled = true;
		try {
			const result = await svc('auraTeam.adminRedeem', [code]);
			if (!result?.admin) { toast(T('adminCodeBad'), 'err'); return; }
			toast(T('adminCodeDone'), 'ok');
			// Признак админа приезжает в сессии: обновляем состояние и показываем панель.
			await svc('auraTeam.getState').then((s) => { state = s; }).catch(() => { });
			adminData = null;
			await ensureAdmin(true);
			route = 'admin';
			render();
		} catch (err) { toast(err?.message || T('adminCodeBad'), 'err'); }
		finally { if (redeem.isConnected) { redeem.disabled = false; } }
	});
	const applyGrant = async (payload, message) => {
		try { adminData = await svc('auraTeam.adminGrant', [payload]); toast(message, 'ok'); render(); }
		catch (err) { toast(err?.message || 'error', 'err'); }
	};
	// Цели: поиск с задержкой (не дёргаем сервер на каждую букву) и несколько выбранных.
	const search = document.getElementById('adminSearch');
	search?.addEventListener('input', () => {
		adminPick.q = search.value;
		clearTimeout(adminSearchTimer);
		adminSearchTimer = setTimeout(() => { void runAdminSearch(); }, 250);
	});
	// Смена возможности пересобирает подсказки «уже выдано» в найденных целях.
	document.getElementById('adminFeature')?.addEventListener('change', () => renderAdminTargets());
	document.getElementById('adminKind')?.addEventListener('change', (e) => {
		adminPick.kind = e.target.value === 'team' ? 'team' : 'account';
		// Смена типа цели сбрасывает выбранное: аккаунт и команда — разное.
		adminPick.chosen = [];
		void runAdminSearch();
	});
	document.getElementById('btnAdminGrant')?.addEventListener('click', async (e) => {
		ripple(e);
		const feature = document.getElementById('adminFeature')?.value;
		const minRole = document.getElementById('adminMinRole')?.value;
		if (!feature) { return; }
		const chosen = [...adminPick.chosen];
		if (!chosen.length) { toast(T('adminPickNobody'), 'err'); return; }
		const btn = e.currentTarget;
		btn.disabled = true;
		try {
			// У аккаунта порог роли не нужен: право выдаётся лично и безусловно.
			for (const target of chosen) {
				adminData = await svc('auraTeam.adminGrant', [
					target.kind === 'team' ? { feature, kind: 'team', targetId: target.id, minRole } : { feature, kind: 'account', targetId: target.id }
				]);
			}
			toast(`${T('adminGranted')}: ${chosen.length}`, 'ok');
			adminPick.chosen = [];
			adminPick.results = adminSlice(adminPick.kind);
			render();
		} catch (err) { toast(err?.message || 'error', 'err'); }
		finally { btn.disabled = false; }
	});
	// Первый срез каталога показываем сразу: искать что-то не обязательно.
	if (!adminPick.q.trim()) { adminPick.results = adminSlice(adminPick.kind); }
	renderAdminTargets();
	document.querySelectorAll('[data-revoke-account]').forEach(btn => btn.addEventListener('click', () => applyGrant({ feature: btn.dataset.revokeFeature, kind: 'account', targetId: btn.dataset.revokeAccount, revoke: true }, T('adminRevoked'))));
	document.querySelectorAll('[data-revoke-team]').forEach(btn => btn.addEventListener('click', () => applyGrant({ feature: btn.dataset.revokeFeature, kind: 'team', targetId: btn.dataset.revokeTeam, minRole: btn.dataset.revokeRole, revoke: true }, T('adminRevoked'))));
	document.getElementById('btnAdminAdd')?.addEventListener('click', async () => {
		const email = document.getElementById('adminNewEmail')?.value?.trim();
		if (!email) { return; }
		try { adminData = await svc('auraTeam.adminSetAdmin', [{ email }]); toast(T('adminAdminAdded'), 'ok'); render(); }
		catch (err) { toast(err?.message || 'error', 'err'); }
	});
}

function wireProfile() {
	// Код доступа к админке живёт в свёрнутом блоке профиля: сам раздел в рейле
	// видят только админы, а ввести код должен мочь каждый, кому его выдали.
	wireAdmin();
	wireLoginForm();
	// Загрузка аватарки: файл → canvas (256×256, JPEG) → dataURL → сервер настроек.
	const fileInput = document.getElementById('avatarFile');
	document.getElementById('btnAvatar')?.addEventListener('click', () => fileInput?.click());
	fileInput?.addEventListener('change', () => {
		const file = fileInput.files?.[0];
		if (!file) { return; }
		const reader = new FileReader();
		reader.onload = () => {
			const img = new Image();
			img.onload = async () => {
				const size = 256;
				const canvas = document.createElement('canvas');
				canvas.width = size; canvas.height = size;
				const ctx = canvas.getContext('2d');
				if (!ctx) { return; }
				// Обрезка по центру в квадрат.
				const side = Math.min(img.width, img.height);
				ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
				const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
				try { state.profile = await svc('auraTeam.setAvatar', [dataUrl]) ?? state.profile; toast(T('photoSaved'), 'ok'); render(); updateChrome(); }
				catch (err) { toast(err?.message || 'error', 'err'); }
			};
			img.src = String(reader.result);
		};
		reader.readAsDataURL(file);
		fileInput.value = '';
	});
	const form = document.getElementById('profileForm');
	const saveBtn = document.getElementById('btnSaveProfile');
	const resetBtn = document.getElementById('btnResetProfile');
	const nick = document.getElementById('pNick');
	const email = document.getElementById('pEmail');
	const desc = document.getElementById('pDesc');
	const initial = { nick: nick?.value ?? '', email: email?.value ?? '', desc: desc?.value ?? '' };
	const syncDirty = () => {
		const dirty = nick.value !== initial.nick || email.value !== initial.email || desc.value !== initial.desc;
		const valid = nick.value.trim().length > 0 && (email.value === '' || email.checkValidity());
		saveBtn.disabled = !dirty || !valid;
		resetBtn.disabled = !dirty;
		document.getElementById('pSavebar')?.classList.toggle('dirty', dirty);
		const st = document.getElementById('pState');
		if (st) { st.textContent = dirty ? T('pfUnsaved') : T('pfSynced'); }
		const cnt = document.getElementById('pDescCount');
		if (cnt) { cnt.textContent = `${desc.value.length}/240`; }
	};
	form?.addEventListener('input', syncDirty);
	resetBtn?.addEventListener('click', () => { nick.value = initial.nick; email.value = initial.email; desc.value = initial.desc; syncDirty(); });
	form?.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); if (!saveBtn.disabled) { form.requestSubmit(); } } });
	form?.addEventListener('submit', async (e) => {
		e.preventDefault();
		if (saveBtn.disabled) { return; }
		const data = {
			nickname: nick.value.trim() || state.profile.nickname,
			email: email.value.trim(),
			description: desc.value.trim()
		};
		saveBtn.disabled = true;
		try { const res = await svc('auraTeam.registerProfile', [data]); if (res) { state.profile = res; } toast(T('pfSaved'), 'ok'); render(); updateChrome(); }
		catch (err) { toast(err.message, 'err'); syncDirty(); }
	});
	const changePasswordBtn = document.getElementById('btnChangePassword');
	changePasswordBtn?.addEventListener('click', () => {
		if (!state.signedIn || state.demoMode) { toast(T('loginTitle'), 'err'); return; }
		openModal({
			title: T('changePassword'),
			sub: T('newPassword'),
			body: `<div class="field"><label>${esc(T('currentPassword'))}</label><input data-current-password type="password" autocomplete="current-password"></div><div class="field"><label>${esc(T('newPassword'))}</label><input data-new-password type="password" minlength="8" autocomplete="new-password"></div>`,
			actionText: T('save'),
			onAction: async overlay => {
				const currentPassword = overlay.querySelector('[data-current-password]').value;
				const newPassword = overlay.querySelector('[data-new-password]').value;
				if (!currentPassword || newPassword.length < 8) { toast(T('regPassShort'), 'err'); return true; }
				try { await svc('auraTeam.changePassword', [{ currentPassword, newPassword }]); toast(T('passwordChanged'), 'ok'); state.signedIn = false; state.session = undefined; render(); } catch (err) { toast(err?.message || T('loginFail'), 'err'); return true; }
			}
		});
	});
	const logoutBtn = document.getElementById('btnLogout');
	logoutBtn?.addEventListener('click', async () => {
		try { await svc('auraTeam.signOut'); } catch { /* офлайн */ }
		state.profile.nickname = '';
		state.signedIn = false;
		render();
	});
	document.querySelectorAll('[data-copy]').forEach((el) => el.addEventListener('click', () => copyText(el.dataset.copy)));
}

/* ---------- Иконки рейла уже в HTML; здесь обработчики ---------- */
let chromeWired = false;
function wireChrome() {
	// Слушатели chrome вешаются ОДИН раз: rail-кнопки — статичные элементы шапки,
	// повторная навеска при каждом рендере накапливала слушатели (утечка при частых кликах).
	if (chromeWired) { return; }
	chromeWired = true;
	document.querySelectorAll('.rail-btn').forEach((b) => b.addEventListener('click', () => { route = b.dataset.view; render(); }));
	const avatarMenu = document.getElementById('avatarMenu');
	const avatar = document.getElementById('avatarBtn');
	if (avatar) {
		avatar.addEventListener('click', (e) => { e.stopPropagation(); avatarMenu.classList.toggle('hidden'); });
		document.addEventListener('click', (e) => { if (!e.target.closest('#avatarMenu') && !e.target.closest('#avatarBtn')) { avatarMenu.classList.add('hidden'); } });
		avatarMenu.querySelectorAll('[data-act]').forEach((item) => item.addEventListener('click', () => {
			avatarMenu.classList.add('hidden');
			if (item.dataset.act === 'profile') { route = 'profile'; render(); }
			else if (item.dataset.act === 'logout') {
				void (async () => {
					try { await svc('auraTeam.signOut'); } catch { /* офлайн */ }
					state.profile.nickname = '';
					state.signedIn = false;
					render();
				})();
			}
		}));
	}
}

/* ---------- Скелетон при старте ---------- */
function skeleton() {
	mount('<div class="card-grid">' + Array.from({ length: 3 }).map(() => '<div class="card"><div class="skeleton" style="height:14px;width:45%"></div><div class="skeleton" style="height:10px;width:70%;margin-top:10px"></div><div class="skeleton" style="height:10px;width:55%;margin-top:8px"></div></div>').join('') + '</div>');
}

/* ---------- Маунт: диспетчер по событиям ---------- */
function wire() {
	if (!state) { return; }
	wireChrome();
	// Вход = серверная сессия.
	const needsAuth = !state.signedIn;
	if (needsAuth) { wireAuth(); return; }
	if (route === 'keys') { wireKeys(); return; }
	if (route === 'profile') { wireProfile(); return; }
	if (route === 'board') { wireBoard(); wireTrash(); return; }
	if (route === 'git') { wireGit(); return; }
	if (route === 'files') { wireFiles(); return; }
	wireTabs();
	wireMembers();
	wireBoard();
	wireTrash();
	wireFiles();
	wireGit();
	const createBtn = document.getElementById('btnCreateTeam');
	createBtn?.addEventListener('click', () => {
		openModal({
			title: T('createTeam'), sub: T('newTeamSub'), actionText: T('create'),
			body: `<div class="field"><label>${esc(T('teamName'))}</label><input data-team-name maxlength="40" placeholder="My Team" autofocus></div>`,
			onAction: async (overlay) => {
				const name = overlay.querySelector('[data-team-name]')?.value?.trim();
				if (!name) { toast(T('teamName'), 'err'); return true; }
				await demo('auraTeam.createTeam', [name]);
				return false;
			}
		});
		setTimeout(() => document.querySelector('[data-team-name]')?.focus(), 30);
	});
	const joinBtn = document.getElementById('btnJoinTeam');
	joinBtn?.addEventListener('click', () => {
		openModal({
			title: T('joinTeam'), sub: T('inviteSub'), actionText: T('join'),
			body: `<div class="field"><label>${esc(T('inviteCode'))}</label><input data-join-code maxlength="24" placeholder="XXXXXXXXXXXX" spellcheck="false" autofocus></div>`,
			onAction: async (overlay) => {
				const code = overlay.querySelector('[data-join-code]')?.value?.trim();
				if (!code) { toast(T('inviteCode'), 'err'); return true; }
				await demo('auraTeam.joinTeam', [code]);
				return false;
			}
		});
		setTimeout(() => document.querySelector('[data-join-code]')?.focus(), 30);
	});
	const inviteBtn = document.getElementById('btnInvite');
	inviteBtn?.addEventListener('click', () => openInviteMenu());
	document.querySelectorAll('.card[data-team]').forEach((card) => card.addEventListener('click', () => {
		const id = card.dataset.team;
		if (id !== state.teamId) {
			state.teamId = id;
			void demo('auraTeam.selectTeam', [id]);
		}
	}));
}

/* ---------- Старт ---------- */
skeleton();
vscode.postMessage({ type: 'ready' });
// первая отрисовка по приходу state; wire() вызывается после каждого mount

</script>
</body>
</html>
