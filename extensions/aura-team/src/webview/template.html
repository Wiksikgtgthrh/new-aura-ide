<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-__NONCE__'; img-src data:; font-src data:;">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team</title>
<style>
/* ============================================================
   Aura Team — design system
   Всё на токенах темы VS Code: светлая и тёмная тема из коробки.
   ============================================================ */
:root {
	--bg: var(--vscode-editor-background);
	--surface: var(--vscode-editorWidget-background);
	--card: color-mix(in srgb, var(--vscode-editorWidget-background) 55%, transparent);
	--card-hover: color-mix(in srgb, var(--vscode-editorWidget-background) 85%, var(--vscode-foreground) 4%);
	--border: var(--vscode-widget-border, color-mix(in srgb, var(--vscode-foreground) 18%, transparent));
	--border-soft: color-mix(in srgb, var(--vscode-foreground) 10%, transparent);
	--text: var(--vscode-foreground);
	--muted: var(--vscode-descriptionForeground);
	--accent: var(--vscode-button-background);
	--accent-hover: var(--vscode-button-hoverBackground);
	--accent-fg: var(--vscode-button-foreground);
	--input-bg: var(--vscode-input-background);
	--input-border: var(--vscode-input-border, transparent);
	--focus: var(--vscode-focusBorder);
	--danger: var(--vscode-errorForeground);
	--ok: var(--vscode-testing-iconPassedForeground, #2ea043);
	--off: var(--vscode-testing-iconFailedForeground, #f85149);
	--warn: var(--vscode-editorWarning-foreground, #d29922);
	--link: var(--vscode-textLink-foreground);
	--shadow: 0 8px 28px color-mix(in srgb, var(--vscode-widget-shadow, #000) 45%, transparent);
	--radius: 12px;
	--radius-sm: 8px;
	--r-card: 10px;
	--r-ctl: 6px;
	--sp-1: 4px;
	--sp-2: 8px;
	--sp-3: 12px;
	--sp-4: 16px;
	--sp-5: 24px;
	--sp-6: 32px;
	--dur: 120ms;
	--dur-1: 90ms;
	--dur-2: 160ms;
	--dur-3: 240ms;
	--ease: cubic-bezier(.2, 0, 0, 1);
	--ease-out: cubic-bezier(.2, 0, 0, 1);
	--r-box: 10px;
	--font: var(--vscode-font-family);
	--mono: var(--vscode-editor-font-family, ui-monospace, monospace);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
	font-family: var(--font);
	font-size: 13px;
	color: var(--text);
	background: var(--bg);
	overflow: hidden;
	-webkit-font-smoothing: antialiased;
}
button { font-family: inherit; font-size: 13px; color: inherit; background: none; border: none; cursor: pointer; }
input, textarea, select {
	font-family: inherit; font-size: 13px; color: var(--text);
	background: var(--input-bg);
	border: 1px solid var(--input-border);
	border-radius: var(--radius-sm);
	padding: 8px 10px;
	outline: none;
	transition: border-color .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease);
}
input:focus, textarea:focus, select:focus { border-color: var(--focus); box-shadow: 0 0 0 2px color-mix(in srgb, var(--focus) 35%, transparent); }
::placeholder { color: var(--muted); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--vscode-scrollbarSlider-background, #5a5d5e) 80%, transparent); border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background-color: var(--vscode-scrollbarSlider-hoverBackground); }

/* ---------- Анимации ---------- */
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px) scale(.995); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { from { opacity: 0; transform: scale(.96) translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
@keyframes slideRight { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 45%, transparent); } 50% { box-shadow: 0 0 0 5px transparent; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@keyframes toastIn { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes modalIn { from { opacity: 0; transform: scale(.94) translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes barGrow { from { width: 0; } to { width: 100%; } }
@keyframes dotPing { 0% { transform: scale(1); opacity: .9; } 80%, 100% { transform: scale(2.4); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
	* { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ---------- Каркас ---------- */
#app { display: grid; grid-template-rows: 52px 1fr; grid-template-columns: 64px 1fr; height: 100%; }

/* ---------- Верхняя панель ---------- */
.topbar {
	grid-column: 1 / -1;
	display: flex; align-items: center; justify-content: space-between;
	padding: 0 12px 0 4px;
	border-bottom: 1px solid var(--border-soft);
	background: var(--surface);
	position: relative; z-index: 30;
	animation: slideDown .3s var(--ease);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-logo {
	width: 30px; height: 30px; border-radius: 9px; flex: none;
	display: grid; place-items: center;
	background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 35%, var(--bg)));
	box-shadow: 0 3px 10px color-mix(in srgb, var(--accent) 40%, transparent);
}
.brand-logo svg { width: 17px; height: 17px; }
.brand-name { font-weight: 600; font-size: 13px; letter-spacing: .2px; display: flex; align-items: center; gap: 8px; }
.badge {
	font-size: 10px; font-weight: 600; letter-spacing: .4px;
	padding: 2px 8px; border-radius: 999px; text-transform: uppercase;
	transition: background .2s var(--ease), color .2s var(--ease);
}
.badge.demo { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.badge.live { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.badge.off { background: color-mix(in srgb, var(--off) 14%, transparent); color: var(--off); }
.top-right { display: flex; align-items: center; gap: 6px; position: relative; }

/* Аватар профиля — правый верхний угол */
.avatar {
	width: 32px; height: 32px; border-radius: 50%;
	display: grid; place-items: center;
	font-weight: 700; font-size: 12px; color: #fff;
	transition: transform .2s var(--ease), box-shadow .2s var(--ease);
	animation: fadeIn .4s ease;
}
.avatar:hover { transform: scale(1.08); }
.avatar::after {
	content: ''; position: absolute; right: -1px; bottom: -1px;
	width: 9px; height: 9px; border-radius: 50%;
	background: var(--ok); border: 2px solid var(--surface);
}
.avatar.github::after { background: var(--ok); }
.popover {
	position: absolute; top: 42px; right: 0; min-width: 190px; z-index: 60;
	background: var(--surface);
	border: 1px solid var(--border);
	border-radius: var(--radius);
	box-shadow: var(--shadow);
	padding: 6px;
	animation: popIn .18s var(--ease);
}
.popover::before {
	content: ''; position: absolute; top: -6px; right: 14px;
	width: 10px; height: 10px; background: var(--surface);
	border-left: 1px solid var(--border); border-top: 1px solid var(--border);
	transform: rotate(45deg);
}
.popover-item {
	display: flex; align-items: center; gap: 9px; width: 100%;
	padding: 8px 10px; border-radius: var(--radius-sm);
	transition: background .15s var(--ease);
}
.popover-item:hover { background: var(--card-hover); }
.popover-item .ico { width: 15px; height: 15px; flex: none; }
.popover-item.danger { color: var(--danger); }
.popover-head { padding: 6px 10px 8px; border-bottom: 1px solid var(--border-soft); margin-bottom: 6px; }
.popover-head .name { font-weight: 600; font-size: 12.5px; }
.popover-head .id { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }

/* ---------- Левый рейл ---------- */
.rail {
	grid-row: 2; grid-column: 1;
	display: flex; flex-direction: column; align-items: center; gap: 6px;
	padding: 10px 8px;
	border-right: 1px solid var(--border-soft);
	background: var(--surface);
}
.rail-btn {
	width: 48px; height: 44px; border-radius: 10px;
	display: grid; place-items: center;
	position: relative;
	color: var(--muted);
	transition: background .18s var(--ease), color .18s var(--ease), transform .18s var(--ease);
}
.rail-btn svg { width: 19px; height: 19px; }
.rail-btn:hover { background: var(--card-hover); color: var(--text); transform: translateY(-1px); }
.rail-btn.active { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent); }
.rail-btn.active::after {
	content: ''; position: absolute; left: -8px; top: 50%; transform: translateY(-50%);
	width: 3px; height: 22px; border-radius: 3px; background: var(--accent);
	animation: fadeIn .2s ease;
}
.rail-btn[data-badge]::before {
	content: attr(data-badge); position: absolute; top: 4px; right: 4px;
	min-width: 14px; height: 14px; padding: 0 3px;
	display: grid; place-items: center;
	font-size: 9px; font-weight: 700; color: var(--accent-fg);
	background: var(--accent); border-radius: 999px;
	animation: popIn .25s var(--ease);
}

/* ---------- Контент ---------- */
.view-wrap {
	grid-row: 2; grid-column: 2;
	overflow-y: auto; overflow-x: hidden;
	padding: 18px 22px 30px;
	animation: fadeUp .28s var(--ease);
}
.view-head { margin-bottom: 16px; animation: fadeUp .3s var(--ease); }
.view-title { font-size: 18px; font-weight: 700; letter-spacing: -.2px; display: flex; align-items: center; gap: 10px; }
.view-sub { color: var(--muted); font-size: 12px; margin-top: 4px; }

/* ---------- Карточки ---------- */
.card {
	background: var(--card);
	border: 1px solid var(--border-soft);
	border-radius: var(--radius);
	padding: 16px;
	transition: transform .22s var(--ease), border-color .22s var(--ease), box-shadow .22s var(--ease), background .22s var(--ease);
	animation: fadeUp .35s var(--ease) both;
	animation-delay: calc(var(--i, 0) * 45ms);
}
.card.profile-card { max-width: 620px; }
.card.clickable { cursor: pointer; }
.card.clickable:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); box-shadow: var(--shadow); }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.card h3 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.card .sub { color: var(--muted); font-size: 11.5px; }
.card .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

/* ---------- Чипы / бейджи ---------- */
.chip {
	display: inline-flex; align-items: center; gap: 5px;
	font-size: 10.5px; font-weight: 600; letter-spacing: .3px;
	padding: 3px 9px; border-radius: 999px;
	background: color-mix(in srgb, var(--muted) 14%, transparent);
	color: var(--muted);
}
.chip.accent { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
.chip.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.chip.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.chip.off { background: color-mix(in srgb, var(--off) 14%, transparent); color: var(--off); }

/* ---------- Кнопки ---------- */
.btn {
	display: inline-flex; align-items: center; justify-content: center; gap: 7px;
	padding: 8px 14px; border-radius: var(--radius-sm);
	font-weight: 600; font-size: 12.5px;
	transition: transform .18s var(--ease), background .18s var(--ease), box-shadow .18s var(--ease), opacity .18s;
	position: relative; overflow: hidden;
}
.btn svg { width: 14px; height: 14px; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.btn.primary { background: var(--accent); color: var(--accent-fg); box-shadow: 0 3px 12px color-mix(in srgb, var(--accent) 35%, transparent); }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn.ghost { background: var(--card-hover); }
.btn.ghost:hover:not(:disabled) { background: color-mix(in srgb, var(--card-hover) 80%, var(--accent) 10%); }
.btn.danger { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
.btn.danger:hover:not(:disabled) { background: color-mix(in srgb, var(--danger) 26%, transparent); }
/* Доступность: текст на danger-фоне должен читаться даже если errorForeground тёмный. */
.btn.danger, .btn.logout-danger { color: color-mix(in srgb, var(--danger) 60%, var(--text)); }
.btn.sm { padding: 5px 10px; font-size: 11.5px; border-radius: 7px; }
.btn.lg { padding: 11px 18px; font-size: 13.5px; border-radius: 10px; }
.btn .spin { width: 14px; height: 14px; border: 2px solid color-mix(in srgb, currentColor 35%, transparent); border-top-color: currentColor; border-radius: 50%; animation: spin .7s linear infinite; }

/* Рябь на кнопках */
.ripple { position: absolute; border-radius: 50%; background: color-mix(in srgb, currentColor 14%, transparent); transform: scale(0); animation: rippleAnim .5s var(--ease); pointer-events: none; }
@keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

/* ---------- Формы ---------- */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .3px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; }
.field input, .field textarea, .field select { width: 100%; }
.field .err { color: var(--danger); font-size: 11px; margin-top: 5px; display: flex; align-items: center; gap: 5px; animation: fadeUp .2s var(--ease); }
.field .hint { color: var(--muted); font-size: 11px; margin-top: 5px; }
.linklike { color: var(--link); cursor: pointer; text-decoration: none; font-size: 11.5px; }
.linklike:hover { text-decoration: underline; }
.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
/* Поле пароля с кнопкой-глазом (показать/скрыть) */
.pass-wrap { position: relative; }
.pass-wrap input { padding-right: 40px; }
.pass-eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; display: grid; place-items: center; border-radius: 7px; color: var(--muted); opacity: .75; transition: opacity .15s ease, background .15s ease; }
.pass-eye:hover { opacity: 1; background: var(--card-hover); }
.pass-eye svg { width: 17px; height: 17px; }
.pass-eye.on { color: var(--accent); opacity: 1; }

/* ---------- Пустая / подсказочная панель ---------- */
.empty {
	display: grid; place-items: center; text-align: center;
	padding: 40px 20px; color: var(--muted);
	border: 1px solid var(--border); border-radius: var(--radius);
	animation: fadeUp .3s var(--ease);
}
.empty svg { width: 34px; height: 34px; margin-bottom: 12px; opacity: .7; }
.empty .big { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 6px; }

/* ---------- Участники ---------- */
.member { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius-sm); transition: background .18s var(--ease); animation: fadeUp .3s var(--ease) both; animation-delay: calc(var(--i, 0) * 40ms); }
.member:hover { background: var(--card-hover); }
.avatar-mini {
	width: 30px; height: 30px; border-radius: 50%; flex: none;
	display: grid; place-items: center;
	font-weight: 700; font-size: 11px; color: #fff;
	position: relative;
}
.presence { position: absolute; right: -1px; bottom: -1px; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); border: 1.5px solid var(--surface); }
.presence.off { background: var(--muted); }
.presence.live { animation: dotPing 1.6s ease-out infinite; }
.member .meta { flex: 1; min-width: 0; }
.member .mname { font-weight: 600; font-size: 12.5px; }
.member .memail { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.member select { padding: 4px 6px; font-size: 11px; border-radius: 6px; }

/* ---------- Вкладки внутри команды ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border-soft); margin-bottom: 16px; }
.tab {
	padding: 8px 14px; font-weight: 600; font-size: 12.5px; color: var(--muted);
	border-bottom: 2px solid transparent; margin-bottom: -1px;
	transition: color .18s var(--ease), border-color .18s var(--ease);
	position: relative;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-color: var(--accent); }
.tab.active::after { content: ''; position: absolute; bottom: -2px; left: 0; right: 0; height: 2px; background: var(--accent); border-radius: 2px; animation: barGrow .3s var(--ease); }

/* ---------- Быстрые ярлыки разделов (как в сайдбаре) ---------- */
.quick-nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 4px; }
.quick-nav .btn svg { width: 15px; height: 15px; flex: none; }
.quick-nav .btn.active { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent); }

/* ---------- Git ---------- */
.git-card { margin-bottom: 14px; }
.git-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.repo-path { font-family: var(--mono); font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 340px; }
.branch-select { padding: 5px 9px; font-size: 12px; border-radius: 7px; width: auto; min-width: 150px; }
/* Стандарт работы в репозитории: три шага, первый — ветка задачи. */
.git-flow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; font-size: 10.5px; color: var(--muted); }
.git-flow .step { padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--text) 8%, transparent); }
.git-flow .step.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.git-flow .step.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.git-flow .mono { font-family: var(--mono); }
.commit-line { display: flex; gap: 8px; margin-top: 14px; }
.commit-line input { flex: 1; }
.changes-list { margin-top: 12px; border-top: 1px solid var(--border-soft); padding-top: 10px; }
.change-item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; font-family: var(--mono); font-size: 11px; animation: slideRight .25s var(--ease) both; animation-delay: calc(var(--i, 0) * 25ms); }
.change-item:hover { background: var(--card-hover); }
.change-item .kind { flex: none; font-size: 9.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; letter-spacing: .5px; }
.change-item .kind.index { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
.change-item .kind.working { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.change-item .change-path { cursor: pointer; text-decoration: underline dotted transparent; text-underline-offset: 3px; }
.change-item .change-path:hover { color: var(--accent); text-decoration-color: var(--accent); }
.change-item input[type=checkbox] { accent-color: var(--accent); }
.change-item .kind.untracked { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.history-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-radius: 8px; transition: background .18s var(--ease); animation: fadeUp .3s var(--ease) both; animation-delay: calc(var(--i, 0) * 30ms); }
.history-item:hover { background: var(--card-hover); }
.hist-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 5px; flex: none; box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 60%, transparent); }
.hist-msg { font-size: 12.5px; font-weight: 500; }
.hist-meta { font-size: 10.5px; color: var(--muted); font-family: var(--mono); margin-top: 2px; }

/* ---------- Доска задач ---------- */
/* Доска занимает всю высоту; скроллится тело колонки, при переполнении — сама доска по горизонтали. */
.view-wrap.view-board { overflow: hidden; padding: var(--sp-4) var(--sp-5) var(--sp-5); }
/* min-height: 0 обязателен: без него grid-элемент берёт min-content высоту
   и доска вылезает за окно на высоту отступов самого вида. */
.view-wrap.view-board, .view-wrap.view-board #viewBody { min-height: 0; }
.view-wrap.view-board #viewBody { height: 100%; }
.board-root { display: flex; flex-direction: column; height: 100%; min-height: 0; }
/* Хост доски обязан расти: обычный блок схлопывает сетку колонок по контенту,
   и доска занимает верхнюю треть экрана вместо всей высоты. */
#boardHost { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.board-head { margin-bottom: var(--sp-3); animation: none; }
.board-head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-4); }
.board-h1 { font-size: 20px; font-weight: 600; letter-spacing: -.2px; line-height: 1.2; }
.board-sub { font-size: 13px; color: var(--muted); margin-top: var(--sp-1); }
.board-sub .overdue-count { color: var(--vscode-errorForeground); }
.board-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-2); min-height: 32px; margin-top: var(--sp-3); }
/* height 28px требует нулевого вертикального padding: с базовым padding 8px
   текст нативного селекта обрезался сверху. */
.board-search, .board-assignee { height: 28px; padding: 0 var(--sp-2); font-size: 12px; }
.board-search { width: 220px; }
.board-assignee { max-width: 230px; }
.board-toolbar .icon-btn { width: 28px; height: 28px; }
.board-toolbar .board-toggle { height: 28px; }
.board-spacer { flex: 1 1 auto; }
.board-toggle { display: inline-flex; align-items: center; gap: var(--sp-1); height: 26px; padding: 0 var(--sp-2); border-radius: var(--r-ctl); font-size: 12px; color: var(--muted); transition: background var(--dur-1) var(--ease-out), color var(--dur-1) var(--ease-out); }
.board-toggle svg { width: 13px; height: 13px; }
.board-toggle:hover { background: color-mix(in srgb, var(--vscode-foreground) 8%, transparent); color: var(--text); }
.board-toggle.on { background: var(--vscode-inputOption-activeBackground); color: var(--vscode-inputOption-activeForeground, var(--text)); }
.icon-btn { position: relative; width: 26px; height: 26px; flex: none; display: grid; place-items: center; border-radius: var(--r-ctl); color: var(--muted); transition: background var(--dur-1) var(--ease-out), color var(--dur-1) var(--ease-out); }
.icon-btn svg { width: 15px; height: 15px; }
.icon-btn:hover { background: color-mix(in srgb, var(--vscode-foreground) 10%, transparent); color: var(--text); }
.icon-btn.spinning svg { animation: spin var(--dur-3) linear; }
.icon-btn .icon-badge { position: absolute; top: -3px; right: -3px; min-width: 13px; height: 13px; padding: 0 3px; display: grid; place-items: center; border-radius: 999px; background: color-mix(in srgb, var(--vscode-foreground) 20%, transparent); color: var(--text); font-size: 9px; }
.board-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.board { flex: 1 1 auto; min-height: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 1fr); gap: var(--sp-3); overflow-x: auto; overflow-y: hidden; padding-bottom: var(--sp-1); }
.column { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: color-mix(in srgb, var(--vscode-foreground) 4%, transparent); border-radius: var(--r-box); transition: background var(--dur-1) var(--ease-out); }
.column.drag-over { background: color-mix(in srgb, var(--vscode-foreground) 8%, transparent); }
.column.wip-warn { background: color-mix(in srgb, var(--vscode-editorWarning-foreground) 14%, transparent); }
.column-head { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-3); border-bottom: 1px solid transparent; position: sticky; top: 0; z-index: 1; }
.column-head[data-over='1'] { border-bottom-color: var(--vscode-editorWarning-foreground); }
.col-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--muted); }
.col-dot[data-status='doing'] { background: var(--vscode-charts-blue); }
.col-dot[data-status='review'] { background: var(--vscode-charts-purple); }
.col-dot[data-status='done'] { background: var(--vscode-charts-green); }
.col-name { font-size: 11px; color: var(--muted); letter-spacing: .04em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.col-count { min-width: 18px; height: 18px; padding: 0 var(--sp-1); display: inline-grid; place-items: center; border-radius: 999px; font-size: 11px; color: var(--muted); background: color-mix(in srgb, var(--vscode-foreground) 10%, transparent); font-variant-numeric: tabular-nums; }
.col-count.over { color: var(--vscode-editorWarning-foreground); }
.col-menu-btn { margin-left: auto; opacity: 0; transition: opacity var(--dur-2) var(--ease-out); }
.column:hover .col-menu-btn, .column:focus-within .col-menu-btn { opacity: 1; }
.column-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-2); }
.column-body::after { content: ''; display: none; height: 46px; border-radius: var(--r-card); background: color-mix(in srgb, var(--vscode-foreground) 8%, transparent); }
.column.drop-hint .column-body::after { display: block; }
.column.collapsed .column-body { display: none; }
.board-empty { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); padding-top: var(--sp-6); text-align: center; }
.board-empty svg { width: 32px; height: 32px; opacity: .4; }
.board-empty .be-title { font-size: 13px; }
.board-empty .be-sub { font-size: 11px; color: var(--muted); }
.task { position: relative; background: var(--card); border: 1px solid var(--border-soft); border-radius: var(--r-card); padding: var(--sp-3); cursor: grab; transition: border-color var(--dur-1) var(--ease-out), opacity var(--dur-2) var(--ease-out), transform var(--dur-2) var(--ease-out); }
.task:hover { border-color: var(--vscode-focusBorder); }
.task:focus-visible { outline: none; border-color: var(--vscode-focusBorder); }
.task.dim { opacity: .35; }
/* Временная карточка до подтверждения сервером: без действий и перетаскивания. */
.task.pending { opacity: .55; cursor: progress; }
.task.dragging { opacity: .4; cursor: grabbing; }
.task.grabbed { border-color: var(--vscode-focusBorder); }
.task.removing { opacity: 0; transform: scale(.98); }
.task.highlight { border-color: var(--accent); }
.task-top { display: flex; align-items: flex-start; gap: var(--sp-1); }
.task-title { font-size: 13px; line-height: 1.35; flex: 1 1 auto; min-width: 0; }
.task-title mark { background: color-mix(in srgb, var(--vscode-editor-findMatchHighlightBackground, var(--accent)) 70%, transparent); color: inherit; border-radius: 2px; }
.task-menu { flex: none; width: 22px; height: 22px; opacity: 0; }
.task:hover .task-menu, .task:focus-within .task-menu { opacity: 1; }
.task-desc { margin-top: var(--sp-1); font-size: 11px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.task-meta { display: flex; align-items: center; gap: var(--sp-2); margin-top: var(--sp-2); min-height: 16px; }
.task-meta .spacer { flex: 1 1 auto; }
.task-meta time { font-size: 10.5px; color: var(--muted); }
.chip.due { font-size: 10.5px; padding: 1px 7px; background: color-mix(in srgb, var(--vscode-foreground) 8%, transparent); color: var(--muted); }
.chip.due.soon { color: var(--vscode-editorWarning-foreground); background: color-mix(in srgb, var(--vscode-editorWarning-foreground) 15%, transparent); }
.chip.due.overdue { color: var(--vscode-errorForeground); background: color-mix(in srgb, var(--vscode-errorForeground) 15%, transparent); }
.chip.due svg { width: 11px; height: 11px; }
.chip.priority { font-size: 10.5px; padding: 1px 6px; background: color-mix(in srgb, var(--vscode-foreground) 10%, transparent); color: var(--muted); }
.chip.priority.high { color: var(--vscode-errorForeground); }
.avatar-16 { width: 16px; height: 16px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 8px; color: var(--vscode-editor-background); }
.add-task-inline { display: flex; align-items: center; gap: var(--sp-2); width: 100%; padding: var(--sp-2); border-radius: var(--r-ctl); color: var(--muted); font-size: 12px; text-align: left; transition: background var(--dur-1) var(--ease-out), color var(--dur-1) var(--ease-out); }
.add-task-inline svg { width: 13px; height: 13px; }
.add-task-inline:hover { background: color-mix(in srgb, var(--vscode-foreground) 8%, transparent); color: var(--text); }
.task-checklist { display: flex; flex-direction: column; gap: 2px; margin-top: var(--sp-2); }
.subtask { display: flex; align-items: center; gap: var(--sp-2); font-size: 11px; color: var(--muted); cursor: pointer; }
.subtask input { flex: none; width: 12px; height: 12px; accent-color: var(--vscode-charts-blue); }
.subtask span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.subtask.done span { text-decoration: line-through; opacity: .65; }
.subtask-more { font-size: 10.5px; color: var(--muted); }
.chip.progress { font-size: 10.5px; padding: 1px 7px; background: color-mix(in srgb, var(--vscode-foreground) 10%, transparent); color: var(--muted); font-variant-numeric: tabular-nums; }
.task-form textarea { width: 100%; min-height: 54px; resize: vertical; }
.task-placeholder { border-radius: var(--r-card); background: color-mix(in srgb, var(--vscode-foreground) 8%, transparent); }
/* Дата-контролы: системный индикатор календаря в тёмной теме почти чёрный —
   прячем его и рисуем свой в акцентном цвете, клик проходит сквозь иконку в индикатор. */
.date-field { position: relative; display: flex; align-items: center; }
.date-field > input { width: 100%; padding-right: 30px; }
.date-field .date-pick { position: absolute; right: 8px; top: 0; bottom: 0; display: grid; place-items: center; width: 16px; color: var(--vscode-focusBorder); pointer-events: none; }
.date-field .date-pick svg { width: 16px; height: 16px; }
.date-field input::-webkit-calendar-picker-indicator { opacity: 0; cursor: pointer; }
.due-quick { display: flex; flex-wrap: wrap; gap: var(--sp-1); margin-top: var(--sp-1); }
.due-quick button { padding: 2px var(--sp-2); font-size: 11px; border-radius: var(--r-ctl); color: var(--muted); background: color-mix(in srgb, var(--vscode-foreground) 8%, transparent); transition: background var(--dur-1) var(--ease-out), color var(--dur-1) var(--ease-out); }
.due-quick button:hover { background: color-mix(in srgb, var(--vscode-foreground) 14%, transparent); color: var(--vscode-foreground); }
.drag-ghost { position: fixed; z-index: 300; pointer-events: none; border-radius: var(--r-card); background: var(--card); border: 1px solid var(--border-soft); box-shadow: var(--shadow); transform: rotate(2deg); }
.board-menu { position: fixed; z-index: 120; min-width: 190px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); box-shadow: var(--shadow); padding: var(--sp-1); }
.board-menu button { display: flex; align-items: center; gap: var(--sp-2); width: 100%; padding: var(--sp-2); border-radius: var(--r-ctl); font-size: 12px; text-align: left; }
.board-menu button:hover { background: var(--card-hover); }
.board-menu input { width: 100%; }
.board-trash { margin-top: var(--sp-3); flex: none; }
.task-detail { position: fixed; top: 0; right: 0; bottom: 0; z-index: 110; width: min(380px, 42vw); display: flex; flex-direction: column; gap: var(--sp-3); padding: var(--sp-4); background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; }
.task-detail-head { display: flex; align-items: center; gap: var(--sp-2); }
.task-detail-title { font-size: 16px; font-weight: 600; flex: 1 1 auto; min-width: 0; }
.task-detail .field { margin-bottom: 0; }
.subtask-list { display: flex; flex-direction: column; gap: 2px; margin-bottom: var(--sp-2); }
.subtask-row { display: flex; align-items: center; gap: var(--sp-2); padding: 2px 0; }
.subtask-row input[type=checkbox] { flex: none; accent-color: var(--vscode-charts-blue); }
.subtask-row .subtask-text { flex: 1 1 auto; min-width: 0; font-size: 12px; }
.subtask-row.done .subtask-text { text-decoration: line-through; opacity: .65; }
.subtask-row .icon-btn { width: 20px; height: 20px; opacity: 0; }
.subtask-row:hover .icon-btn, .subtask-row:focus-within .icon-btn { opacity: 1; }
.subtask-count { color: var(--muted); font-size: 11px; }
.subtask-add { width: 100%; }
/* Меню быстрых действий карточки (единственное место, где допустима тень вместе с drag-превью). */
.qa-pop { position: fixed; z-index: 90; width: 220px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow); padding: 8px; animation: popIn .16s var(--ease); }
.qa-seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 8px; }
.qa-seg button { padding: 5px 0; border-radius: 6px; font-size: 10.5px; font-weight: 600; background: var(--card-hover); color: var(--muted); }
.qa-seg button.on { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
.qa-pop .qa-row { display: flex; align-items: center; gap: 7px; padding: 6px 7px; border-radius: 6px; width: 100%; font-size: 12px; text-align: left; }
.qa-pop .qa-row:hover { background: var(--card-hover); }
.qa-pop .qa-due { display: flex; gap: 4px; margin: 6px 0; flex-wrap: wrap; }
.qa-pop .qa-due button { padding: 3px 8px; font-size: 10.5px; border-radius: 999px; background: var(--card-hover); }
.qa-pop .qa-due button:hover { background: color-mix(in srgb, var(--accent) 18%, transparent); }
.qa-div { border-top: 1px solid var(--border-soft); margin: 6px 0; }
@media (prefers-reduced-motion: reduce) {
	.task, .column, .icon-btn, .board-toggle, .add-task-inline { transition-duration: 1ms; }
}
.keys-shell { max-width: 1080px; margin-inline: auto; padding: var(--sp-5) var(--sp-5) var(--sp-6); }
.keys-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-4); margin-bottom: var(--sp-4); }
.keys-title { font-size: 20px; font-weight: 600; line-height: 1.2; }
.keys-head .btn.primary { flex: none; font-size: 13px; padding: 8px 14px; }
.keys-sub { font-size: 13px; color: var(--muted); margin-top: var(--sp-1); }
.keys-sub .must-answer { color: var(--vscode-errorForeground); }
.keys-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-4); }
.keys-search { width: 240px; }
.keys-filter { width: 160px; }
.keys-spacer { flex: 1 1 auto; }
.keys-grid { display: grid; gap: var(--sp-3); grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
.keys-grid > .key-card { min-width: 0; }

/* Карточка ключа — плоская, без теней и анимаций */
.key-card {
	position: relative;
	background: var(--surface);
	border: 1px solid var(--border);
	border-radius: 10px;
	padding: var(--sp-4);
	transition: border-color 120ms cubic-bezier(.2, 0, 0, 1);
}
.key-card:hover, .key-card:focus-within {
	border-color: var(--focus);
}

/* Шапка карточки: идентификация + статус */
.key-card-header {
	display: flex;
	align-items: flex-start;
	gap: var(--sp-3);
}
.key-card-top {
	display: flex;
	flex-direction: column;
	gap: var(--sp-1);
	min-width: 0;
	flex: 1;
}
.provider-dot {
	flex: none;
	width: 8px;
	height: 8px;
	border-radius: 50%;
	box-shadow: 0 0 0 3px color-mix(in srgb, var(--vscode-foreground) 8%, transparent);
}
.key-name {
	font-size: 13px;
	font-weight: 600;
	line-height: 1.3;
	color: var(--text);
	title: attr(data-name);
}
.key-ident {
	font-size: 11px;
	color: var(--muted);
	white-space: nowrap;
	overflow: hidden;
	text-overflow: ellipsis;
	font-family: var(--mono);
	user-select: none;
}

/* Статус-бейдж — только когда проблема */
.key-badge {
	flex: none;
	display: inline-flex;
	align-items: center;
	gap: 6px;
	min-width: 0;
	font-size: 11px;
	font-weight: 500;
	padding: 3px 9px;
	border-radius: 999px;
	background: color-mix(in srgb, var(--vscode-foreground) 8%, transparent);
	color: var(--muted);
	text-align: left;
	white-space: nowrap;
	transition: background 120ms cubic-bezier(.2, 0, 0, 1), color 120ms cubic-bezier(.2, 0, 0, 1);
}
.key-badge::before {
	content: '';
	flex: none;
	width: 7px;
	height: 7px;
	border-radius: 50%;
	background: currentColor;
	opacity: .55;
}
.key-badge.error {
	background: color-mix(in srgb, var(--vscode-errorForeground) 16%, transparent);
	color: var(--vscode-errorForeground);
}
.key-badge.warn {
	background: color-mix(in srgb, var(--vscode-editorWarning-foreground, var(--vscode-charts-yellow)) 16%, transparent);
	color: var(--vscode-editorWarning-foreground, var(--vscode-charts-yellow));
}
.key-badge.unknown {
	background: color-mix(in srgb, var(--vscode-foreground) 10%, transparent);
	color: var(--muted);
}

/* Подвал карточки */
.key-card-footer {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: var(--sp-3);
	margin-top: var(--sp-3);
	padding-top: var(--sp-3);
	border-top: 1px solid var(--border-soft);
}
.key-meta {
	font-size: 11px;
	color: var(--muted);
	display: flex;
	flex-wrap: wrap;
	align-items: center;
	gap: 6px;
	flex: 1;
	min-width: 0;
}

/* Действия карточки — всегда видимые ghost-кнопки: скрытый до наведения контент не находят */
.key-actions {
	display: flex;
	align-items: center;
	gap: var(--sp-1);
	flex: none;
}
.key-actions .key-act {
	padding: 3px 10px;
	border: 1px solid var(--border);
	border-radius: var(--r-ctl);
	background: transparent;
	color: var(--muted);
	font-size: 11.5px;
	line-height: 1.4;
	cursor: pointer;
	transition: color 120ms cubic-bezier(.2, 0, 0, 1), border-color 120ms cubic-bezier(.2, 0, 0, 1), background 120ms cubic-bezier(.2, 0, 0, 1);
}
.key-actions .key-act:hover {
	color: var(--text);
	border-color: var(--focus);
	background: color-mix(in srgb, var(--focus) 8%, transparent);
}
.key-actions .key-act.danger:hover {
	color: var(--vscode-errorForeground);
	border-color: color-mix(in srgb, var(--vscode-errorForeground) 50%, transparent);
	background: color-mix(in srgb, var(--vscode-errorForeground) 8%, transparent);
}
.key-actions .key-act:disabled { opacity: .6; cursor: default; }
.key-actions .key-act:focus-visible { outline: 1px solid var(--focus); outline-offset: 1px; }

/* Тумблер — правый нижний, всегда видимый */
.key-card .switch {
	flex: none;
	display: inline-flex;
	align-items: center;
	gap: 6px;
	cursor: pointer;
}
.key-card .switch input[type=checkbox] {
	width: 28px;
	height: 16px;
	border-radius: 8px;
	appearance: none;
	background: color-mix(in srgb, var(--vscode-foreground) 12%, transparent);
	position: relative;
	transition: background 120ms cubic-bezier(.2, 0, 0, 1);
	cursor: pointer;
}
.key-card .switch input[type=checkbox]::after {
	content: '';
	position: absolute;
	top: 2px;
	left: 2px;
	width: 12px;
	height: 12px;
	border-radius: 50%;
	background: color-mix(in srgb, var(--vscode-foreground) 65%, transparent);
	transition: transform 120ms cubic-bezier(.2, 0, 0, 1), background 120ms cubic-bezier(.2, 0, 0, 1);
}
.key-card .switch input[type=checkbox]:checked {
	background: color-mix(in srgb, var(--vscode-charts-blue) 40%, transparent);
}
.key-card .switch input[type=checkbox]:checked::after {
	transform: translateX(12px);
	background: var(--vscode-charts-blue);
}
.key-card .switch input[type=checkbox]:focus-visible {
	outline: 1px solid var(--focus);
	outline-offset: 2px;
}

/* Метка тумблера */
.key-card .switch-label {
	font-size: 11px;
	color: var(--muted);
	user-select: none;
}



/* Меню «Ещё» */
.more-menu {
	position: fixed;
	z-index: 50;
	min-width: 180px;
	background: var(--surface);
	border: 1px solid var(--border);
	border-radius: 6px;
	box-shadow: 0 4px 14px color-mix(in srgb, var(--vscode-widget-shadow) 45%, transparent);
	padding: 4px;
	animation: popIn 120ms cubic-bezier(.2, 0, 0, 1);
}
.more-menu button {
	display: flex;
	align-items: center;
	gap: var(--sp-2);
	width: 100%;
	padding: 6px 10px;
	border-radius: 6px;
	text-align: left;
	font-size: 13px;
	color: var(--text);
	transition: background 120ms cubic-bezier(.2, 0, 0, 1);
}
.more-menu button:hover { background: var(--vscode-list-hoverBackground); }
.more-menu button.danger { color: var(--vscode-errorForeground); }
.more-menu button svg { width: 14px; height: 14px; }

/* Пустое состояние */
.keys-empty {
	display: flex;
	flex-direction: column;
	align-items: center;
	text-align: center;
	gap: var(--sp-2);
	padding: var(--sp-6) var(--sp-5);
	color: var(--muted);
}
.keys-empty .ico { opacity: .4; width: 32px; height: 32px; }
.keys-empty .big { font-size: 13px; color: var(--text); font-weight: 500; }
.keys-empty .sub { font-size: 11px; max-width: 360px; }
.keys-empty .btn.primary { margin-top: var(--sp-2); }

@media (max-width: 720px) {
	.keys-toolbar { gap: var(--sp-2); }
	.keys-search { width: 100%; }
	.keys-filter { width: 100%; }
	.keys-toolbar .keys-spacer { display: none; }
	.keys-toolbar .keys-more { margin-left: 0; width: 100%; }
	.keys-toolbar .keys-more button { width: 100%; justify-content: flex-start; }
}

/* ---------- Модалки ---------- */
.overlay {
	position: fixed; inset: 0; z-index: 100;
	background: color-mix(in srgb, var(--bg) 45%, var(--vscode-widget-shadow, #000000) 30%);
	backdrop-filter: blur(3px);
	display: grid; place-items: center;
	animation: overlayIn .2s ease;
}
.modal {
	width: min(520px, calc(100vw - 60px));
	max-height: min(620px, calc(100vh - 80px));
	overflow-y: auto;
	background: var(--surface);
	border: 1px solid var(--border);
	border-radius: 16px;

.modal { position: relative; }
.invite-code { font-family: var(--mono); font-size: 20px; font-weight: 700; letter-spacing: 2px; text-align: center; padding: 16px; background: color-mix(in srgb, var(--accent) 12%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); border-radius: var(--radius); margin: 8px 0 4px; animation: popIn .3s var(--ease); }
.invite-code.sm { font-size: 15px; padding: 10px 12px; letter-spacing: 1.5px; }
.invite-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; margin: 6px 0; }
.invite-user { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: var(--radius-sm); }
.invite-user:hover { background: color-mix(in srgb, var(--text) 6%, transparent); }
.invite-user-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }

.pill { font-size: 10.5px; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--ok, #34d399) 15%, transparent); color: var(--ok, #34d399); white-space: nowrap; }
.danger-text { color: var(--danger, #f87171); }
.presence-dot { position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; border-radius: 50%; background: var(--ok, #34d399); border: 2px solid var(--bg); }
.presence-dot.off { background: var(--text-30, #666); }
/* Таблица файлов: имя, проект, размер, автор, загружено, истекает, действия. */

.file-tr { display: grid; grid-template-columns: minmax(120px, 2fr) 70px minmax(80px, 1fr) 70px 90px minmax(150px, auto); gap: 10px; align-items: center; padding: 7px 8px; border-radius: 7px; font-size: 12px; animation: fadeUp .3s var(--ease) both; animation-delay: calc(var(--i, 0) * 30ms); }

.status-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

.status-dot.st-done { background: var(--ok, #2ea043); }
/* ---------- Тосты ---------- */
#toastRoot { position: fixed; bottom: 20px; right: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast {
	display: flex; align-items: center; gap: 9px;

	background: var(--surface);

/* Спокойная «настройковая» раскладка: секции с подписью слева и полями справа,
   плоский аватар, без свечений и капса — в духе нативных экранов VS Code. */
.profile { max-width: 760px; animation: fadeUp .25s var(--ease); }

	position: relative; flex: none; width: 64px; height: 64px; border-radius: 50%; overflow: hidden;

.avatar-edit:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.p-section { display: grid; grid-template-columns: minmax(150px, 220px) 1fr; gap: 8px 32px; padding: 20px 0; border-bottom: 1px solid var(--border-soft); }

.profile .btn.primary { box-shadow: none; }
.p-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 0; }

.p-row + .p-row { border-top: 1px solid var(--border-soft); }

.btn.outline-danger { background: transparent; color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 45%, transparent); }
.btn.outline-danger:hover:not(:disabled) { background: color-mix(in srgb, var(--danger) 10%, transparent); }

@media (max-width: 640px) { .p-section { grid-template-columns: 1fr; gap: 12px; } }
.profile > details.card { margin-top: 20px; max-width: none; }

.id-chip .icon-btn svg { width: 13px; height: 13px; }

.pw-toggle .eye { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); color: var(--muted); padding: 4px; border-radius: 6px; }
.pw-toggle .eye:hover { color: var(--text); background: var(--card-hover); }

.pin-row { display: flex; align-items: center; gap: 8px; margin: 12px 0; }
.pin-line { flex: 1; height: 1px; background: var(--border-soft); }

// Язык — из state.uiLanguage (настройка team.ui.language, по умолчанию русский).
let lang = 'ru';
const T = (key) => DICT[lang]?.[key] ?? DICT.en?.[key] ?? key;

/* ---------- Утилиты ---------- */
let state = null;
let route = ['teams','keys','profile','board','git','files','admin','login','register'].includes('__INITIAL_VIEW__') ? '__INITIAL_VIEW__' : 'teams';
let teamTab = 'members';
// Экран входа: если открыли с кнопки «Создать аккаунт» — сразу форма регистрации.
let authTab = '__INITIAL_VIEW__' === 'register' ? 'register' : 'login';
const pending = new Map();
let reqId = 1;

function svc(command, args = []) {
	return new Promise((resolve, reject) => {
		const id = reqId++;
		pending.set(id, { resolve, reject });
		vscode.postMessage({ type: 'invoke', command, args, id });
		setTimeout(() => { if (pending.has(id)) { pending.delete(id); reject(new Error('timeout')); } }, 10000);
	});
}

window.addEventListener('message', (event) => {
	const message = event.data;
	if (!message) { return; }
	if (message.type === 'response') {
		const p = pending.get(message.id);
		if (!p) { return; }
		pending.delete(message.id);
		message.ok ? p.resolve(message.result) : p.reject(new Error(message.error || 'error'));
	} else		if (message.type === 'board-filter') {
			boardFilter = message.filter ?? null;
			route = 'board';
			if (state) { render(); }
	} else if (message.type === 'navigate') {
		// Переиспользование вкладки: переход к разделу без создания новой копии.
		// Комментарий когда-то съел перевод строки — ветка молча уводила всё в 'teams'.
		const view = ['teams','keys','profile','login','register','board','git','files','admin'].includes(message.view) ? message.view : 'teams';
		route = view;
		if (view === 'register') { authTab = 'register'; } else if (view === 'login') { authTab = 'login'; }
		if (message.filter) {
			boardFilter = message.filter;
			route = 'board';
		}
		if (state) { render(); }
	} else if (message.type === 'state') {
		state = message.state;
		if (trashOpen) { trashHtml = ''; void ensureTrash().then(() => { if (trashOpen) { render(); } }); }
		// Язык: настройка team.ui.language ('ru' | 'en' | 'auto'); auto — язык IDE.
		if (typeof message.state?.uiLanguage === 'string') {
			const raw = message.state.uiLanguage;
			const ideRu = typeof message.state.ideLanguage === 'string' && message.state.ideLanguage.toLowerCase().startsWith('ru');
			const next = raw === 'auto' ? (ideRu ? 'ru' : 'en') : (raw === 'en' ? 'en' : 'ru');
			const langChanged = next !== lang;
			lang = next;
			if (langChanged) { render(); return; }
		}
		if (!route || ['teams','keys','profile','board','git','files','login','register','admin'].includes(route)) { render(); }
	// route валиден всегда — верхнеуровневые разделы board/git/files рендерятся напрямую.
	}
});

function esc(value) {
	return String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function initials(name, fallback = '?') {
	const parts = (name || '').trim().split(/\s+/).filter(Boolean);
	const first = parts[0]?.[0] ?? '';
	const second = parts.length > 1 ? parts[1][0] : (parts[0]?.[1] ?? '');
	return (first + second).toUpperCase() || fallback;
}
function flattenColor(color) { return color || '#6366f1'; }
function avatarColor(id) { return flattenColor(id); }
function timeAgo(iso) {
	if (!iso) { return ''; }
	const diff = Date.now() - new Date(iso).getTime();
	if (diff < 60000) { return T('justNow'); }
	if (diff < 3600000) { return Math.round(diff/60000) + 'm'; }
	if (diff < 86400000) { return Math.round(diff/3600000) + 'h'; }
	return new Date(iso).toLocaleDateString();
}
function copyText(text) {
	void navigator.clipboard.writeText(text).then(() => toast(T('copied'), 'ok')).catch(() => toast(text, 'ok'));
}
function ripple(event) {
	const btn = event.currentTarget;
	const rect = btn.getBoundingClientRect();
	const size = Math.max(rect.width, rect.height);
	const span = document.createElement('span');
	span.className = 'ripple';
	span.style.width = span.style.height = size + 'px';
	span.style.left = (event.clientX - rect.left - size / 2) + 'px';
	span.style.top = (event.clientY - rect.top - size / 2) + 'px';
	btn.appendChild(span);
	setTimeout(() => span.remove(), 500);
}

/* ---------- Тосты ---------- */
function toast(text, type = '') {
	const root = document.getElementById('toastRoot');
	const el = document.createElement('div');
	el.className = 'toast ' + type;
	el.innerHTML = `<svg class="toast-ico" viewBox="0 0 24 24" fill="none">${type === 'ok' ? '<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M8.5 12.2l2.4 2.4 4.6-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>' : type === 'err' ? '<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M9 9l6 6M15 9l-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>' : '<path d="M12 2l7.5 4.5v9L12 20l-7.5-4.5v-9L12 2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>'}</svg><span>${esc(text)}</span>`;
	root.appendChild(el);
	setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 260); }, 2600);
}

/* ---------- Модалки ---------- */
function openModal({ title, sub, body, actionText = T('create'), onAction, danger = false }) {
	const root = document.getElementById('modalRoot');
	// Закрываем предыдущие модалки: оставшиеся открытыми копии накапливали слушатели и DOM.
	root.querySelectorAll('.overlay').forEach((old) => old.remove());
	const overlay = document.createElement('div');
	overlay.className = 'overlay';
	overlay.innerHTML = `<div class="modal">
		<button class="modal-close" data-close="1"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
		<h2>${esc(title)}</h2>
		${sub ? `<div class="sub">${esc(sub)}</div>` : ''}
		<div class="modal-body">${body}</div>
		<div class="modal-actions">
			<button class="btn ghost" data-cancel="1">${esc(T('cancel'))}</button>
			<button class="btn ${danger ? 'danger' : 'primary'}" data-ok="1">${esc(actionText)}</button>
		</div>
	</div>`;
	root.appendChild(overlay);
	const close = () => { overlay.remove(); };
	overlay.addEventListener('click', (e) => { if (e.target === overlay || e.target.closest('[data-close]') || e.target.closest('[data-cancel]')) { close(); } });
	overlay.querySelector('[data-ok]').addEventListener('click', (e) => { ripple(e); onAction(overlay).then?.((keepOpen) => { if (!keepOpen) { close(); } }); });
	overlay.querySelector('[data-ok]').addEventListener('pointerdown', ripple);
	overlay.addEventListener('keydown', (e) => { if (e.key === 'Escape') { close(); } });
	overlay.querySelector('.modal').focus?.();
	return overlay;
}

/* ---------- Mock для демо-режима ---------- */
async function demo(command, args, talk = true) {
	if (!state?.demoMode) { return svc(command, args); }
	const ok = (msg) => { if (talk) { toast(msg, 'ok'); } };
	if (command === 'auraTeam.createTeam') {
		state.session.teams.push({ id: 't' + Date.now(), name: args[0] || 'Команда', role: 'owner' });
		ok(T('demoTeamCreated'));
	} else if (command === 'auraTeam.joinTeam') {
		state.session.teams.push({ id: 't' + Date.now(), name: 'Команда · ' + (args[0] || ''), role: 'dev' });
		ok(T('demoTeamJoined'));
	} else if (command === 'auraTeam.createInvite') {
		ok(T('demoInvite'));
		return { code: 'DEMO-' + Math.random().toString(36).slice(2, 8).toUpperCase() };
	} else if (command === 'auraTeam.createTask') {
		state.board.tasks.push({
			id: 'dt' + Date.now(), teamId: state.teamId, title: args[0] || 'Задача',
			description: '', status: args[1] || 'todo', position: 0,
			assigneeId: 'demo-me', assigneeName: state.profile.nickname || 'Вы'
		});
		ok(T('demoTaskAdded'));
	} else if (command === 'auraTeam.changeRole') {
		const [memberId, role] = args;
		const member = state.board?.members.find(m => m.id === memberId);
		if (member) { member.role = role; 		ok(T('demoRoleUpdated')); }
	} else if (command === 'auraTeam.selectTeam') {
		state.teamId = args[0] ?? state.teamId;
		ok(T('demoTeamSelected'));
	} else if (command === 'auraTeam.listArchives') {
		// Демо: архивы выводим из проектов с фиктивным archiveId.
		return (state.board?.projects ?? []).filter((p) => p.archiveId).map((p) => ({ id: p.archiveId, projectName: p.name, bytes: 8 * 1024 * 1024, createdAt: new Date().toISOString(), expiresAt: new Date(Date.now() + 7 * 864e5).toISOString() }));
	} else if (command === 'auraTeam.deleteArchive') {
		const project = (state.board?.projects ?? []).find((p) => p.archiveId === args[0]);
		if (project) { delete project.archiveId; }
		ok(T('deleted'));
	} else if (command === 'auraTeam.uploadArchive') {
		const name = args[0] || 'project';
		const projects = state.board?.projects ?? [];
		const project = projects.find((p) => String(p.name).toLowerCase() === String(name).toLowerCase())
			?? { id: 'dt' + Date.now(), teamId: state.teamId, name, gitUrl: '', defaultBranch: 'main' };
		project.archiveId = 'demo-archive-' + Date.now();
		if (!projects.includes(project)) { projects.push(project); }
		ok(T('archiveDone'));
	} else if (command === 'auraTeam.transferProject') {
		const [projectId, ownerId] = args;
		const project = state.board?.projects.find((proj) => proj.id === projectId);
		if (project) { project.ownerId = ownerId; }
		ok(T('transferred'));
	} else if (command === 'auraTeam.updateTask') {
		const [taskId, changes] = args;
		const task = state.board?.tasks.find((t) => t.id === taskId);
		if (task && changes) {
			if (changes.status) { task.status = changes.status; }
			if (typeof changes.position === 'number') { task.position = changes.position; }
			if (changes.title) { task.title = changes.title; }
			if (typeof changes.description === 'string') { task.description = changes.description; }
			if (changes.dueAt) { task.dueAt = changes.dueAt; } else if (changes.dueAt === null) { delete task.dueAt; }
			if (changes.assigneeId === null || changes.assigneeId === undefined) { task.assigneeId = undefined; task.assigneeName = undefined; }
			else { const m = state.board?.members.find((x) => x.id === changes.assigneeId); task.assigneeId = changes.assigneeId; task.assigneeName = m?.displayName || task.assigneeName; }
		}
		ok(T('taskMoved'));
	} else if (command === 'auraTeam.reorderTasks') {
		// Демо: применяем порядок локально, без тоста (перетаскивание не должно шуметь).
		const [toStatus, orderedIds] = args;
		(orderedIds ?? []).forEach((taskId, index) => {
			const t = state.board?.tasks.find((x) => x.id === taskId);
			if (t) { t.status = toStatus; t.position = index; }
		});
	} else if (command === 'auraTeam.downloadArchive') {
		ok(T('archiveSaved'));
	} else {
		return svc(command, args);
	}
	render();
}

const viewBody = () => document.getElementById('viewBody');
const badgeEl = () => document.getElementById('connBadge');
const avatarBtn = () => document.getElementById('avatarBtn');

function mount(html) {
	const keepInlineFocus = inlineFocusInForm();
	const body = viewBody();
	body.innerHTML = html;
	// перезапуск анимации входа
	const wrap = document.getElementById('view');
	wrap.style.animation = 'none';
	wrap.offsetHeight;
	wrap.style.animation = '';
	// Слушатели ripple вешаются только на свежие элементы (innerHTML каждый раз новые,
	// но помечаем data-ripple-bound на случай повторного прохода — защита от дублей).
	body.querySelectorAll('.btn:not([data-no-ripple])').forEach((b) => {
		if (b.dataset.ok || b.dataset.rippleBound) { return; }
		b.dataset.rippleBound = '1';
		b.addEventListener('pointerdown', ripple);
	});
	try { wire(); } catch (error) { console.error('[aura-team] wire:', error); }
	// Черновик быстрого ввода переживает перерисовку: серия задач не теряет фокус.
	if (inlineDraft) { applyInlineForm(keepInlineFocus); }
}

function render() {
	// До перерисовки снимаем геометрию: после mount карточки доезжают до новых
	// мест (переезд при dnd, broadcast сервера), а счётчики колонок прокручиваются.
	const beforeRects = captureTaskRects();
	const beforeCounts = captureColumnCounts();
	try {
		renderInner();
		playTaskMoves(beforeRects);
		playCountRolls(beforeCounts);
	} catch (error) {
		// Любая ошибка рендера не должна оставлять чёрный экран — показываем сообщение.
		console.error('[aura-team] render:', error);
		try { mount(`<div class="empty"><div><div class="big">Ошибка интерфейса</div><div class="sub">${esc(String(error?.message || error))}</div><button class="btn primary mt12" onclick="location.reload()">Перезагрузить</button></div></div>`); } catch { /* игнорируем */ }
	}
}
function renderInner() {
	if (!state) { return; }
	// Прямые переходы из сайдбара: board/git/files — полноценные разделы.
	if (route === 'login' || route === 'register') { route = 'teams'; }
	if (!['teams','keys','profile','board','git','files','admin'].includes(route)) { route = 'teams'; }
	// Раздел админки существует только с серверным признаком: подделанный клиент
	// всё равно получит 403 на запросы, прячем лишь лишний пункт навигации.
	if (route === 'admin' && !state.session?.admin) { route = 'profile'; }
	updateChrome();
	// Вход = серверная сессия (не локальный профиль).
	const needsAuth = !state.signedIn;
	if (needsAuth) { return mount(renderAuth()); }
	if (route === 'keys') { void Promise.all([ensureUsage(), ensureProviders()]).then(() => { if (route === 'keys') { const prev = viewBody()?.querySelector('#keysSearch')?.value ?? ''; const active = document.activeElement; const sel = active?.tagName === 'SELECT' ? active.id : ''; const scroll = viewBody()?.scrollTop ?? 0; const focusId = active?.dataset?.key ?? (active?.type === 'checkbox' && active?.closest?.('.key-card') ? (active.closest('.key-card')?.dataset?.keyId ?? '') : ''); mount(renderKeys()); wireKeys(prev, active, sel, scroll, focusId); } }); return mount(renderKeys()); }
	if (route === 'profile') { return mount(renderProfile()); }
	if (route === 'board') { return mount(renderBoardSection()); }
	if (route === 'git') { return mount(renderGitSection()); }
	if (route === 'files') { void ensureArchives().then(() => { if (route === 'files') { mount(renderFilesSection()); wireFiles(); } }); return mount(renderFilesSection()); }
	if (route === 'admin') { void ensureAdmin().then(() => { if (route === 'admin') { mount(renderAdmin()); wireAdmin(); } }); return mount(renderAdmin()); }
	return mount(renderTeams());
}

function updateChrome() {
	const viewEl = document.getElementById('view');
	if (viewEl) { viewEl.classList.toggle('view-board', route === 'board'); }
	// Уходим с доски — черновик быстрого ввода и панель деталей не тянутся за нами.
	if (route !== 'board') { inlineDraft = null; closeTaskDetails(); }
	const badge = badgeEl();
	if (!badge) { return; }
	badge.textContent = state.demoMode ? T('connDemo') : state.signedIn ? T('connLive') : T('connOff');
	badge.className = 'badge ' + (state.demoMode ? 'demo' : state.signedIn ? 'live' : 'off');
	document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = T(el.dataset.t); });
	document.querySelectorAll('[data-tt]').forEach((el) => { el.title = T(el.dataset.tt); });
	// Аватар и поповер (Профиль/Выйти) показываем только после входа:
	// на экране входа/регистрации в шапке не должно быть профиля.
	const btn = avatarBtn();
	const pop = document.getElementById('avatarMenu');
	const authHidden = !state.signedIn;
	if (btn) {
		btn.classList.toggle('hidden', authHidden);
		if (!authHidden) {
			const color = flattenColor(state.profile?.avatarColor);
			btn.style.background = `linear-gradient(135deg, ${color}, ${color}99)`;
			btn.textContent = initials(state.profile?.nickname, 'A');
			btn.style.animation = 'popIn .3s var(--ease)';
		}
	}
	if (pop && authHidden) { pop.classList.add('hidden'); }
	const popName = document.getElementById('popName');
	const popId = document.getElementById('popId');
	if (popName) { popName.textContent = state.profile?.nickname || '—'; }
	if (popId) { popId.textContent = state.profile?.id || '—'; }
	document.querySelectorAll('.rail-btn').forEach((b) => b.classList.toggle('active', b.dataset.view === route));
	// Админка в рейле — только у аккаунта с признаком админа из /v1/me.
	const navAdmin = document.getElementById('navAdmin');
	if (navAdmin) { navAdmin.classList.toggle('hidden', state.session?.admin !== true); }
	const navKeys = document.getElementById('navKeys');
	const keysCount = state.keys?.filter(k => !k.disabledAt).length ?? 0;
	if (navKeys && keysCount > 0) { navKeys.setAttribute('data-badge', String(keysCount)); } else if (navKeys) { navKeys.removeAttribute('data-badge'); }
}

function wireLoginForm() {
	// Кнопка-глаз: показать/скрыть пароль во всех полях с data-eye-for.
	document.querySelectorAll('.pass-eye[data-eye-for]').forEach((eye) => {
		const input = document.getElementById(eye.dataset.eyeFor);
		if (!input) { return; }
		eye.addEventListener('click', () => {
			const show = input.type === 'password';
			input.type = show ? 'text' : 'password';
			eye.classList.toggle('on', show);
			input.focus();
		});
	});
	const email = document.getElementById('loginEmail');
	const password = document.getElementById('loginPassword');
	const submit = document.getElementById('loginSubmit');
	const progress = document.getElementById('loginProgress');
	const switchTab = (tab) => { authTab = tab; render(); };
	document.querySelectorAll('[data-auth-tab]').forEach((t) => t.addEventListener('click', () => switchTab(t.dataset.authTab)));
	document.getElementById('goRegister')?.addEventListener('click', () => switchTab('register'));
	const go = async (event) => {
		if (!submit || !email || !password) { return; }
		ripple(event);
		const value = { email: email.value.trim(), password: password.value };
		if (!value.email || !value.password) { toast(T('loginFail'), 'err'); return; }
		submit.disabled = true;
		progress?.classList.remove('hidden');
		try {
			await svc('auraTeam.login', [value]);
			toast(T('regDone'), 'ok');
			render();
		} catch (err) { toast(err?.message || T('loginFail'), 'err'); }
		submit.disabled = false;
		progress?.classList.add('hidden');
	};
	submit?.addEventListener('click', go);
	password?.addEventListener('keydown', (event) => { if (event.key === 'Enter') { void go(event); } });
	const regSubmit = document.getElementById('regServerSubmit');
	const regName = document.getElementById('regServerName');
	const regEmail = document.getElementById('regServerEmail');
	const regPass = document.getElementById('regServerPassword');
	const regProgress = document.getElementById('regServerProgress');
	const goReg = async (event) => {
		if (!regSubmit || !regName || !regEmail || !regPass) { return; }
		ripple(event);
		const name = regName.value.trim();
		const mail = regEmail.value.trim();
		const pass = regPass.value;
		if (name.length < 2) { toast(T('regNameShort'), 'err'); return; }
		if (!/^\S+@\S+\.\S+$/.test(mail)) { toast(T('regBadEmail'), 'err'); return; }
		if (pass.length < 8) { toast(T('regPassShort'), 'err'); return; }
		regSubmit.disabled = true;
		regProgress?.classList.remove('hidden');
		try {
			await svc('auraTeam.register', [{ displayName: name, email: mail, password: pass }]);
			// Регистрация без письма: аккаунт активен сразу — входим автоматически.
			await svc('auraTeam.login', [{ email: mail, password: pass }]);
			toast(T('regServerDone'), 'ok');
			route = 'teams';
			render();
		} catch (err) { toast(err?.message || T('loginFail'), 'err'); }
		regSubmit.disabled = false;
		regProgress?.classList.add('hidden');
	};
	regSubmit?.addEventListener('click', goReg);
	regPass?.addEventListener('keydown', (event) => { if (event.key === 'Enter') { void goReg(event); } });
}
function wireAuth() {
	wireLoginForm();
	// Локальный демо-профиль убран: wireAuth = только серверные формы (login/register).
}

// Русская плюрализация: plural(2, ['задача','задачи','задач']) → «задачи».
function plural(n, forms) {
	const a = Math.abs(Number(n) || 0) % 100;
	const b = a % 10;
	if (a > 10 && a < 20) { return forms[2]; }
	if (b > 1 && b < 5) { return forms[1]; }
	if (b === 1) { return forms[0]; }
	return forms[2];
}

function highlightHtml(text, needle) {

	if (!needle) { return esc(raw); }
	const at = raw.toLowerCase().indexOf(needle);
	if (at < 0) { return esc(raw); }

// Дедлайн: сегодня/завтра, иначе «до 12 окт»; просроченный — с иконкой.
function dueText(iso) {
	const d = new Date(iso);
	if (isNaN(d.getTime())) { return ''; }
	const dayStart = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
	const diff = Math.round((dayStart(d) - dayStart(new Date())) / 864e5);
	if (diff === 0) { return T('dueTodayShort'); }
	if (diff === 1) { return T('dueTomorrowShort'); }
	if (diff === -1) { return T('dueYesterdayShort'); }
	const date = d.toLocaleDateString(lang === 'ru' ? 'ru-RU' : 'en-US', { day: 'numeric', month: 'short' });
	if (diff < 0) { return date; }
	return T('duePrefix') + ' ' + date;
}

// Подзадачи живут чекбоксами markdown внутри описания задачи: это уже существующее поле,
// так что модель и протокол менять не нужно, а прогресс и галочки сохраняются сервером.
const SUBTASK_RE = /^\s*[-*+]\s+\[( |x|X)\]\s*(.*)$/;
function parseSubtasks(description) {
	const items = [];

	String(description ?? '').split('\n').forEach((line) => {
		const m = line.match(SUBTASK_RE);
		if (m) { items.push({ done: m[1].toLowerCase() === 'x', text: m[2].trim() }); }
		else { prose.push(line); }
	});
	return { prose: prose.join('\n').trim(), items };
}
function composeDescription(prose, items) {
	const lines = [];
	const text = String(prose ?? '').trim();
	if (text) { lines.push(text); }
	items.forEach((it) => lines.push(`- [${it.done ? 'x' : ' '}] ${it.text}`));
	return lines.join('\n');
}

// Карточка задачи: имя — главное; описание только если оно есть и не повторяет имя.
function taskCardHtml(task, board, needle, highlightId) {

	const assignee = (board.members ?? []).find((m) => m.id === task.assigneeId);
	const { prose, items } = parseSubtasks(task.description);
	const showDesc = Boolean(prose) && prose !== String(task.title ?? '').trim();
	const doneCount = items.filter((it) => it.done).length;
	const progressChip = items.length ? `<span class="chip progress" title="${esc(T('subtasks'))}">${doneCount}/${items.length}</span>` : '';

	const checklist = items.length ? `<div class="task-checklist">${visibleItems.map((it, i) => `<label class="subtask${it.done ? ' done' : ''}"><input type="checkbox" data-subtask-toggle="${i}"${it.done ? ' checked' : ''}><span>${esc(it.text)}</span></label>`).join('')}${items.length > visibleItems.length ? `<span class="subtask-more">+${items.length - visibleItems.length}</span>` : ''}</div>` : '';

	const highlightId = boardFilter?.task ?? null;

				if (!a.dueAt) { return 1; }
				if (!b.dueAt) { return -1; }
				return new Date(a.dueAt) - new Date(b.dueAt);
			});
		const wip = Number(wipLimits[id]) || 0;
		const over = Boolean(wip) && tasks.length > wip;
		const name = colLabels[id] || label;
		const countHtml = tasks.length ? `<span class="col-count${over ? ' over' : ''}">${tasks.length}</span>` : '';
		const cards = tasks.map((t) => taskCardHtml(t, board, needle, highlightId)).join('');

			? `<button class="add-task-inline" data-add-task="${id}">${BOARD_ICONS.plus}${esc(T('addTaskShort'))}</button>`

// Карточка, перед которой вставится перетаскиваемая (по вертикальной позиции курсора).
function insertAfterPoint(col, clientY, excludeId) {
	const els = [...col.querySelectorAll('.task')].filter((el) => el.dataset.task !== excludeId);
	return els.reduce((closest, el) => {
		const box = el.getBoundingClientRect();
		const offset = clientY - box.top - box.height / 2;
		if (offset < 0 && offset > closest.offset) { return { offset, el }; }
		return closest;
	}, { offset: Number.NEGATIVE_INFINITY, el: null }).el;
}

// FLIP: соседи разъезжаются через transform, DOM меняется один раз.
function prefersReducedMotion() {
	try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch { return false; }
}
function flip(scope, mutate, duration = 240) {
	if (!scope) { mutate(); return; }
	if (prefersReducedMotion()) { mutate(); return; }
	const els = [...scope.querySelectorAll('.task')];
	const before = new Map(els.map((el) => [el, el.getBoundingClientRect()]));
	mutate();
	els.forEach((el) => {
		if (!el.isConnected) { return; }
		const prev = before.get(el);
		const next = el.getBoundingClientRect();
		const dx = prev.left - next.left;
		const dy = prev.top - next.top;
		if ((!dx && !dy) || typeof el.animate !== 'function') { return; }
		el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration, easing: 'cubic-bezier(.2, 0, 0, 1)' });
	});
}

/* ---------- Клавиатурный drag & drop ---------- */

function applyInlineForm(focus) {

/* Оптимистичная карточка: до ответа сервера живёт в состоянии с флагом pending,

		position: Number.MAX_SAFE_INTEGER, createdAt: new Date().toISOString(), pending: true

		if (now - new Date(t.createdAt).getTime() > 15000) { return false; }

	const card = [...document.querySelectorAll('.task')].find((el) => el.dataset.task === id);
	if (card) { card.classList.add('removing'); setTimeout(hide, 160); } else { hide(); }
	deleteTasks([id]).catch((err) => { toast(err.message, 'err'); show(); });
	undoToast(5, () => { show(); restoreTasks([id]).catch((err) => { toast(err.message, 'err'); hide(); }); });
}
/* ---------- Подзадачи: галочка на карточке и в панели деталей ---------- */
// Описание хранит прозу и чекбоксы вместе; при любом изменении пересобираем его целиком.
function saveSubtasks(task, prose, items, focusAdd) {
	task.description = composeDescription(prose, items);
	demo('auraTeam.updateTask', [task.id, { description: task.description }], false).catch((err) => toast(err.message, 'err'));
	applyBoard();
	refreshSubtasksBlock(task, focusAdd);
}
function toggleSubtask(task, index) {
	const { prose, items } = parseSubtasks(task.description);
	if (!items[index]) { return; }
	items[index].done = !items[index].done;
	saveSubtasks(task, prose, items, false);
}
function addSubtask(task, text) {
	const { prose, items } = parseSubtasks(task.description);
	items.push({ done: false, text });
	saveSubtasks(task, prose, items, true);
}
function removeSubtask(task, index) {
	const { prose, items } = parseSubtasks(task.description);
	if (!items[index]) { return; }
	items.splice(index, 1);
	saveSubtasks(task, prose, items, false);
}
function subtasksBlockHtml(task) {
	const { items } = parseSubtasks(task.description);
	const done = items.filter((it) => it.done).length;
	return `<label>${esc(T('subtasks'))}${items.length ? ` <span class="subtask-count">${done}/${items.length}</span>` : ''}</label>
		<div class="subtask-list">
			${items.map((it, i) => `<div class="subtask-row${it.done ? ' done' : ''}">
				<input type="checkbox" data-sub-toggle="${i}"${it.done ? ' checked' : ''} aria-label="${esc(it.text)}">
				<span class="subtask-text">${esc(it.text)}</span>
				<button class="icon-btn" data-sub-remove="${i}" aria-label="${esc(T('subtaskRemove'))}" title="${esc(T('subtaskRemove'))}">${BOARD_ICONS.close}</button>
			</div>`).join('')}
		</div>
		<input class="subtask-add" data-sub-add placeholder="${esc(T('subtaskPh'))}" aria-label="${esc(T('subtaskAdd'))}">`;
}
function wireSubtasksBlock(task) {
	const block = document.getElementById('subtaskBlock');
	if (!block) { return; }
	block.querySelectorAll('[data-sub-toggle]').forEach((cb) => cb.addEventListener('change', () => toggleSubtask(task, Number(cb.dataset.subToggle))));
	block.querySelectorAll('[data-sub-remove]').forEach((btn) => btn.addEventListener('click', () => removeSubtask(task, Number(btn.dataset.subRemove))));
	block.querySelector('[data-sub-add]')?.addEventListener('keydown', (e) => {
		if (e.key !== 'Enter') { return; }
		e.preventDefault();
		const text = e.currentTarget.value.trim();
		if (text) { addSubtask(task, text); }
	});
}
function refreshSubtasksBlock(task, focusAdd) {
	const block = document.getElementById('subtaskBlock');
	if (!block) { return; }
	block.innerHTML = subtasksBlockHtml(task);
	wireSubtasksBlock(task);
	if (focusAdd) { block.querySelector('[data-sub-add]')?.focus(); }
}

function timeAgoStr(iso) {
	if (!iso) { return ''; }
	const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
	if (s < 60) { return T('timeNow'); }
	if (s < 3600) { return Math.floor(s / 60) + ' мин'; }
	if (s < 86400) { return Math.floor(s / 3600) + ' ч'; }
	return Math.floor(s / 86400) + ' д';
}
// datetime-local требует локальное время: new Date(...).toISOString() сдвигал
// сохранённый дедлайн на часовой пояс и значение в поле «прыгало».
function taskDueLocalValue(iso) {
	const d = new Date(iso);
	if (isNaN(d.getTime())) { return ''; }
	const pad = (n) => String(n).padStart(2, '0');
	return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
// Один источник правды для пресетов дедлайна (поповер карточки и панель деталей).
function duePresetValue(kind) {
	if (kind === 'clear') { return null; }
	const today = new Date().setHours(18, 0, 0, 0);
	if (kind === 'today') { return new Date(today).toISOString(); }
	if (kind === 'tomorrow') { return new Date(today + 864e5).toISOString(); }
	return new Date(today + 7 * 864e5).toISOString();
}

function wireKeys() {

	/* Перенос ключей из встроенного плагина Aura API: список, группа назначения и причина отказа. */
	async function openImportApiModal() {
		if (state.demoMode) { toast(T('demo')); return; }
		let importState = { available: false, pluginInstalled: false, keys: [], imported: {} };
		try { importState = (await svc('auraTeam.auraApiImportState', [])) || importState; } catch { /* остаёмся на пустом состоянии */ }
		const local = Array.isArray(importState.keys) ? importState.keys : [];
		if (!local.length) {

			return `<label class="check-row${already ? ' done' : ''}"><input type="checkbox" data-imp="${esc(k.id)}" ${already ? 'disabled' : 'checked'}> <span>${esc(label)}</span><small>${esc(meta)}</small></label>`;
		}).join('');
		openModal({

		// Клавиатура: Enter — редактировать, Delete — удалить (с подтверждением)
		card.addEventListener('keydown', (e) => {
			if (e.target.matches('input, select, textarea')) { return; }
			if (e.key === 'Enter') {
				e.stopPropagation();
				card.querySelector('[data-action="edit"]')?.click();
			} else if (e.key === 'Delete') {
				e.stopPropagation();
				card.querySelector('[data-action="delete"]')?.click();
			}
		});

		// Редактирование
		card.querySelector('[data-action="edit"]')?.addEventListener('click', () => {
			if (state.demoMode) { toast(T('demo')); return; }
			const groups = state.keyGroups ?? [];
			openModal({
				title: T('editKey'), sub: key.label, actionText: T('save'),
				body: `
					<div class="field"><label>${esc(T('keyName'))}</label><input data-key-edit-label value="${esc(key.label)}" maxlength="60"></div>
					<div class="field-grid">
						<div class="field"><label>${esc(T('keyRole'))}</label><select data-key-edit-role>${['dev', 'maintainer', 'viewer'].map((r) => `<option value="${r}" ${r === key.accessRole ? 'selected' : ''}>${esc(T('role' + cap(r)))}</option>`).join('')}</select></div>
						<div class="field"><label>${esc(T('keyPriority'))}</label><select data-key-edit-prio>${[['high', 'prioHigh'], ['medium', 'prioMedium'], ['low', 'prioLow']].map(([v, k]) => `<option value="${v}" ${priorityMeta(key.priority).id === v ? 'selected' : ''}>${esc(T(k))}</option>`).join('')}</select></div>

		});

		// Использовать в чате
		card.querySelector('[data-action="use"]')?.addEventListener('click', async () => {
			if (state.demoMode) { toast(T('demo')); return; }
			const btn = card.querySelector('[data-action="use"]');
			btn.disabled = true;
			try {
				await svc('auraTeam.connectAuraApi', []);
			} catch (err) { toast(err?.message || 'error', 'err'); }

		card.querySelector('[data-action="delete"]')?.addEventListener('click', () => {
			if (state.demoMode) { toast(T('demo')); return; }

				const k = (state.keys ?? []).find(x => x.id === keyId);

				catch (err) { toast(err?.message || 'error', 'err'); }
			});
		}
	});

	// Добавление ключа
	document.getElementById('btnAddKey')?.addEventListener('click', openAddKeyModal);
	document.getElementById('btnAddKeyEmpty')?.addEventListener('click', openAddKeyModal);

	// Закрытие меню по Escape
	document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { hideMoreMenu(); } });
}
