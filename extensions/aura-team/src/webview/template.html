<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-__NONCE__'; img-src data:; font-src data:;">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team</title>
<style>
/* ============================================================
   Aura Team — design system
   Всё на токенах темы VS Code: светлая и тёмная тема из коробки.
   ============================================================ */
:root {
	--bg: var(--vscode-editor-background);
	--surface: var(--vscode-editorWidget-background);
	--card: color-mix(in srgb, var(--vscode-editorWidget-background) 55%, transparent);
	--card-hover: color-mix(in srgb, var(--vscode-editorWidget-background) 85%, var(--vscode-foreground) 4%);
	--border: var(--vscode-widget-border, color-mix(in srgb, var(--vscode-foreground) 18%, transparent));
	--border-soft: color-mix(in srgb, var(--vscode-foreground) 10%, transparent);
	--text: var(--vscode-foreground);
	--muted: var(--vscode-descriptionForeground);
	--accent: var(--vscode-button-background);
	--accent-hover: var(--vscode-button-hoverBackground);
	--accent-fg: var(--vscode-button-foreground);
	--input-bg: var(--vscode-input-background);
	--input-border: var(--vscode-input-border, transparent);
	--focus: var(--vscode-focusBorder);
	--danger: var(--vscode-errorForeground);
	--ok: var(--vscode-testing-iconPassedForeground, #2ea043);
	--off: var(--vscode-testing-iconFailedForeground, #f85149);
	--warn: var(--vscode-editorWarning-foreground, #d29922);
	--link: var(--vscode-textLink-foreground);
	--shadow: 0 8px 28px color-mix(in srgb, var(--vscode-widget-shadow, #000) 45%, transparent);
	--radius: 12px;
	--radius-sm: 8px;
	--ease: cubic-bezier(.22, .8, .28, 1);
	--font: var(--vscode-font-family);
	--mono: var(--vscode-editor-font-family, ui-monospace, monospace);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
	font-family: var(--font);
	font-size: 13px;
	color: var(--text);
	background: var(--bg);
	overflow: hidden;
	-webkit-font-smoothing: antialiased;
}
button { font-family: inherit; font-size: 13px; color: inherit; background: none; border: none; cursor: pointer; }
input, textarea, select {
	font-family: inherit; font-size: 13px; color: var(--text);
	background: var(--input-bg);
	border: 1px solid var(--input-border);
	border-radius: var(--radius-sm);
	padding: 8px 10px;
	outline: none;
	transition: border-color .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease);
}
input:focus, textarea:focus, select:focus { border-color: var(--focus); box-shadow: 0 0 0 2px color-mix(in srgb, var(--focus) 35%, transparent); }
::placeholder { color: var(--muted); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--vscode-scrollbarSlider-background, #5a5d5e) 80%, transparent); border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background-color: var(--vscode-scrollbarSlider-hoverBackground); }

/* ---------- Анимации ---------- */
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px) scale(.995); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { from { opacity: 0; transform: scale(.96) translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
@keyframes slideRight { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 45%, transparent); } 50% { box-shadow: 0 0 0 5px transparent; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@keyframes toastIn { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes modalIn { from { opacity: 0; transform: scale(.94) translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes barGrow { from { width: 0; } to { width: 100%; } }
@keyframes dotPing { 0% { transform: scale(1); opacity: .9; } 80%, 100% { transform: scale(2.4); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
	* { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ---------- Каркас ---------- */
#app { display: grid; grid-template-rows: 52px 1fr; grid-template-columns: 64px 1fr; height: 100%; }

/* ---------- Верхняя панель ---------- */
.topbar {
	grid-column: 1 / -1;
	display: flex; align-items: center; justify-content: space-between;
	padding: 0 12px 0 4px;
	border-bottom: 1px solid var(--border-soft);
	background: var(--surface);
	position: relative; z-index: 30;
	animation: slideDown .3s var(--ease);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-logo {
	width: 30px; height: 30px; border-radius: 9px; flex: none;
	display: grid; place-items: center;
	background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 35%, var(--bg)));
	box-shadow: 0 3px 10px color-mix(in srgb, var(--accent) 40%, transparent);
}
.brand-logo svg { width: 17px; height: 17px; }
.brand-name { font-weight: 600; font-size: 13px; letter-spacing: .2px; display: flex; align-items: center; gap: 8px; }
.badge {
	font-size: 10px; font-weight: 600; letter-spacing: .4px;
	padding: 2px 8px; border-radius: 999px; text-transform: uppercase;
	transition: background .2s var(--ease), color .2s var(--ease);
}
.badge.demo { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.badge.live { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.badge.off { background: color-mix(in srgb, var(--off) 14%, transparent); color: var(--off); }
.top-right { display: flex; align-items: center; gap: 6px; position: relative; }

/* Аватар профиля — правый верхний угол */
.avatar {
	width: 32px; height: 32px; border-radius: 50%;
	display: grid; place-items: center;
	font-weight: 700; font-size: 12px; color: #fff;
	transition: transform .2s var(--ease), box-shadow .2s var(--ease);
	animation: fadeIn .4s ease;
}
.avatar:hover { transform: scale(1.08); }
.avatar::after {
	content: ''; position: absolute; right: -1px; bottom: -1px;
	width: 9px; height: 9px; border-radius: 50%;
	background: var(--ok); border: 2px solid var(--surface);
}
.avatar.github::after { background: var(--ok); }
.popover {
	position: absolute; top: 42px; right: 0; min-width: 190px; z-index: 60;
	background: var(--surface);
	border: 1px solid var(--border);
	border-radius: var(--radius);
	box-shadow: var(--shadow);
	padding: 6px;
	animation: popIn .18s var(--ease);
}
.popover::before {
	content: ''; position: absolute; top: -6px; right: 14px;
	width: 10px; height: 10px; background: var(--surface);
	border-left: 1px solid var(--border); border-top: 1px solid var(--border);
	transform: rotate(45deg);
}
.popover-item {
	display: flex; align-items: center; gap: 9px; width: 100%;
	padding: 8px 10px; border-radius: var(--radius-sm);
	transition: background .15s var(--ease);
}
.popover-item:hover { background: var(--card-hover); }
.popover-item .ico { width: 15px; height: 15px; flex: none; }
.popover-item.danger { color: var(--danger); }
.popover-head { padding: 6px 10px 8px; border-bottom: 1px solid var(--border-soft); margin-bottom: 6px; }
.popover-head .name { font-weight: 600; font-size: 12.5px; }
.popover-head .id { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }

/* ---------- Левый рейл ---------- */
.rail {
	grid-row: 2; grid-column: 1;
	display: flex; flex-direction: column; align-items: center; gap: 6px;
	padding: 10px 8px;
	border-right: 1px solid var(--border-soft);
	background: var(--surface);
}
.rail-btn {
	width: 48px; height: 44px; border-radius: 10px;
	display: grid; place-items: center;
	position: relative;
	color: var(--muted);
	transition: background .18s var(--ease), color .18s var(--ease), transform .18s var(--ease);
}
.rail-btn svg { width: 19px; height: 19px; }
.rail-btn:hover { background: var(--card-hover); color: var(--text); transform: translateY(-1px); }
.rail-btn.active { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent); }
.rail-btn.active::after {
	content: ''; position: absolute; left: -8px; top: 50%; transform: translateY(-50%);
	width: 3px; height: 22px; border-radius: 3px; background: var(--accent);
	animation: fadeIn .2s ease;
}
.rail-btn[data-badge]::before {
	content: attr(data-badge); position: absolute; top: 4px; right: 4px;
	min-width: 14px; height: 14px; padding: 0 3px;
	display: grid; place-items: center;
	font-size: 9px; font-weight: 700; color: var(--accent-fg);
	background: var(--accent); border-radius: 999px;
	animation: popIn .25s var(--ease);
}

/* ---------- Контент ---------- */
.view-wrap {
	grid-row: 2; grid-column: 2;
	overflow-y: auto; overflow-x: hidden;
	padding: 18px 22px 30px;
	animation: fadeUp .28s var(--ease);
}
.view-head { margin-bottom: 16px; animation: fadeUp .3s var(--ease); }
.view-title { font-size: 18px; font-weight: 700; letter-spacing: -.2px; display: flex; align-items: center; gap: 10px; }
.view-sub { color: var(--muted); font-size: 12px; margin-top: 4px; }

/* ---------- Карточки ---------- */
.card {
	background: var(--card);
	border: 1px solid var(--border-soft);
	border-radius: var(--radius);
	padding: 16px;
	transition: transform .22s var(--ease), border-color .22s var(--ease), box-shadow .22s var(--ease), background .22s var(--ease);
	animation: fadeUp .35s var(--ease) both;
	animation-delay: calc(var(--i, 0) * 45ms);
}
.card.profile-card { max-width: 620px; }
.card.clickable { cursor: pointer; }
.card.clickable:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); box-shadow: var(--shadow); }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.card h3 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.card .sub { color: var(--muted); font-size: 11.5px; }
.card .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

/* ---------- Чипы / бейджи ---------- */
.chip {
	display: inline-flex; align-items: center; gap: 5px;
	font-size: 10.5px; font-weight: 600; letter-spacing: .3px;
	padding: 3px 9px; border-radius: 999px;
	background: color-mix(in srgb, var(--muted) 14%, transparent);
	color: var(--muted);
}
.chip.accent { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
.chip.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.chip.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.chip.off { background: color-mix(in srgb, var(--off) 14%, transparent); color: var(--off); }

/* ---------- Кнопки ---------- */
.btn {
	display: inline-flex; align-items: center; justify-content: center; gap: 7px;
	padding: 8px 14px; border-radius: var(--radius-sm);
	font-weight: 600; font-size: 12.5px;
	transition: transform .18s var(--ease), background .18s var(--ease), box-shadow .18s var(--ease), opacity .18s;
	position: relative; overflow: hidden;
}
.btn svg { width: 14px; height: 14px; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.btn.primary { background: var(--accent); color: var(--accent-fg); box-shadow: 0 3px 12px color-mix(in srgb, var(--accent) 35%, transparent); }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn.ghost { background: var(--card-hover); }
.btn.ghost:hover:not(:disabled) { background: color-mix(in srgb, var(--card-hover) 80%, var(--accent) 10%); }
.btn.danger { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
.btn.danger:hover:not(:disabled) { background: color-mix(in srgb, var(--danger) 26%, transparent); }
/* Доступность: текст на danger-фоне должен читаться даже если errorForeground тёмный. */
.btn.danger, .btn.logout-danger { color: color-mix(in srgb, var(--danger) 60%, var(--text)); }
.btn.sm { padding: 5px 10px; font-size: 11.5px; border-radius: 7px; }
.btn.lg { padding: 11px 18px; font-size: 13.5px; border-radius: 10px; }
.btn .spin { width: 14px; height: 14px; border: 2px solid color-mix(in srgb, currentColor 35%, transparent); border-top-color: currentColor; border-radius: 50%; animation: spin .7s linear infinite; }

/* Рябь на кнопках */
.ripple { position: absolute; border-radius: 50%; background: color-mix(in srgb, currentColor 14%, transparent); transform: scale(0); animation: rippleAnim .5s var(--ease); pointer-events: none; }
@keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

/* ---------- Формы ---------- */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .3px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; }
.field input, .field textarea, .field select { width: 100%; }
.field .err { color: var(--danger); font-size: 11px; margin-top: 5px; display: flex; align-items: center; gap: 5px; animation: fadeUp .2s var(--ease); }
.field .hint { color: var(--muted); font-size: 11px; margin-top: 5px; }
.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
/* Поле пароля с кнопкой-глазом (показать/скрыть) */
.pass-wrap { position: relative; }
.pass-wrap input { padding-right: 40px; }
.pass-eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; display: grid; place-items: center; border-radius: 7px; color: var(--muted); opacity: .75; transition: opacity .15s ease, background .15s ease; }
.pass-eye:hover { opacity: 1; background: var(--card-hover); }
.pass-eye svg { width: 17px; height: 17px; }
.pass-eye.on { color: var(--accent); opacity: 1; }

/* ---------- Пустая / подсказочная панель ---------- */
.empty {
	display: grid; place-items: center; text-align: center;
	padding: 40px 20px; color: var(--muted);
	border: 1.5px dashed var(--border); border-radius: var(--radius);
	animation: fadeUp .3s var(--ease);
}
.empty svg { width: 34px; height: 34px; margin-bottom: 12px; opacity: .7; }
.empty .big { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 6px; }

/* ---------- Участники ---------- */
.member { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius-sm); transition: background .18s var(--ease); animation: fadeUp .3s var(--ease) both; animation-delay: calc(var(--i, 0) * 40ms); }
.member:hover { background: var(--card-hover); }
.avatar-mini {
	width: 30px; height: 30px; border-radius: 50%; flex: none;
	display: grid; place-items: center;
	font-weight: 700; font-size: 11px; color: #fff;
	position: relative;
}
.presence { position: absolute; right: -1px; bottom: -1px; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); border: 1.5px solid var(--surface); }
.presence.off { background: var(--muted); }
.presence.live { animation: dotPing 1.6s ease-out infinite; }
.member .meta { flex: 1; min-width: 0; }
.member .mname { font-weight: 600; font-size: 12.5px; }
.member .memail { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.member select { padding: 4px 6px; font-size: 11px; border-radius: 6px; }

/* ---------- Вкладки внутри команды ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border-soft); margin-bottom: 16px; }
.tab {
	padding: 8px 14px; font-weight: 600; font-size: 12.5px; color: var(--muted);
	border-bottom: 2px solid transparent; margin-bottom: -1px;
	transition: color .18s var(--ease), border-color .18s var(--ease);
	position: relative;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-color: var(--accent); }
.tab.active::after { content: ''; position: absolute; bottom: -2px; left: 0; right: 0; height: 2px; background: var(--accent); border-radius: 2px; animation: barGrow .3s var(--ease); }

/* ---------- Быстрые ярлыки разделов (как в сайдбаре) ---------- */
.quick-nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 4px; }
.quick-nav .btn svg { width: 15px; height: 15px; flex: none; }
.quick-nav .btn.active { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent); }

/* ---------- Git ---------- */
.git-card { margin-bottom: 14px; }
.git-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.repo-path { font-family: var(--mono); font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 340px; }
.branch-select { padding: 5px 9px; font-size: 12px; border-radius: 7px; width: auto; min-width: 150px; }
.commit-line { display: flex; gap: 8px; margin-top: 14px; }
.commit-line input { flex: 1; }
.changes-list { margin-top: 12px; border-top: 1px solid var(--border-soft); padding-top: 10px; }
.change-item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; font-family: var(--mono); font-size: 11px; animation: slideRight .25s var(--ease) both; animation-delay: calc(var(--i, 0) * 25ms); }
.change-item:hover { background: var(--card-hover); }
.change-item .kind { flex: none; font-size: 9.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; letter-spacing: .5px; }
.change-item .kind.index { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
.change-item .kind.working { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.change-item .change-path { cursor: pointer; text-decoration: underline dotted transparent; text-underline-offset: 3px; }
.change-item .change-path:hover { color: var(--accent); text-decoration-color: var(--accent); }
.change-item input[type=checkbox] { accent-color: var(--accent); }
.change-item .kind.untracked { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.history-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-radius: 8px; transition: background .18s var(--ease); animation: fadeUp .3s var(--ease) both; animation-delay: calc(var(--i, 0) * 30ms); }
.history-item:hover { background: var(--card-hover); }
.hist-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 5px; flex: none; box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 60%, transparent); }
.hist-msg { font-size: 12.5px; font-weight: 500; }
.hist-meta { font-size: 10.5px; color: var(--muted); font-family: var(--mono); margin-top: 2px; }

/* ---------- Доска задач ---------- */
.board-cols { display: grid; grid-template-columns: repeat(5, minmax(150px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.col { background: color-mix(in srgb, var(--surface) 45%, transparent); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 10px; min-height: 160px; animation: fadeUp .35s var(--ease) both; animation-delay: calc(var(--i, 0) * 50ms); }
.col-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.col-title { font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); }
.col-count { font-size: 10.5px; font-weight: 700; background: var(--card-hover); padding: 1px 7px; border-radius: 999px; }
.task-card {
	background: var(--card); border: 1px solid var(--border-soft);
	border-radius: 9px; padding: 10px; margin-bottom: 8px;
	transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s;
	animation: fadeUp .3s var(--ease) both;
	animation-delay: calc(var(--i, 0) * 35ms);
}
.task-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
.task-card.highlight { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); animation: highlightPulse 1.2s ease 2; cursor: pointer; }
@keyframes highlightPulse { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 30%, transparent); } }
.board-filter { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding: 7px 12px; border-radius: 9px; background: color-mix(in srgb, var(--accent) 12%, var(--card)); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border)); font-size: 12px; animation: fadeUp .25s var(--ease) both; }
.board-filter button { padding: 3px 10px; font-size: 11px; }
.task-title { font-size: 12.5px; font-weight: 600; line-height: 1.35; }
.task-desc { color: var(--muted); font-size: 11px; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.task-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
.task-assignee { font-size: 10px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.add-task { width: 100%; margin-top: 2px; padding: 7px 10px; font-size: 11.5px; border-style: dashed; opacity: .85; transition: opacity .18s, background .18s; }
.add-task:hover { opacity: 1; background: var(--card-hover); }

/* ---------- Ключи ---------- */
.key-card { animation: fadeUp .35s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
.key-row { display: flex; align-items: center; gap: 12px; }
.provider-ico {
	width: 36px; height: 36px; border-radius: 10px; flex: none;

// Язык — из state.uiLanguage (настройка team.ui.language, по умолчанию русский).
let lang = 'ru';
const T = (key) => DICT[lang]?.[key] ?? DICT.en?.[key] ?? key;

/* ---------- Утилиты ---------- */
let state = null;
let route = ['teams','keys','profile','board','git','files','login','register'].includes('__INITIAL_VIEW__') ? '__INITIAL_VIEW__' : 'teams';
let teamTab = 'members';
// Экран входа: если открыли с кнопки «Создать аккаунт» — сразу форма регистрации.
let authTab = '__INITIAL_VIEW__' === 'register' ? 'register' : 'login';
const pending = new Map();
let reqId = 1;

function svc(command, args = []) {
	return new Promise((resolve, reject) => {
		const id = reqId++;
		pending.set(id, { resolve, reject });
		vscode.postMessage({ type: 'invoke', command, args, id });
		setTimeout(() => { if (pending.has(id)) { pending.delete(id); reject(new Error('timeout')); } }, 20000);
	});
}

window.addEventListener('message', (event) => {
	const message = event.data;
	if (!message) { return; }
	if (message.type === 'response') {
		const p = pending.get(message.id);
		if (!p) { return; }
		pending.delete(message.id);
		message.ok ? p.resolve(message.result) : p.reject(new Error(message.error || 'error'));
	} else		if (message.type === 'board-filter') {
			boardFilter = message.filter ?? null;
			route = 'board';
			if (state) { render(); }
	} else if (message.type === 'navigate') {
		// Переиспользование вкладки: переход к разделу без создания новой копии.
		const view = ['teams','keys','profile','login','register','board','git','files'].includes(message.view) ? message.view : 'teams';
		route = view;
		if (view === 'register') { authTab = 'register'; } else if (view === 'login') { authTab = 'login'; }
		if (message.filter) {
			boardFilter = message.filter;
			route = 'board';
		}
		if (state) { render(); }
	} else if (message.type === 'state') {
		state = message.state;
		// Язык: настройка team.ui.language ('ru' | 'en' | 'auto'); auto — язык IDE.
		if (typeof message.state?.uiLanguage === 'string') {
			const raw = message.state.uiLanguage;
			const ideRu = typeof message.state.ideLanguage === 'string' && message.state.ideLanguage.toLowerCase().startsWith('ru');
			const next = raw === 'auto' ? (ideRu ? 'ru' : 'en') : (raw === 'en' ? 'en' : 'ru');
			const langChanged = next !== lang;
			lang = next;
			if (langChanged) { render(); return; }
		}
		if (!route || ['teams','keys','profile','board','git','files','login','register'].includes(route)) { render(); }
	// route валиден всегда — верхнеуровневые разделы board/git/files рендерятся напрямую.
	}
});

// Список архивов для раздела «Файлы» подгружается при входе в раздел (не в общем state).
async function ensureArchives() {
	if (!state?.teamId || state.archivesLoaded) { return; }
	try { state.archives = await demo('auraTeam.listArchives', []); state.archivesLoaded = true; } catch { state.archives = []; }
}

function esc(value) {
	return String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function initials(name, fallback = '?') {
	const parts = (name || '').trim().split(/\s+/).filter(Boolean);
	const first = parts[0]?.[0] ?? '';
	const second = parts.length > 1 ? parts[1][0] : (parts[0]?.[1] ?? '');
	return (first + second).toUpperCase() || fallback;
}
function flattenColor(color) { return color || '#6366f1'; }
function avatarColor(id) { return flattenColor(id); }
function timeAgo(iso) {
	if (!iso) { return ''; }
	const diff = Date.now() - new Date(iso).getTime();
	if (diff < 60000) { return T('justNow'); }
	if (diff < 3600000) { return Math.round(diff/60000) + 'm'; }
	if (diff < 86400000) { return Math.round(diff/3600000) + 'h'; }
	return new Date(iso).toLocaleDateString();
}
function copyText(text) {
	void navigator.clipboard.writeText(text).then(() => toast(T('copied'), 'ok')).catch(() => toast(text, 'ok'));
}
function ripple(event) {
	const btn = event.currentTarget;
	const rect = btn.getBoundingClientRect();
	const size = Math.max(rect.width, rect.height);
	const span = document.createElement('span');
	span.className = 'ripple';
	span.style.width = span.style.height = size + 'px';
	span.style.left = (event.clientX - rect.left - size / 2) + 'px';
	span.style.top = (event.clientY - rect.top - size / 2) + 'px';
	btn.appendChild(span);
	setTimeout(() => span.remove(), 500);
}

/* ---------- Тосты ---------- */
function toast(text, type = '') {
	const root = document.getElementById('toastRoot');
	const el = document.createElement('div');
	el.className = 'toast ' + type;
	el.innerHTML = `<svg class="toast-ico" viewBox="0 0 24 24" fill="none">${type === 'ok' ? '<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M8.5 12.2l2.4 2.4 4.6-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>' : type === 'err' ? '<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M9 9l6 6M15 9l-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>' : '<path d="M12 2l7.5 4.5v9L12 20l-7.5-4.5v-9L12 2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>'}</svg><span>${esc(text)}</span>`;
	root.appendChild(el);
	setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 260); }, 2600);
}

/* ---------- Модалки ---------- */
function openModal({ title, sub, body, actionText = T('create'), onAction, danger = false }) {
	const root = document.getElementById('modalRoot');
	// Закрываем предыдущие модалки: оставшиеся открытыми копии накапливали слушатели и DOM.
	root.querySelectorAll('.overlay').forEach((old) => old.remove());
	const overlay = document.createElement('div');
	overlay.className = 'overlay';
	overlay.innerHTML = `<div class="modal">
		<button class="modal-close" data-close="1"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
		<h2>${esc(title)}</h2>
		${sub ? `<div class="sub">${esc(sub)}</div>` : ''}
		<div class="modal-body">${body}</div>
		<div class="modal-actions">
			<button class="btn ghost" data-cancel="1">${esc(T('cancel'))}</button>
			<button class="btn ${danger ? 'danger' : 'primary'}" data-ok="1">${esc(actionText)}</button>
		</div>
	</div>`;
	root.appendChild(overlay);
	const close = () => { overlay.remove(); };
	overlay.addEventListener('click', (e) => { if (e.target === overlay || e.target.closest('[data-close]') || e.target.closest('[data-cancel]')) { close(); } });
	overlay.querySelector('[data-ok]').addEventListener('click', (e) => { ripple(e); onAction(overlay).then?.((keepOpen) => { if (!keepOpen) { close(); } }); });
	overlay.querySelector('[data-ok]').addEventListener('pointerdown', ripple);
	overlay.addEventListener('keydown', (e) => { if (e.key === 'Escape') { close(); } });
	overlay.querySelector('.modal').focus?.();
	return overlay;
}

/* ---------- Меню «Пригласить»: пользователи + поиск, либо инвайт-код ---------- */
let inviteCache = { code: null };
async function openInviteMenu() {
	if (!state.teamId) { return; }
	// Текущий код берём один раз: клик по кнопке больше не создаёт новый код.
	try { inviteCache = await demo('auraTeam.currentInvite', []) || inviteCache; } catch { /* нет прав */ }
	openModal({
		title: T('inviteTitle'), sub: T('inviteMenuSub'), actionText: T('inviteGenNew'),
		body: `
			<div class="field"><label>${esc(T('inviteSearchLabel'))}</label><input data-invite-search placeholder="${esc(T('inviteSearchPlaceholder'))}" spellcheck="false"></div>
			<div class="invite-list" data-invite-list></div>
			<div class="divider"></div>
			<div class="invite-code-row">
				${inviteCache.code
					? `<div class="invite-code sm">${esc(inviteCache.code)}</div><div class="row gap8">
						<button class="btn ghost sm" data-copy-invite="${esc(inviteCache.code)}">${esc(T('copy'))}</button>
						<button class="btn ghost sm danger-text" data-revoke-invite>${esc(T('inviteRegen'))}</button></div>
						<div class="hint">${esc(T('inviteRegenHint'))}</div>`
					: `<div class="hint">${esc(T('inviteNoCode'))}</div><button class="btn ghost sm" data-gen-invite>${esc(T('inviteGenNew'))}</button>`}
			</div>`,
		onAction: async (overlay) => {
			// Главная кнопка модалки = «Создать/пересоздать код».
			const res = await demo('auraTeam.createInvite', []);
			if (res?.code) { inviteCache = res; copyText(res.code); toast(T('copied'), 'ok'); }
			renderInviteList(overlay, '');
			return true;
		}
	});
	const overlay = document.getElementById('modalRoot').querySelector('.overlay');
	const search = overlay.querySelector('[data-invite-search]');
	search?.addEventListener('input', () => renderInviteList(overlay, search.value.trim()));
	renderInviteList(overlay, '');
	const genBtn = overlay.querySelector('[data-gen-invite]');
	genBtn?.addEventListener('click', async () => {
		const res = await demo('auraTeam.createInvite', []);
		if (res?.code) { inviteCache = res; copyText(res.code); toast(T('copied'), 'ok'); }
		closeAndReopen();
	});
	wireInviteActions(overlay);
}
function wireInviteActions(overlay) {
	overlay.querySelectorAll('[data-copy-invite]').forEach((btn) => btn.addEventListener('click', (e) => copyText(e.currentTarget.dataset.copyInvite)));
	const revoke = overlay.querySelector('[data-revoke-invite]');
	revoke?.addEventListener('click', async () => {
		await demo('auraTeam.revokeInvite', []);
		inviteCache = { code: null };
		closeAndReopen();
	});
}
async function closeAndReopen() { document.getElementById('modalRoot').querySelectorAll('.overlay').forEach((o) => o.remove()); await openInviteMenu(); }
async function renderInviteList(overlay, q) {
	const list = overlay.querySelector('[data-invite-list]');
	if (!list) { return; }
	list.innerHTML = `<div class="hint">${esc(T('loading'))}</div>`;
	let users = [];
	try { users = await demo('auraTeam.directory', [q]) || []; } catch { users = []; }
	list.innerHTML = users.length === 0 ? `<div class="hint">${esc(T('inviteNobody'))}</div>` : users.map((u) => `
		<div class="invite-user" data-uid="${esc(u.id)}" data-uname="${esc(u.displayName)}">
			<span class="avatar sm" style="background:${avatarColor(u.id)}">${esc((u.displayName || '?').slice(0, 1).toUpperCase())}</span>
			<span class="invite-user-name">${esc(u.displayName)}${u.email ? ` <span class="dim">· ${esc(u.email)}</span>` : ''}</span>
			${u.inTeam ? `<span class="pill">${esc(T('inTeam'))}</span>` : `<button class="btn ghost sm" data-invite-user="${esc(u.id)}">${esc(T('inviteSend'))}</button>`}
		</div>`).join('');
	list.querySelectorAll('[data-invite-user]').forEach((btn) => btn.addEventListener('click', (e) => {
		const row = e.currentTarget.closest('[data-uid]');
		e.stopPropagation();
		demo('auraTeam.selectTeam', [state.teamId], false);
		copyText((inviteCache.code || ''));
		toast(inviteCache.code ? `${esc(row.dataset.uname)}: ${T('inviteSentHint')}` : T('inviteCreateFirst'), inviteCache.code ? 'ok' : '');
	}));
}

/* ---------- Mock для демо-режима ---------- */
async function demo(command, args, talk = true) {
	if (!state?.demoMode) { return svc(command, args); }
	const ok = (msg) => { if (talk) { toast(msg, 'ok'); } };
	if (command === 'auraTeam.createTeam') {
		state.session.teams.push({ id: 't' + Date.now(), name: args[0] || 'Команда', role: 'owner' });
		ok(T('demoTeamCreated'));
	} else if (command === 'auraTeam.joinTeam') {
		state.session.teams.push({ id: 't' + Date.now(), name: 'Команда · ' + (args[0] || ''), role: 'dev' });
		ok(T('demoTeamJoined'));
	} else if (command === 'auraTeam.createInvite') {
		ok(T('demoInvite'));
		return { code: 'DEMO-' + Math.random().toString(36).slice(2, 8).toUpperCase() };
	} else if (command === 'auraTeam.createTask') {
		state.board.tasks.push({
			id: 'dt' + Date.now(), teamId: state.teamId, title: args[0] || 'Задача',
			description: '', status: args[1] || 'todo', position: 0,
			assigneeId: 'demo-me', assigneeName: state.profile.nickname || 'Вы'
		});
		ok(T('demoTaskAdded'));
	} else if (command === 'auraTeam.changeRole') {
		const [memberId, role] = args;
		const member = state.board?.members.find(m => m.id === memberId);
		if (member) { member.role = role; 		ok(T('demoRoleUpdated')); }
	} else if (command === 'auraTeam.selectTeam') {
		state.teamId = args[0] ?? state.teamId;
		ok(T('demoTeamSelected'));
	} else if (command === 'auraTeam.uploadArchive') {
		const name = args[0] || 'project';
		const projects = state.board?.projects ?? [];
		const project = projects.find((p) => String(p.name).toLowerCase() === String(name).toLowerCase())
			?? { id: 'dt' + Date.now(), teamId: state.teamId, name, gitUrl: '', defaultBranch: 'main' };
		project.archiveId = 'demo-archive-' + Date.now();
		if (!projects.includes(project)) { projects.push(project); }
		ok(T('archiveDone'));
	} else if (command === 'auraTeam.transferProject') {
		const [projectId, ownerId] = args;
		const project = state.board?.projects.find((proj) => proj.id === projectId);
		if (project) { project.ownerId = ownerId; }
		ok(T('transferred'));
	} else if (command === 'auraTeam.updateTask') {
		const [taskId, changes] = args;
		const task = state.board?.tasks.find((t) => t.id === taskId);
		if (task && changes) {
			if (changes.status) { task.status = changes.status; }
			if (typeof changes.position === 'number') { task.position = changes.position; }
			if (changes.title) { task.title = changes.title; }
			if (typeof changes.description === 'string') { task.description = changes.description; }
			if (changes.dueAt) { task.dueAt = changes.dueAt; }
			if (changes.assigneeId === null || changes.assigneeId === undefined) { task.assigneeId = undefined; task.assigneeName = undefined; }
			else { const m = state.board?.members.find((x) => x.id === changes.assigneeId); task.assigneeId = changes.assigneeId; task.assigneeName = m?.displayName || task.assigneeName; }
		}
		ok(T('taskMoved'));
	} else if (command === 'auraTeam.downloadArchive') {
		ok(T('archiveSaved'));
	} else {
		return svc(command, args);
	}
	render();
}

   Рендер
   ============================================================ */
const viewBody = () => document.getElementById('viewBody');
const badgeEl = () => document.getElementById('connBadge');
const avatarBtn = () => document.getElementById('avatarBtn');

function mount(html) {
	const body = viewBody();
	body.innerHTML = html;
	// перезапуск анимации входа
	const wrap = document.getElementById('view');
	wrap.style.animation = 'none';
	wrap.offsetHeight;
	wrap.style.animation = '';
	// Слушатели ripple вешаются только на свежие элементы (innerHTML каждый раз новые,
	// но помечаем data-ripple-bound на случай повторного прохода — защита от дублей).
	body.querySelectorAll('.btn:not([data-no-ripple])').forEach((b) => {
		if (b.dataset.ok || b.dataset.rippleBound) { return; }
		b.dataset.rippleBound = '1';
		b.addEventListener('pointerdown', ripple);
	});
	try { wire(); } catch (error) { console.error('[aura-team] wire:', error); }
}

function render() {
	try {
		renderInner();
	} catch (error) {
		// Любая ошибка рендера не должна оставлять чёрный экран — показываем сообщение.
		console.error('[aura-team] render:', error);
		try { mount(`<div class="empty"><div><div class="big">Ошибка интерфейса</div><div class="sub">${esc(String(error?.message || error))}</div><button class="btn primary mt12" onclick="location.reload()">Перезагрузить</button></div></div>`); } catch { /* игнорируем */ }
	}
}
function renderInner() {
	if (!state) { return; }
	// Прямые переходы из сайдбара: board/git/files — полноценные разделы.
	if (route === 'login' || route === 'register') { route = 'teams'; }
	if (!['teams','keys','profile','board','git','files'].includes(route)) { route = 'teams'; }
	updateChrome();
	// Вход = серверная сессия (не локальный профиль).
	const needsAuth = !state.signedIn;
	if (needsAuth) { return mount(renderAuth()); }
	if (route === 'keys') { return mount(renderKeys()); }
	if (route === 'profile') { return mount(renderProfile()); }
	if (route === 'board') { return mount(renderBoardSection()); }
	if (route === 'git') { return mount(renderGitSection()); }
	if (route === 'files') { void ensureArchives().then(() => { if (route === 'files') { mount(renderFilesSection()); wireFiles(); } }); return mount(renderFilesSection()); }
	return mount(renderTeams());
}

function updateChrome() {
	const badge = badgeEl();
	if (!badge) { return; }
	badge.textContent = state.demoMode ? T('connDemo') : state.signedIn ? T('connLive') : T('connOff');
	badge.className = 'badge ' + (state.demoMode ? 'demo' : state.signedIn ? 'live' : 'off');
	document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = T(el.dataset.t); });
	document.querySelectorAll('[data-tt]').forEach((el) => { el.title = T(el.dataset.tt); });
	// Аватар и поповер (Профиль/Выйти) показываем только после входа:
	// на экране входа/регистрации в шапке не должно быть профиля.
	const btn = avatarBtn();
	const pop = document.getElementById('avatarMenu');
	const authHidden = !state.signedIn;
	if (btn) {
		btn.classList.toggle('hidden', authHidden);
		if (!authHidden) {
			const color = flattenColor(state.profile?.avatarColor);
			btn.style.background = `linear-gradient(135deg, ${color}, ${color}99)`;
			btn.textContent = initials(state.profile?.nickname, 'A');
			btn.style.animation = 'popIn .3s var(--ease)';
		}
	}
	if (pop && authHidden) { pop.classList.add('hidden'); }
	const popName = document.getElementById('popName');
	const popId = document.getElementById('popId');
	if (popName) { popName.textContent = state.profile?.nickname || '—'; }
	if (popId) { popId.textContent = state.profile?.id || '—'; }
	document.querySelectorAll('.rail-btn').forEach((b) => b.classList.toggle('active', b.dataset.view === route));
	const navKeys = document.getElementById('navKeys');
	const keysCount = state.keys?.filter(k => !k.disabledAt).length ?? 0;
	if (navKeys && keysCount > 0) { navKeys.setAttribute('data-badge', String(keysCount)); } else if (navKeys) { navKeys.removeAttribute('data-badge'); }
}

function wireLoginForm() {
	// Кнопка-глаз: показать/скрыть пароль во всех полях с data-eye-for.
	document.querySelectorAll('.pass-eye[data-eye-for]').forEach((eye) => {
		const input = document.getElementById(eye.dataset.eyeFor);
		if (!input) { return; }
		eye.addEventListener('click', () => {
			const show = input.type === 'password';
			input.type = show ? 'text' : 'password';
			eye.classList.toggle('on', show);
			input.focus();
		});
	});
	const email = document.getElementById('loginEmail');
	const password = document.getElementById('loginPassword');
	const submit = document.getElementById('loginSubmit');
	const progress = document.getElementById('loginProgress');
	const switchTab = (tab) => { authTab = tab; render(); };
	document.querySelectorAll('[data-auth-tab]').forEach((t) => t.addEventListener('click', () => switchTab(t.dataset.authTab)));
	document.getElementById('goRegister')?.addEventListener('click', () => switchTab('register'));
	const go = async (event) => {
		if (!submit || !email || !password) { return; }
		ripple(event);
		const value = { email: email.value.trim(), password: password.value };
		if (!value.email || !value.password) { toast(T('loginFail'), 'err'); return; }
		submit.disabled = true;
		progress?.classList.remove('hidden');
		try {
			await svc('auraTeam.login', [value]);
			toast(T('regDone'), 'ok');
			render();
		} catch (err) { toast(err?.message || T('loginFail'), 'err'); }
		submit.disabled = false;
		progress?.classList.add('hidden');
	};
	submit?.addEventListener('click', go);
	password?.addEventListener('keydown', (event) => { if (event.key === 'Enter') { void go(event); } });
	const regSubmit = document.getElementById('regServerSubmit');
	const regName = document.getElementById('regServerName');
	const regEmail = document.getElementById('regServerEmail');
	const regPass = document.getElementById('regServerPassword');
	const regProgress = document.getElementById('regServerProgress');
	const goReg = async (event) => {
		if (!regSubmit || !regName || !regEmail || !regPass) { return; }
		ripple(event);
		const name = regName.value.trim();
		const mail = regEmail.value.trim();
		const pass = regPass.value;
		if (name.length < 2) { toast(T('regNameShort'), 'err'); return; }
		if (!/^\S+@\S+\.\S+$/.test(mail)) { toast(T('regBadEmail'), 'err'); return; }
		if (pass.length < 8) { toast(T('regPassShort'), 'err'); return; }
		regSubmit.disabled = true;
		regProgress?.classList.remove('hidden');
		try {
			await svc('auraTeam.register', [{ displayName: name, email: mail, password: pass }]);
			// Регистрация без письма: аккаунт активен сразу — входим автоматически.
			await svc('auraTeam.login', [{ email: mail, password: pass }]);
			toast(T('regServerDone'), 'ok');
			route = 'teams';
			render();
		} catch (err) { toast(err?.message || T('loginFail'), 'err'); }
		regSubmit.disabled = false;
		regProgress?.classList.add('hidden');
	};
	regSubmit?.addEventListener('click', goReg);
	regPass?.addEventListener('keydown', (event) => { if (event.key === 'Enter') { void goReg(event); } });
}
function wireAuth() {
	wireLoginForm();
	// Локальный демо-профиль убран: wireAuth = только серверные формы (login/register).
}

		filterMember = board.members.find((m) => m.id === boardFilter.member) ?? null;
	} else if (boardFilter?.task) {
		highlightTask = board.tasks.find((t) => t.id === boardFilter.task)?.id ?? null;
	}
	const isOverdue = (t) => t.dueAt && t.status !== 'done' && new Date(t.dueAt).getTime() < Date.now();
	const visible = (t) => (!filterMember || t.assigneeId === filterMember.id) && (!boardOverdueOnly || isOverdue(t));
	const filterBar = (filterMember || highlightTask)
		? `<div class="board-filter"><span>⌕ ${filterMember ? esc(filterMember.displayName) : '⌗'} </span><button class="btn ghost" id="boardFilterClear">${esc(T('cancel'))}</button></div>`
		: '';
	return `${filterBar}<div class="board-cols">
		${statuses.map(([id, label], ci) => {
			// Внутри колонки: сначала без дедлайна/срочные, просроченные — вверху с подсветкой.
			const tasks = board.tasks.filter((t) => t.status === id && visible(t)).sort((a, b) => {
				if (!a.dueAt && !b.dueAt) { return (a.position || 0) - (b.position || 0); }
				if (!a.dueAt) { return 1; }
				if (!b.dueAt) { return -1; }
				return new Date(a.dueAt) - new Date(b.dueAt);
			});
			return `<div class="col" style="--i:${ci}" data-status="${id}">
				<div class="col-head"><span class="col-title">${esc(label)}</span><span class="col-count">${tasks.length}</span></div>
				${tasks.map((task, i) => {
					// Просрочено: дедлайн в прошлом и задача ещё не готова. Скоро: осталось < 48ч.
					const overdue = task.dueAt && task.status !== 'done' && new Date(task.dueAt).getTime() < Date.now();
					const soon = !overdue && task.dueAt && task.status !== 'done' && new Date(task.dueAt).getTime() - Date.now() < 48 * 3600e3;
					return `<div class="task-card ${task.id === highlightTask ? 'highlight' : ''} ${overdue ? 'overdue' : soon ? 'due-soon' : ''}" style="--i:${i}" draggable="true" data-task="${esc(task.id)}" data-open-task="${esc(task.id)}">
					<div class="task-title">${esc(task.title)}</div>
					${task.description ? `<div class="task-desc">${esc(task.description)}</div>` : ''}
					<div class="task-meta">
						<span class="status-dot st-${esc(task.status)}" title="${esc(statusLabel(task.status))}"></span>
						<span class="task-assignee">${task.assigneeName ? `${esc(task.assigneeName)}` : `<span class="dim">${esc(T('noAssignee'))}</span>`}</span>
						${task.dueAt ? `<span class="task-due ${overdue ? 'hot' : soon ? 'warm' : ''}">${overdue ? '⚠ ' : soon ? '⏰ ' : ''}${esc(timeAgoStr(task.dueAt))}</span>` : ''}
					</div>
				</div>`;
				}).join('')}
				<button class="btn ghost add-task" data-status="${id}">${esc(T('addTask'))}</button>
			</div>`;
		}).join('')}
	</div>`;
}
/* ---------- Общий модуль жестов (канбан, лента, мои задачи) ---------- */
// Карточка, перед которой вставится перетаскиваемая (по вертикальной позиции курсора).
function insertAfterPoint(col, clientY, excludeId) {
	const els = [...col.querySelectorAll('.task-card')].filter((el) => el.dataset.task !== excludeId);
	return els.reduce((closest, el) => {
		const box = el.getBoundingClientRect();
		const offset = clientY - box.top - box.height / 2;
		if (offset < 0 && offset > closest.offset) { return { offset, el }; }
		return closest;
	}, { offset: Number.NEGATIVE_INFINITY, el: null }).el;
}
// Свайп-удаление: pointerdown → 450мс удержание без смещения >8px → «armed» →
// сдвиг вправо ≥40% ширины → onDelete(id). Раньше — откат. pointercancel учитан.
function attachSwipeDelete(elements, onDelete) {
	elements.forEach((el) => {
		let timer = null, startX = 0, startY = 0, armed = false;
		const width = () => el.getBoundingClientRect().width || 300;
		const reset = () => { if (timer) { clearTimeout(timer); timer = null; } armed = false; el.classList.remove('armed'); el.style.transform = ''; };
		el.addEventListener('pointerdown', (e) => {
			if (e.button !== 0 || e.target.closest('select, button, input, a')) { return; }
			startX = e.clientX; startY = e.clientY; armed = false;
			timer = setTimeout(() => { armed = true; el.classList.add('armed'); }, 450);
		});
		el.addEventListener('pointermove', (e) => {
			if (timer === null && !armed) { return; }
			if (!armed) {
				// Сдвиг >8px до срабатывания таймера — это drag, не long-press.
				if (Math.abs(e.clientX - startX) > 8 || Math.abs(e.clientY - startY) > 8) { clearTimeout(timer); timer = null; }
				return;
			}
			const dx = Math.max(0, e.clientX - startX);
			el.style.transform = `translateX(${dx}px)`;
		});
		const finish = (e) => {
			const wasArmed = armed;
			const dx = e.clientX - startX;
			reset();
			if (wasArmed && dx > width() * 0.4) { onDelete(el.dataset.task || el.dataset.eventIndex); }
		};
		el.addEventListener('pointerup', finish);
		el.addEventListener('pointercancel', reset);
		el.addEventListener('pointerleave', (e) => { if (armed) { finish(e); } });
	});
}
// Тост «Удалено · Отменить» с восстановлением.
function deletedToast(onUndo) {
	const root = document.getElementById('toastRoot');
	const el = document.createElement('div');
	el.className = 'toast';
	el.innerHTML = `<span>${esc(T('deleted'))}</span><button class="toast-undo">${esc(T('undo'))}</button>`;
	root.appendChild(el);
	let done = false;
	el.querySelector('.toast-undo').addEventListener('click', () => { done = true; el.remove(); onUndo(); });
	setTimeout(() => { if (!done) { el.classList.add('out'); setTimeout(() => el.remove(), 260); } }, 6000);
}

function wireBoard() {
	const clearBtn = document.getElementById('boardFilterClear');
	if (clearBtn) { clearBtn.addEventListener('click', () => { boardFilter = null; render(); }); }
	const overdueBtn = document.getElementById('btnOverdueFilter');
	overdueBtn?.addEventListener('click', () => { boardOverdueOnly = !boardOverdueOnly; render(); });
	// Клик по карточке — карточка задачи (детали/редактирование). Не мешает drag&drop и контролам.
	document.querySelectorAll('[data-open-task]').forEach((card) => card.addEventListener('click', (e) => {
		if (e.target.closest('select, button, .task-status, .task-assignee')) { return; }
		if (card.classList.contains('dragging')) { return; }
		openTaskModal(card.dataset.openTask);
	}));
	let dragId = null;
	const cards = document.querySelectorAll('.task-card');
	cards.forEach((c) => {
		c.addEventListener('dragstart', () => { dragId = c.dataset.task; c.classList.add('dragging'); });
		c.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.task-card').forEach((x) => x.classList.remove('dragging', 'task-drop-before')); });
	});
	document.querySelectorAll('.col').forEach((col) => {
		col.addEventListener('dragover', (e) => {
			e.preventDefault();
			col.classList.add('drop-target');
			// Подсветка места вставки: перед какой карточкой упадёт перетаскиваемая.
			const after = insertAfterPoint(col, e.clientY, dragId);
			document.querySelectorAll('.task-card').forEach((x) => x.classList.remove('task-drop-before'));
			if (after) { after.classList.add('task-drop-before'); }
		});
		col.addEventListener('dragleave', () => col.classList.remove('drop-target'));
		col.addEventListener('drop', async (e) => {
			e.preventDefault();
			col.classList.remove('drop-target');
			if (!dragId) { return; }
			const moved = state.board.tasks.find((t) => t.id === dragId);
			const toStatus = col.dataset.status;
			if (!moved || !toStatus) { return; }
			// Собираем новый порядок колонки: все задачи статуса, минус перетаскиваемая, с вставкой на место курсора.
			const ordered = state.board.tasks.filter((t) => t.status === toStatus && t.id !== moved.id)
				.sort((a, b) => (a.position || 0) - (b.position || 0));
			const afterEl = insertAfterPoint(col, e.clientY, dragId);
			const afterId = afterEl?.dataset.task;
			const idx = afterId ? ordered.findIndex((t) => t.id === afterId) : ordered.length;
			const insertAt = idx === -1 ? ordered.length : idx;
			ordered.splice(insertAt, 0, moved);
			// Локально применяем и отправляем reorder одним запросом (позиции 0..n на сервере).
			ordered.forEach((t, i) => { t.status = toStatus; t.position = i; });
			try { await demo('auraTeam.reorderTasks', [toStatus, ordered.map((t) => t.id)]); } catch (err) { toast(err.message, 'err'); }
			render();
		});
	});
	// Свайп-удаление: удержание 450мс «взводит» карточку, тянем вправо ≥40% ширины — удаляем.
	attachSwipeDelete(document.querySelectorAll('.task-card'), async (id) => {
		try { await demo('auraTeam.deleteTask', [id]); } catch (err) { toast(err.message, 'err'); return; }
		render();
		deletedToast(async () => { try { await demo('auraTeam.restoreTask', [id]); } catch (err) { toast(err.message, 'err'); } render(); });
	});	document.querySelectorAll('.add-task').forEach((btn) => btn.addEventListener('click', () => {
		const status = btn.dataset.status;
		openModal({
			title: T('addTask'), actionText: T('create'),
			body: `<div class="field"><label>${esc(T('addTaskPh'))}</label><input data-task-title maxlength="80" placeholder="${esc(T('addTaskPh'))}" autofocus></div>`,
			onAction: async (overlay) => {
				const input = overlay.querySelector('[data-task-title]');
				if (!input?.value.trim()) { return true; }
				await demo('auraTeam.createTask', [input.value.trim(), status]);
				return false;
			}
		});
		setTimeout(() => document.querySelector('[data-task-title]')?.focus(), 30);
	}));
}

	if (!iso) { return ''; }
	const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
	if (s < 60) { return T('timeNow'); }
	if (s < 3600) { return Math.floor(s / 60) + ' мин'; }

	return Math.floor(s / 86400) + ' д';
}

function wireGit() {

		const checks = [...document.querySelectorAll('.change-check')];

			if (res && res.pushError) { toast(T('pushFail') + ': ' + res.pushError, 'err'); }

				${b.current ? '' : `<button class="btn sm ghost right" data-pick-branch="${esc(b.name)}">switch</button><button class="btn sm ghost" data-del-branch="${esc(b.name)}" title="${esc(T('delete'))}">×</button>`}
			</div>`).join('') +
			`<div class="row mt8 gap8"><input data-new-branch placeholder="${esc(T('branchCreatePh'))}" maxlength="80" style="flex:1"><button class="btn sm primary" data-create-branch>${esc(T('branchCreate'))}</button></div></div>`,
			onAction: async (overlay) => {

			}

		setTimeout(() => {

			}));

				try { await demo('auraTeam.deleteBranch', [b.dataset.delBranch]); b.closest('.member')?.remove(); } catch (err) { toast(err.message, 'err'); }

/* ---------- Банк ключей ---------- */
function providerColor(provider) {
	const p = String(provider || '').toLowerCase();
	if (p.includes('anthropic')) { return '#d97757'; }
	if (p.includes('google') || p.includes('gemini')) { return '#4285F4'; }
	if (p.includes('deepseek')) { return '#4d6bfe'; }
	if (p.includes('openrouter')) { return '#8b5cf6'; }
	return '#10b981';
}
function providerGlyph(provider) {
	return `<svg viewBox="0 0 24 24" fill="none"><path d="M12 12a3.2 3.2 0 1 0 0-6.4A3.2 3.2 0 0 0 12 12zm0 0v6.4M12 9.6h6.4" stroke="white" stroke-width="1.7" stroke-linecap="round"/></svg>`;
}
/* Приоритет: high / medium / low → подпись и цвет. */
function priorityMeta(priority) {
	const p = String(priority ?? 'medium').toLowerCase();
	if (p === 'high' || p === '2') { return { id: 'high', label: T('prioHigh'), cls: 'ok' }; }
	if (p === 'low' || p === '0') { return { id: 'low', label: T('prioLow'), cls: 'off' }; }
	return { id: 'medium', label: T('prioMedium'), cls: 'warn' };
}
function priorityWeight(priority) {
	const meta = priorityMeta(priority);
	return meta.id === 'high' ? 0 : meta.id === 'medium' ? 100 : 200;
}
function groupName(groupId) {
	if (!groupId) { return null; }
	const g = (state.keyGroups ?? []).find(x => x.id === groupId);
	return g ? g.name : null;
}
function renderKeys() {
	const keys = [...(state.keys ?? [])].sort((a, b) => priorityWeight(a.priority) - priorityWeight(b.priority) || String(a.provider).localeCompare(String(b.provider)));

	return `<div class="view-head">
			<div class="view-title">${esc(T('keysTitle'))} <span class="chip accent">${keys.length}</span></div>

			const prio = priorityMeta(key.priority);

			return `<div class="card key-card" style="--i:${i}">
			<div class="key-row">

				<span class="chip ${prio.cls}">${esc(prio.label)}</span>

				${key.disabledAt ? `<span class="chip off">${esc(T('disabled'))}</span>` : `<span class="chip ${pingCls}">${ping == null ? esc(T('pingUnknown')) : esc(T('pingMs').replace('{0}', ping))}</span>`}
			</div>
		</div>`; }).join('')}</div>` : `<div class="empty" style="--i:0"><div><div class="big">${esc(T('emptyKeys'))}</div></div></div>`}
		<div class="flex mt16">
			<button class="btn primary" id="btnAddKey">${esc(T('addKey'))}</button>

			<div class="field-grid">
				<div class="field"><label>${esc(T('nickname'))}</label><input id="pNick" maxlength="40" value="${esc(p.nickname || '')}"></div>
				<div class="field"><label>${esc(T('regEmail'))}</label><input id="pEmail" type="email" maxlength="120" value="${esc(p.email || '')}"></div>
			</div>
			<div class="field"><label>${esc(T('description'))}</label><textarea id="pDesc" rows="3" maxlength="240" placeholder="${esc(T('descrPh'))}">${esc(p.description || '')}</textarea></div>
			<div class="savebar"><button class="btn primary" id="btnSaveProfile">${esc(T('saveProfile'))}</button></div>
			<div class="profile-actions">
				<button class="btn ghost logout-btn" id="btnChangePassword">${esc(T('changePassword'))}</button>
				<button class="btn logout-danger logout-btn" id="btnLogout">${esc(T('logout'))}</button>
			</div>
		</div>
		${loginBlock}`;
}
function wireProfile() {
	wireLoginForm();
	// Загрузка аватарки: файл → canvas (256×256, JPEG) → dataURL → сервер настроек.
	const fileInput = document.getElementById('avatarFile');
	document.getElementById('btnAvatar')?.addEventListener('click', () => fileInput?.click());
	fileInput?.addEventListener('change', () => {
		const file = fileInput.files?.[0];
		if (!file) { return; }
		const reader = new FileReader();
		reader.onload = () => {
			const img = new Image();
			img.onload = async () => {
				const size = 256;
				const canvas = document.createElement('canvas');
				canvas.width = size; canvas.height = size;
				const ctx = canvas.getContext('2d');
				if (!ctx) { return; }
				// Обрезка по центру в квадрат.
				const side = Math.min(img.width, img.height);
				ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
				const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
				try { state.profile = await svc('auraTeam.setAvatar', [dataUrl]) ?? state.profile; toast(T('photoSaved'), 'ok'); render(); updateChrome(); }
				catch (err) { toast(err?.message || 'error', 'err'); }
			};
			img.src = String(reader.result);
		};
		reader.readAsDataURL(file);
		fileInput.value = '';
	});
	const saveBtn = document.getElementById('btnSaveProfile');
	saveBtn?.addEventListener('click', async (e) => {
		ripple(e);
		const data = {
			nickname: document.getElementById('pNick')?.value?.trim() || state.profile.nickname,
			email: document.getElementById('pEmail')?.value?.trim() || state.profile.email,
			description: document.getElementById('pDesc')?.value?.trim()
		};
		try { const res = await svc('auraTeam.registerProfile', [data]); if (res) { state.profile = res; } toast(T('regDone'), 'ok'); render(); }
		catch (err) { toast(err.message, 'err'); }
	});
	const changePasswordBtn = document.getElementById('btnChangePassword');
	changePasswordBtn?.addEventListener('click', () => {
		if (!state.signedIn || state.demoMode) { toast(T('loginTitle'), 'err'); return; }
		openModal({
			title: T('changePassword'),
			sub: T('newPassword'),
			body: `<div class="field"><label>${esc(T('currentPassword'))}</label><input data-current-password type="password" autocomplete="current-password"></div><div class="field"><label>${esc(T('newPassword'))}</label><input data-new-password type="password" minlength="8" autocomplete="new-password"></div>`,
			actionText: T('save'),
			onAction: async overlay => {
				const currentPassword = overlay.querySelector('[data-current-password]').value;
				const newPassword = overlay.querySelector('[data-new-password]').value;
				if (!currentPassword || newPassword.length < 8) { toast(T('regPassShort'), 'err'); return true; }
				try { await svc('auraTeam.changePassword', [{ currentPassword, newPassword }]); toast(T('passwordChanged'), 'ok'); state.signedIn = false; state.session = undefined; render(); } catch (err) { toast(err?.message || T('loginFail'), 'err'); return true; }
			}
		});
	});
	const logoutBtn = document.getElementById('btnLogout');
	logoutBtn?.addEventListener('click', async () => {
		try { await svc('auraTeam.signOut'); } catch { /* офлайн */ }
		state.profile.nickname = '';
		state.signedIn = false;
		render();
	});
	document.querySelectorAll('[data-copy]').forEach((el) => el.addEventListener('click', () => copyText(el.dataset.copy)));
}

/* ---------- Иконки рейла уже в HTML; здесь обработчики ---------- */
let chromeWired = false;
function wireChrome() {
	// Слушатели chrome вешаются ОДИН раз: rail-кнопки — статичные элементы шапки,
	// повторная навеска при каждом рендере накапливала слушатели (утечка при частых кликах).
	if (chromeWired) { return; }
	chromeWired = true;
	document.querySelectorAll('.rail-btn').forEach((b) => b.addEventListener('click', () => { route = b.dataset.view; render(); }));
	const avatarMenu = document.getElementById('avatarMenu');
	const avatar = document.getElementById('avatarBtn');
	if (avatar) {
		avatar.addEventListener('click', (e) => { e.stopPropagation(); avatarMenu.classList.toggle('hidden'); });
		document.addEventListener('click', (e) => { if (!e.target.closest('#avatarMenu') && !e.target.closest('#avatarBtn')) { avatarMenu.classList.add('hidden'); } });
		avatarMenu.querySelectorAll('[data-act]').forEach((item) => item.addEventListener('click', () => {
			avatarMenu.classList.add('hidden');
			if (item.dataset.act === 'profile') { route = 'profile'; render(); }
			else if (item.dataset.act === 'logout') {
				void (async () => {
					try { await svc('auraTeam.signOut'); } catch { /* офлайн */ }
					state.profile.nickname = '';
					state.signedIn = false;
					render();
				})();
			}
		}));
	}
}

/* ---------- Скелетон при старте ---------- */
function skeleton() {
	mount('<div class="card-grid">' + Array.from({ length: 3 }).map(() => '<div class="card"><div class="skeleton" style="height:14px;width:45%"></div><div class="skeleton" style="height:10px;width:70%;margin-top:10px"></div><div class="skeleton" style="height:10px;width:55%;margin-top:8px"></div></div>').join('') + '</div>');
}

/* ---------- Маунт: диспетчер по событиям ---------- */
function wire() {
	if (!state) { return; }
	wireChrome();
	// Вход = серверная сессия.
	const needsAuth = !state.signedIn;
	if (needsAuth) { wireAuth(); return; }
	if (route === 'keys') { wireKeys(); return; }
	if (route === 'profile') { wireProfile(); return; }
	if (route === 'board') { wireBoard(); return; }
	if (route === 'git') { wireGit(); return; }
	if (route === 'files') { wireFiles(); return; }
	wireTabs();
	wireMembers();
	wireBoard();
	wireFiles();
	wireGit();
	const createBtn = document.getElementById('btnCreateTeam');
	createBtn?.addEventListener('click', () => {
		openModal({
			title: T('createTeam'), sub: T('newTeamSub'), actionText: T('create'),
			body: `<div class="field"><label>${esc(T('teamName'))}</label><input data-team-name maxlength="40" placeholder="My Team" autofocus></div>`,
			onAction: async (overlay) => {
				const name = overlay.querySelector('[data-team-name]')?.value?.trim();
				if (!name) { toast(T('teamName'), 'err'); return true; }
				await demo('auraTeam.createTeam', [name]);
				return false;
			}
		});
		setTimeout(() => document.querySelector('[data-team-name]')?.focus(), 30);
	});
	const joinBtn = document.getElementById('btnJoinTeam');
	joinBtn?.addEventListener('click', () => {
		openModal({
			title: T('joinTeam'), sub: T('inviteSub'), actionText: T('join'),
			body: `<div class="field"><label>${esc(T('inviteCode'))}</label><input data-join-code maxlength="24" placeholder="XXXXXXXXXXXX" spellcheck="false" autofocus></div>`,
			onAction: async (overlay) => {
				const code = overlay.querySelector('[data-join-code]')?.value?.trim();
				if (!code) { toast(T('inviteCode'), 'err'); return true; }
				await demo('auraTeam.joinTeam', [code]);
				return false;
			}
		});
		setTimeout(() => document.querySelector('[data-join-code]')?.focus(), 30);
	});
	const inviteBtn = document.getElementById('btnInvite');
	inviteBtn?.addEventListener('click', () => openInviteMenu());
	document.querySelectorAll('.card[data-team]').forEach((card) => card.addEventListener('click', () => {
		const id = card.dataset.team;
		if (id !== state.teamId) {
			state.teamId = id;
			void demo('auraTeam.selectTeam', [id]);
		}
	}));
}

/* ---------- Старт ---------- */
skeleton();
vscode.postMessage({ type: 'ready' });
// первая отрисовка по приходу state; wire() вызывается после каждого mount

</script>
